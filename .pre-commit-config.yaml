# Pre-commit configuration
# Install: pip install pre-commit && pre-commit install
# Run:    pre-commit run --all-files
#
# The hooks below enforce the production-readiness design 13
# hard rules per ADR-0015. Each rule has a pre-commit hook + a CI
# job in .github/workflows/ga-acceptance.yml. Rules 1-13.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm 模板含 Go template 指令（{{- if }} 等），非纯 YAML —— 排除
        exclude: ^(docs/|infra/helm/|\.worktrees/|\.tmp-build-context/)|^docker-compose\.(acceptance|paimon|task5)\.yml$
      - id: check-json
        # acceptance evidence 是运行时抓包产物（非规范 JSON，含日志前缀行）
        exclude: ^acceptance/evidence/
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      # rule 13: no-commit-to-branch (main protected)
      # 注：本仓工作流为直推 main（单人仓 + goal 模式），pre-commit --all-files
      # 模式下此 hook 对 HEAD 分支误报 → 保留声明，CI 侧由 ga-010 证据链把关
      - id: no-commit-to-branch
        args: [--branch=main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^\.worktrees/
      - id: ruff-format
        exclude: ^\.worktrees/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.11
    hooks:
      # uv-lock 跳过：root pyproject 是 workspace 清单（无 [project] 表），
      # uv lock 需在 workspace 上下文跑，pre-commit 直跑必失败 —— 由
      # `uv sync --frozen`（CI ga-014 已用）承担锁一致性校验
      - id: uv-lock
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        files: \.(yml|yaml|json|md)$
        exclude: ^(docs/active/(specs|prd|reports)/|docs/|infra/helm/|acceptance/|\.pre-commit-config\.yaml)

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.1-beta
    hooks:
      - id: hadolint-docker
        files: ^mate-platform-backend/.*Dockerfile.*$
        # dev 镜像刻意不 pin 版本（uv/pip 顶层面解析）+ root 构建；
        # DL3008/3013/3025/3002/3066 登记忽略，security 相关（DL3048 等）仍生效
        args: [--ignore, DL3008, --ignore, DL3013, --ignore, DL3025, --ignore, DL3002, --ignore, DL3066]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        # warning 级加 SC 豁免：SC2015（A&&B||C 为既有部署惯用）/ SC2034（
        # 环境变量自文档）/ SC2010（ls|grep 管道）/ SC1082（UTF-8 BOM 历史）
        args: [--severity=warning, --exclude=SC2015,SC2034,SC2010,SC1082]
        files: \.(sh|bash)$

  # -------------------------------------------------------------------
  # GA-ACCEPTANCE additions (ADR-0015)
  # -------------------------------------------------------------------

  # rule 12: Secret 不进 git (gitleaks, custom .gitleaks.toml extends default).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  # rule 3: 没有 tenant 上下文，不访问 repository (raw-SQL detector).
  # Forbid session.execute(text("...")) in app-*/src and
  # mate-platform-backend/packages/*/src/mate_*/src.
  - repo: local
    hooks:
      - id: forbid-raw-sql
        name: forbid raw SQL session.execute(text(...)) in app sources
        entry: python scripts/ci/forbid_raw_sql.py
        language: system
        types: [python]
        files: ^mate-platform-backend/.*/src/.*\.py$

  # rule 6: 静态检查 (pyright strict).
  - repo: local
    hooks:
      # pyright strict 权威检查在 CI ga-006 job（working-directory=backend，
      # 读 pyrightconfig.json）。pre-commit 内运行缺 cwd/依赖必然误报 → manual
      - id: pyright-strict
        name: pyright strict (authoritative run in CI ga-006)
        entry: python -m pyright packages/mate-platform/src packages/mate-clients/src
        language: system
        pass_filenames: false
        types: [python]
        stages: [manual]

  # rule 11: helm-docs 同步每个子 chart 的 README.
  - repo: local
    hooks:
      - id: helm-docs-sync
        name: helm-docs sync check
        entry: bash -c 'cd infra/helm && (command -v helm-docs >/dev/null 2>&1 && helm-docs --dry-run --sort-values-order=file) || echo "helm-docs not installed; skipping (CI enforces)"'
        language: system
        pass_filenames: false
        files: ^infra/helm/.*\.(yaml|yml)$

  # rule 4: 外部系统没有 ACL Client，业务代码不直连 (forbid bare httpx).
  - repo: local
    hooks:
      - id: forbid-bare-httpx
        name: forbid bare httpx.Client() in app sources (use mate-clients ACL)
        entry: python scripts/ci/forbid_bare_httpx.py
        language: system
        types: [python]
        files: ^mate-platform-backend/.*/src/.*\.py$

  # rule 4 (Kafka): forbid bare kafka.KafkaProducer in app sources
  # (use mate-clients.kafka ACL producer).
  - repo: local
    hooks:
      - id: forbid-bare-kafka-producer
        name: forbid bare KafkaProducer() in app sources (use mate-clients.kafka)
        entry: python scripts/ci/forbid_bare_kafka_producer.py
        language: system
        types: [python]
        files: ^mate-platform-backend/.*/src/.*\.py$

  # rule 12 (values): forbid inline secret literals in helm values
  # (use existingSecretName / existingSecretKey).
  - repo: local
    hooks:
      - id: forbid-external-secret-plain
        name: forbid inline password/apiKey/token in helm values
        entry: python scripts/ci/forbid_external_secret_plain.py
        language: system
        files: ^infra/helm/.*values.*\.ya?ml$

  # rule 5: Production profile 禁止 fake / mock / memory fallback.
  - repo: local
    hooks:
      - id: forbid-legacy-fallback
        name: forbid legacy_login_compat=true in production
        entry: python scripts/ci/forbid_legacy_fallback.py
        language: system
        pass_filenames: false

  # rule 7: 契约或集成测试跳过不标记 Accepted (forbid skip/xfail).
  - repo: local
    hooks:
      - id: forbid-skip-tests
        name: forbid pytest.skip / @pytest.mark.xfail in tests/
        entry: python scripts/ci/forbid_skip_tests.py
        language: system
        types: [python]
        files: ^.*/tests/.*\.py$

  # rule 10: 所有状态以验收证据为准 (require evidence files).
  - repo: local
    hooks:
      - id: require-evidence-on-accept
        name: refuse delivery/*.md to be merged without an evidence/*-ACCEPTANCE.md
        entry: python scripts/ci/require_evidence.py

        language: system
        pass_filenames: false
        files: ^docs/active/delivery/PROGRAM-BOBOARD\.md$

  # GOVERN-02 (2026-08-07): 拒绝生产代码 import 退役的 mate-tech-iam 包
  # 退役时间表见 docs/active/specs/2026-08-07-iam-deprecation-finalize.md
  - repo: local
    hooks:
      - id: forbid-iam-dep-imports
        name: forbid production imports of DEPRECATED mate_tech_iam
        entry: python scripts/ci/forbid_iam_dep_imports.py
        language: system
        pass_filenames: false

  # GOVERN-07 (2026-08-07): 拒绝 Spring 时代产物（acceptance/scripts/e2e_smoke.ps1、
  # acceptance/logs/TECH-*.log、start-{dashboard-dev,swagger,tech-services}.ps1、
  # build-all-7.bat、Dockerfile.agent / .app-kb）出现在仓库根
  - repo: local
    hooks:
      - id: forbid-legacy-artifacts
        name: refuse Spring-era artefacts outside _archive/
        entry: python scripts/ci/forbid_legacy_artifacts.py
        language: system
        pass_filenames: false
