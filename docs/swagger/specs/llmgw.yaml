openapi: 3.1.0
info:
  title: mate-tech-llmgw
  version: 0.1.0
  description: LLM Gateway - multi-provider routing, quota, cache, fallback
paths:
  /api/v1/llm/chat:
    post:
      summary: 非流式 chat
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseAPI'
        '501':
          description: Provider not implemented
  /api/v1/llm/chat/stream:
    post:
      summary: SSE 流式 chat
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream: {}
  /api/v1/llm/embeddings:
    post:
      summary: 嵌入向量
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: OK
  /healthz:
    get:
      summary: 健康检查
      tags: [meta]
      responses:
        '200':
          description: OK
components:
  schemas:
    ChatMessage:
      type: object
      properties:
        role: {type: string}
        content: {type: string}
        name: {type: string, nullable: true}
        tool_call_id: {type: string, nullable: true}
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string}
        messages:
          type: array
          items: {$ref: '#/components/schemas/ChatMessage'}
        temperature: {type: number, default: 1.0}
        max_tokens: {type: integer, nullable: true}
        tools:
          type: array
          items: {type: object}
    ChatResponseAPI:
      type: object
      properties:
        content: {type: string}
        model: {type: string}
        finish_reason: {type: string, nullable: true}
        tool_calls: {type: array, items: {type: object}}
        usage: {type: object}
    EmbeddingRequest:
      type: object
      required: [input]
      properties:
        model: {type: string, default: text-embedding-3-small}
        input:
          type: array
          items: {type: string}
    EmbeddingResponse:
      type: object
      properties:
        model: {type: string}
        data: {type: array, items: {type: object}}
        usage: {type: object}