  - name: metrics
    description: 数据指标平台 (MATE-DATA)
    # ============= BigData =============
    BigDataSource:
      type: object
      required: [sourceId, name, sourceType, host, port, authType, status]
      properties:
        sourceId:
          type: string
        tenantId:
          type: string
        name:
          type: string
          maxLength: 64
        sourceType:
          type: string
          enum: [HIVE, HBASE, CLICKHOUSE, DORIS, STARROCKS, ICEBERG, HUDI, DELTA, PRESTO, TRINO, KAFKA, PULSAR, HDFS]
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
        schema:
          type: string
        authType:
          type: string
          enum: [NONE, USER_PASSWORD, KERBERY, LDAP]
          default: NONE
        authConfig:
          type: object
        sslEnabled:
          type: boolean
          default: false
        poolSize:
          type: integer
          default: 10
        queryTimeout:
          type: integer
          default: 60
        batchSize:
          type: integer
          default: 1000
        sampleRate:
          type: number
          default: 0.1
        status:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, ERROR, DELETED]
        businessDomain:
          type: string
    CDCTask:
      type: object
      required: [taskId, name, sourceId, syncMode, targetType, targetName, status]
      properties:
        taskId:
          type: string
        name:
          type: string
        sourceId:
          type: string
        syncMode:
          type: string
          enum: [FULL_INCREMENTAL, INCREMENTAL_ONLY, SNAPSHOT_ONLY]
        startPosition:
          type: string
          enum: [LATEST, CURRENT_TIMESTAMP, CUSTOM]
        customPosition:
          type: string
        targetType:
          type: string
          enum: [KAFKA, CLICKHOUSE, HUDI, ICEBERG]
        targetName:
          type: string
        schemaEvolution:
          type: string
          enum: [IGNORE, ADD_NEW_COLUMNS, RESTRICT]
        tables:
          type: array
          items:
            type: object
        concurrency:
          type: integer
          default: 1
        batchSize:
          type: integer
          default: 1000
        status:
          type: string
          enum: [PENDING, SNAPSHOTTING, RUNNING, PAUSED, FAILED, STOPPED]
        lagMs:
          type: integer
        totalRecords:
          type: integer
          format: int64
    ETLTask:
      type: object
      required: [taskId, name, mode, sourceIds, targetType, targetTable, writeMode, status]
      properties:
        taskId:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [BATCH_SPARK, BATCH_FLINK, STREAMING_FLINK, STREAMING_SPARK, SQL_TRANSFORM]
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        sourceIds:
          type: array
          items:
            type: string
        sourceTables:
          type: array
          items:
            type: string
        transformDag:
          type: object
        transformSql:
          type: string
        incrementalField:
          type: string
        targetType:
          type: string
          enum: [HIVE, CLICKHOUSE, ICEBERG, HUDI, DELTA, DORIS]
        targetSourceId:
          type: string
        targetTable:
          type: string
        writeMode:
          type: string
          enum: [OVERWRITE, APPEND, UPSERT, MERGE]
        triggerType:
          type: string
          enum: [MANUAL, SCHEDULED, EVENT]
        cron:
          type: string
        status:
          type: string
          enum: [DRAFT, READY, RUNNING, SUCCESS, FAILED, CANCELLED, TIMEOUT]
        executorNum:
          type: integer
        executorMemory:
          type: integer
        driverMemory:
          type: integer
        queue:
          type: string
    SchedulerTask:
      type: object
      required: [schedulerId, name, taskType, taskId, triggerType, status]
      properties:
        schedulerId:
          type: string
        name:
          type: string
        taskType:
          type: string
          enum: [ETL_TASK, CDC_TASK, QUALITY_CHECK, CUSTOM_ACTION]
        taskId:
          type: string
        triggerType:
          type: string
          enum: [CRON, EVENT, MANUAL, DEPENDENCY]
        cron:
          type: string
        dependsOn:
          type: array
          items:
            type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        retryCount:
          type: integer
        timeout:
          type: integer
        status:
          type: string
          enum: [ACTIVE, PAUSED, EXPIRED, DELETED]
        notifyChannels:
          type: array
          items:
            type: string
        notifyTargets:
          type: array
          items:
            type: string
    Metric:
      type: object
      required: [metricId, name, code, type, sourceId, sourceTable, sourceField, aggregation, calculationFrequency, status]
      properties:
        metricId:
          type: string
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [ATOMIC, DERIVED, COMPOSITE, REALTIME]
        sourceId:
          type: string
        sourceTable:
          type: string
        sourceField:
          type: string
        aggregation:
          type: string
          enum: [SUM, AVG, COUNT, MAX, MIN, LAST]
        filter:
          type: string
        dimensions:
          type: array
          items:
            type: string
        formula:
          type: string
        calculationFrequency:
          type: string
          enum: [REALTIME, MINUTELY, HOURLY, DAILY]
        alertMin:
          type: number
        alertMax:
          type: number
        alertChangeRate:
          type: number
        status:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, ERROR]
        lastValue:
          type: number

