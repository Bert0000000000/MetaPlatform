openapi: 3.0.3

info:
  title: Mate Platform API
  version: 1.0.0
  description: |
    Mate Platform 企业级 AI 中台统一 API 契约
    共 198 个端点（含 57 个大数据端点），覆盖 8 大业务模块 + 大数据

    ## 后端服务映射
    - /v1/iam/* -> TECH-IAM
    - /v1/apphub/* -> TECH-EA
    - /v1/wfe/* -> TECH-WFE
    - /v1/ea/* -> TECH-EA
    - /v1/ont/* -> TECH-ONT
    - /v1/kb/* -> TECH-RAG
    - /v1/rag/* -> TECH-RAG
    - /v1/mcp/* -> TECH-MCP
    - /v1/dw/* -> MATE-AGENT
    - /v1/copilot/* -> MATE-AGENT
    - /v1/superai/* -> MATE-AGENT
    - /v1/llmgw/* -> TECH-LLMGW
    - /v1/a2a/* -> MATE-A2A
    - /v1/dashboard/* -> TECH-IAM 扩展
    - /v1/data/* -> MATE-DATA（大数据源/CDC/ETL）
    - /v1/etl/* -> MATE-DATA
    - /v1/scheduler/* -> MATE-DATA
    - /v1/metrics/* -> MATE-DATA
    
  contact:
    name: Mate Platform Team
    email: team@metaplatform.io

servers:
  - url: /api
    description: 通过 TECH-GW 网关
  - url: http://localhost:4010
    description: 本地 Prism Mock

security:
  - BearerAuth: []
  - ApiKeyAuth: []

