spring:
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  config:
    import: []
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
      - org.springframework.cloud.context.refresh.ContextRefresherAutoConfiguration
      - com.alibaba.cloud.ai.agent.nacos.config.NacosAgentConfig
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.cloud.autoconfigure.RefreshAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.nacosconfig.NacosConfigAutoConfiguration
      - com.alibaba.cloud.nacos.registry.NacosServiceRegistryAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.annotations.McpServerAnnotationScannerAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.annotations.McpServerSpecificationFactoryAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.nacos.NacosMcServerAutoConfiguration
      - org.springframework.ai.mcp.client.autoconfigure.McpClientAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.McpServerAutoConfiguration
  # 提供一个虚拟的 DashScope API key 以避免启动失败
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder-for-dev-only-not-real}
  datasource:
    url: jdbc:postgresql://localhost:5432/metaplatform_ont
    username: meta
    password: meta
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:mate-platform-default-secret-key-must-be-over-32-bytes}

mate:
  llmgw:
    base-url: http://localhost:8210
    default-model: qwen-max
    timeout-seconds: 30
