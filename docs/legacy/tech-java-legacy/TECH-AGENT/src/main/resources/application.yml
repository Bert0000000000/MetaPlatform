server:
  port: 8511

spring:
  application:
    name: mate-agent-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/metaplatform_agent?stringtype=varchar
    username: ${DB_USER:meta}
    password: ${DB_PASSWORD:meta}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_jdbc_type_for_string: 12
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: filesystem:src/main/resources/db/migration/tech-agent,filesystem:src/main/resources/db/migration/tech-agent-shared
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  health:
    neo4j:
      enabled: false
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

# ---------------------------------------------------------------------------
# DeerFlow Gateway (本地 docker compose，本会话文档见 2026-07-26-deerflow-local-deploy-guide.md)
# ---------------------------------------------------------------------------
deerflow:
  gateway-url: ${DEER_FLOW_GATEWAY_URL:http://host.docker.internal:2026/api}
  internal-token: ${DEER_FLOW_INTERNAL_TOKEN:meta-platform-dev-internal-token-2026}
  owner-user-id: ${DEER_FLOW_OWNER_USER_ID:deerflow-internal-owner}
  request-timeout-ms: ${DEER_FLOW_REQUEST_TIMEOUT_MS:30000}
  stream-timeout-ms: ${DEER_FLOW_STREAM_TIMEOUT_MS:60000}
  reconnect-timeout-ms: ${DEER_FLOW_RECONNECT_TIMEOUT_MS:60000}
  enabled: ${DEER_FLOW_ENABLED:true}