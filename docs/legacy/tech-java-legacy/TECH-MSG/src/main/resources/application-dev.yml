spring:
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  config:
    import: []
  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.registry.NacosServiceRegistryAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - org.springframework.cloud.autoconfigure.RefreshAutoConfiguration
      - org.springframework.cloud.context.refresh.ContextRefresherAutoConfiguration


  datasource:
    url: jdbc:postgresql://localhost:5432/metaplatform_msg
    username: meta
    password: meta
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
app:
  msg:
    outbox:
      poll-interval-ms: 5000
      batch-size: 100
      max-retries: 3
      backoff-initial-ms: 1000
      backoff-max-ms: 60000
      backoff-multiplier: 2.0
      dlq-topic: metaplatform.dlq
    consumer-group:
      monitor-interval-ms: 30000
    realtime:
      topics:
        metrics: metaplatform.dashboard.metrics
        notifications: metaplatform.dashboard.notifications
        deliverables: metaplatform.dashboard.deliverables
