server:
  port: 8210

spring:
  application:
    name: tech-llmgw
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/metaplatform_llmgw?stringtype=varchar
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_jdbc_type_code_for_string: 12
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tech-llmgw
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: metaplatform
        # Nacos 3.0+ gRPC 端口（默认 9848 即 server-addr+1000）
        grpc-port: 9848
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # Nacos 3.0+ Config 走 9849（独立于 discovery 的 9848）
        grpc-port: 9849
        namespace: metaplatform
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

# SAA DashScope (阿里云通义千问)
spring.ai:
  alibaba:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
      chat:
        options:
          model: qwen-max
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024

# LLMGW 自研配置
llmgw:
  chat:
    default-model: qwen-max
    timeout-seconds: 120
    stream-timeout-seconds: 300
  routing:
    default-strategy: priority
  ratelimit:
    enabled: true
    default-rpm: 60
  audit:
    enabled: true
    retention-days: 90

logging:
  level:
    com.metaplatform.llmgw: DEBUG
    org.springframework.cloud: INFO
