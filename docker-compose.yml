  # 1. 闂傚倸鍊搁崐鎼佸磹閹间礁纾圭€瑰嫭鍣磋ぐ鎺戠倞妞ゆ帒顦伴弲顏堟偡濠婂啰绠婚柛鈹惧亾濡炪倖甯婇懗鍫曞煝閹剧粯鐓涢柛娑卞枤缁犳﹢鏌涢幒鎾崇瑨闁宠閰ｉ獮妯虹暦閸ヨ泛鏁藉┑鐘茬棄閺夊簱鍋撻幘缁樺€块柨鏇楀亾闁宠绉瑰顕€宕奸悢鍙夊闂備胶顭堥張顒勬偡閵娾晛绀傞悘鐐板嫎娴滄粍銇勯幘璺轰户濠⒀嶉檮閵囧嫰濮€閿涘嫬鈷岄悗瑙勬磸閸旀垿銆佸☉姗嗙叆闁告侗鍨扮敮顒勬⒒閸屾瑧鍔嶉柣顏勭秺瀹曡绻濆顒佺€梺褰掓？閻掞箓宕曞Δ浣虹闁糕剝顨嗙粋瀣煟閺傛寧顥㈤柟顔款潐濞碱亪骞忓畝濠傚Τ闂備胶顭堢€涒晠宕濆▎鎾宠摕婵炴垶鐟﹂崕鐔兼煥濠靛棙鍣洪柣蹇撶墦濮婃椽宕崟顒佹嫳濠电偛寮剁换鍕垝鐠囨祴妲堟繛鍡樺灩閻﹀牓姊洪崨濠傚闁告柨绉归、姗€宕稿Δ浣叉嫽婵炴挻鍩冮崑鎾寸箾娴ｅ啿娉氶崶顒夋晝闁挎洍鍋撻柣銈囧亾缁绘繃绻濋崒婊冾杸闂?(濠电姷鏁告慨鐑藉极閸涘﹥鍙忛柣銏犲閺佸﹪鏌″搴″箹缂佹劖顨嗘穱濠囧Χ閸涱厽娈查梺鍝勬缁秵绌辨繝鍥ч柛娑卞幗濞堝爼姊哄ú璇插箺闁荤啿鏅犲濠氭偄閸忕厧鈧粯淇婇鐐存珳缂侇喖鐖煎娲焻閻愯尪瀚板褍澧界槐鎺楁偐閾忣偄纰嶉梺浼欑秮閺€杈╃紦閻ｅ瞼鐭欓悹鍥﹀嫎閸斿秹濡甸崟顖氱睄闁搞儺鐏濋幘瀵哥闁告侗鍘惧瓭闂佸疇顫夐崹鍧楀箖閳哄懎鍨傛い鎰剁稻閻﹀骸鈹戦悩鎰佸晱闁哥姵宀稿顐ｇ節濮橆剛鐤囧┑鐘绘涧椤戝懐绮堥崼銏″枑閹兼番鍔岀粣妤呮煕閳╁啰鈯曢柣鎾卞劦閺岋繝宕掑☉鍗炲妼濠电偠鍋愰崰搴ㄦ箒濠电姴锕ょ€氼噣鎯岄幒妤佺厸閻忕偟纭堕崑鎾诲箛娴ｅ憡鍊梻浣告啞閸旀垿宕濆畝鍕剁稏闁告侗鍠氱弧鈧梺闈涢獜缂嶅棗顭囬幇顓滀簻妞ゆ挾鍋為崰妯活殽?
  # ===========================================================================

  postgres:
    <<: [*restart, *logging]
    image: postgres:16-alpine
    container_name: mate-postgres
    environment:
      <<: *pg-creds
      POSTGRES_DB: ${POSTGRES_DB:-metaplatform}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-multiple-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meta} -d ${POSTGRES_DB:-metaplatform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # mate-tech-iam: 后台管理服务 (TECH-IAM)
  # 用户/角色/权限/组织/审计/系统配置；FR-DASH-006-01~05
  mate-tech-iam:
    <<: [*restart, *logging]
    build:
      context: ./mate-platform-backend
      dockerfile: packages/mate-tech-iam/Dockerfile
    image: mate-tech-iam:dev
    container_name: mate-tech-iam
    environment:
      IAM_DATA_DIR: /data
      IAM_DATABASE_URL: sqlite+aiosqlite:////data/mate_iam.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: mate-tech-iam
      CORS_ALLOW_ORIGINS: "*"
    ports:
      - "${IAM_ADMIN_PORT:-8102}:8102"
    volumes:
      - iam_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8102/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: mate-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: [*restart, *logging]
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: mate-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meta}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-metasecretkey123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    <<: [*restart, *logging]
    image: milvusdb/milvus:v2.5.0
    container_name: mate-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      DEPLOY_MODE: standalone
      ETCD_USE_EMBED: "true"
      MINIO_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
      COMMON_SECURITY_ENABLED: "false"
      TZ: Asia/Shanghai
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - milvusdata:/var/lib/milvus
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G

  neo4j:
    <<: [*restart, *logging]
    image: neo4j:5.20-community
    container_name: mate-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mate-pass}"
      NEO4J_PLUGINS: "[]"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_default__listen__address: "0.0.0.0"
      TZ: Asia/Shanghai
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  kafka:
    <<: [*restart, *logging]
    image: confluentinc/cp-kafka:7.8.0
    container_name: mate-kafka
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      # 濠电姷鏁告慨鐑藉极閸涘﹥鍙忛柣鎴ｆ閺嬩線鏌熼梻瀵割槮缁炬儳娼￠弻鐔衡偓鐢殿焾瀛濈紓浣界堪閸婃繈寮婚敃鈧灒濞撴凹鍨遍敍鍡涙偡濠婂懎顣奸悽顖涘笧婢规洘绺介崨濠勫幗闂佸綊鍋婇崹浼存儍濞差亝鐓熸繛鎴炵墪閸旓附鎱ㄦ繝鍐┿仢鐎规洦鍋婂畷鐔碱敇濞戞瑧鈧亶姊? advertised listener 闂傚倸鍊搁崐鎼佸磹閹间礁纾归柟闂寸绾惧綊鏌ｉ幋锝呅撻柛濠傛健閺屻劑寮村Δ鈧禍鎯ь渻閵堝簼绨婚柛鐔告綑閻ｇ柉銇愰幒婵囨櫔闂佸憡渚楅崹鐗堟叏濞差亝鈷掑ù锝勮濞兼帡鏌涢弴鐐典粵闁伙絽澧庣槐鎾存媴閹绘帊澹曞┑鐘灱濞夋稒寰勯崶顒€纾婚柟鎹愬吹瀹撲線鏌涢…鎴濇灈濠殿喖閰ｅ楦裤亹閹烘挻鏆犻梺鎼炲妼濞硷繝鐛繝鍥х閻犲洦鐓￠弫婊冣攽鎺抽崐鎾绘嚄閸洖鍌ㄩ梺顒€绉甸埛鎴︽⒒閸喍绶辨俊顖氱墦閺屾盯鎮╁畷鍥ь潷闂佸搫鎳庨悥濂搞€佸▎鎾崇鐟滃繘鏁嶅鍫熲拺闂侇偆鍋涢懟顖涙櫠椤栨壕鍋撻崹顐ｇ凡閻庢矮鍗抽悰顕€宕堕澶嬫櫍闂佺粯蓱瑜板啰绮鑸碘拻闁稿本鐟х粣鏃€绻涙担鍐叉硽閸ヮ剦鏁囬柕蹇曞Х椤︻噣鎮楅獮鍨姎妞わ缚鍗冲畷鎴︽偄閹肩偘绨婚棅顐㈡处閹哥偓鏅跺☉銏＄厽?(闂傚倸鍊搁崐鎼佸磹閹间礁纾归柟闂寸绾剧懓顪冪€ｎ亝鎹ｉ柣顓炴閵嗘帒顫濋敐鍛婵°倗濮烽崑鐐烘偋閻樻眹鈧線寮撮姀鈩冩珖闂侀€炲苯澧撮柟铏矎閵囨劙骞掗幘璺哄箰闂佽绻掗崑鐘活敋瑜斿畷婵嗩潩閹典礁浜鹃柣鐔哄閸熺偟绱掔拠鎻掓殻濠碉紕鏁诲畷鐔碱敍濮橀硸鍟嬫繝寰锋澘鈧劙宕戦幘缁樺€垫慨妯煎帶瀵噣鏌?localhost 闂傚倸鍊搁崐鎼佸磹閹间礁纾归柟闂寸绾剧懓顪冪€ｎ亜顒㈡い鎰Г閹便劌顫滈崱妤€鈷掗梺缁樺笂缁瑩寮婚妶鍡樺弿闁归偊鍏橀崑鎾诲冀椤愮喎浜炬慨姗嗗墻閻撳ジ鏌″畝瀣М鐎殿噮鍣ｅ畷鎺戭潩椤戣法甯涚紓鍌氬€风拋鏌ュ磻閹炬剚鐔嗛柤鎼佹涧婵鏌涘▎鎰磳闁哄本鐩俊鐑芥晲閸涱収鐎撮梺璇茬箰缁诲牓宕濋幋锕€钃熼柨娑樺閸嬫捇鏁愭惔鈥茬敖婵犫拃鍛毈闁哄备鈧磭鏆嗛悗锝庡墰閻﹀牓鎮楃憴鍕闁绘牕銈稿畷娲焺閸愨晛顎撻梺鎼炲劘閸斿骸煤閹绢喗鐓涢悘鐐插⒔閵嗘帡鏌嶈閸撱劎绱為崱娑樼；闁告侗鍘鹃弳锔锯偓鍏夊亾闁逞屽墴閸┾偓妞ゆ帒鍠氬鎰箾閸欏鐭掔€规洘顨呴～婊堝焵椤掑嫬违濞达絽澹婂銊╂煃瑜滈崜鐔肩嵁閸愵喖顫呴柕鍫濇閸欏棝鏌ｆ惔顖滅У闁告挻鑹鹃埢鎾活敊閻ｅ瞼鐦?闂傚倸鍊搁崐鎼佸磹閹间礁纾归柟闂寸绾惧綊鏌ｉ幋锝呅撻柛濠傛健閺屻劑寮撮悙娴嬪亾瑜版帒纾块柟瀵稿У閸犳劙鏌ｅΔ鈧悧鍡欑箔閹烘鐓曢柕濞垮劚閳ь剚鎮傞崺鐐哄箣閿旇棄浜归柣搴℃贡婵挳藟濠靛牏纾藉ù锝囨嚀婵牊銇勯妸銉уⅵ闁糕斁鍋撳銈嗗坊閸嬫挾绱掗悩鑼х€规洘娲熷畷锟犳倷瀹ュ棛娲存い銏★耿閹瑩鍩￠崒婊€绨存繝鐢靛仜椤曨厽鎱ㄩ幘顕呮晞闁糕剝绋掗崑鍌炴煛閸ャ儱鐏柣鎾崇箰椤潡鎳滈悽鐐光偓鎺楁煕閹烘挻绶查柍瑙勫灴閸ㄩ箖宕橀崣澶娾偓顖炴⒑闂堟稒鎼愰悗姘緲椤曪綁骞橀鑺ユ闂佺粯锚瀵爼骞婂▎鎾粹拻濞撴埃鍋撻柍褜鍓氱粙鎾诲煘閹烘鐓曢柡鍌濇硶閻掓悂鏌ㄥ┑鍫濅粶妞ゎ厹鍔戝畷鐓庘攽閸℃埃鍋撻崹顔规斀閹烘娊宕愰幇鏉跨；闁规儳澧庣壕濂告煟濡寧鐝柕鍥ㄧ箖閹?
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',9092)); s.close()\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rabbitmq:
    <<: [*restart, *logging]
    image: rabbitmq:3.13-management-alpine
    container_name: mate-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-meta}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-meta-secret}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  nacos:
    <<: [*restart, *logging]
    image: nacos/nacos-server:v2.4.3-slim
    container_name: mate-nacos
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 1g
      NACOS_AUTH_ENABLE: "false"
      NACOS_ADMIN_USER: ${NACOS_USER:-nacos}
      NACOS_ADMIN_PASS: ${NACOS_PASSWORD:-nacos}
      JAVA_OPT: "-XX:-UseContainerSupport -Dnacos.core.sys.basic.processors=8 -Dserver.tomcat.accept-count=1000"
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_HTTP_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacosdata:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
