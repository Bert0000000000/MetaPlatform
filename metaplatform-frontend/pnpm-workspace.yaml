packages:
  - 'apps/*'
  - 'packages/*'

# NOTE: This file used to carry an invalid `allowBuilds:` block (not a
# pnpm field). pnpm 11 freezes the allow-list into the lockfile, so the
# actual fix lives in `.github/workflows/ci.yml` (install step) which
# runs `pnpm install --ignore-scripts` followed by
# `pnpm rebuild puppeteer esbuild`.

overrides:
  react: ^19.0.0
  react-dom: ^19.0.0
  antd: ^6.0.0
  typescript: ~5.7.0
  vite: ^6.4.0
