packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 reads `onlyBuiltDependencies` (NOT `allowBuilds`) from
# pnpm-workspace.yaml to decide which packages may run install scripts.
# `allowBuilds` is silently ignored, leading to
# [ERR_PNPM_IGNORED_BUILDS] puppeteer@25.4.0 in CI.
onlyBuiltDependencies:
  - esbuild
  - puppeteer

overrides:
  react: ^19.0.0
  react-dom: ^19.0.0
  antd: ^6.0.0
  typescript: ~5.7.0
  vite: ^6.4.0
