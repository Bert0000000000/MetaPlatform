# Docker Compose for the single MetaPlatform frontend SPA.
#
# Development: docker compose up web
# Production:  docker compose --profile prod up web-prod

name: metaplatform-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: mate-web
    command: ["pnpm", "--filter", "@mate/web", "dev", "--host", "0.0.0.0", "--port", "9200"]
    volumes:
      - .:/app
      - pnpm-store:/app/.pnpm-store
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    environment:
      NODE_ENV: development
      CI: "true"
      VITE_PROXY_HOST: host.docker.internal
    ports:
      - "9200:9200"
    restart: unless-stopped

  web-prod:
    profiles: ["prod"]
    container_name: mate-web-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "9200:80"
    restart: unless-stopped

volumes:
  pnpm-store:
