version: '3.9'

# Workaround for WSL2 + pytest_cache ACL locks on Windows:
# When `COPY packages/` reads from a Windows volume mount via 9P, buildkit
# tries to access .pytest_cache directories that have ACL locks (because
# pytest was running when daemon was alive), and Build aborts with:
#   "open .pytest_cache: Access is denied"
#
# Solution: copy packages/ (without .pytest_cache) to .tmp-build-context
# then point compose build at that clean context. This file overrides
# every service's `context: ./mate-platform-backend` to use the clean one.
#
# To regenerate .tmp-build-context, run:
#   python -c "import shutil, os; shutil.copytree('mate-platform-backend', '.tmp-build-context', ignore=shutil.ignore_patterns('.pytest_cache','__pycache__','.ruff_cache','.mypy_cache','*.pyc','.venv','venv','htmlcov','.coverage','.git','.env','.env.bak-*'))"
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml build
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#
# Note: after the issue is fixed (e.g. when .pytest_cache has been removed),
# switch back to plain `docker compose build` by removing this override file.

services:
  mate-tech-iam:
    build:
      context: ./.tmp-build-context
      dockerfile: packages/mate-tech-iam/Dockerfile
  mate-tech-llmgw:
    build:
      context: ./.tmp-build-context
      dockerfile: packages/mate-tech-llmgw/Dockerfile
  mate-tech-rag:
    build:
      context: ./.tmp-build-context
      dockerfile: Dockerfile
    # 持久化模式(RAG_MODE=pg):chunks+embedding(halfvec/pgvector)+registry
    # 全在共享 PG,milvus/neo4j 不再是硬依赖 —— depends_on 整体替换只留 postgres。
    environment:
      RAG_MODE: pg
      PG_DSN: postgresql://meta:meta@postgres:5432/metaplatform
    depends_on:
      postgres:
        condition: service_healthy
        required: true
  mate-tech-agent:
    build:
      context: ./.tmp-build-context
      dockerfile: Dockerfile.agent
  mate-tech-ont:
    build:
      context: ./.tmp-build-context
      dockerfile: packages/mate-tech-ont/Dockerfile
    environment:
      KERNEL_BACKEND: pg
      KERNEL_PG_DSN: postgresql://meta:meta@postgres:5432/metaplatform
      ONT_SEED_DEMO: "1"
  mate-tech-dw:
    build:
      context: ./.tmp-build-context
      dockerfile: packages/mate-tech-dw/Dockerfile
    environment:
      DW_STORE: sql
      MATE_DB_URL: postgresql+psycopg://meta:meta@postgres:5432/metaplatform
  mate-tech-msg:
    build:
      context: ./.tmp-build-context
      dockerfile: packages/mate-tech-msg/Dockerfile
  mate-tech-mcp:
    build:
      context: ./.tmp-build-context
      dockerfile: packages/mate-tech-mcp/Dockerfile
  mate-tech-obs:
    build:
      context: ./.tmp-build-context
      dockerfile: packages/mate-tech-obs/Dockerfile
  mate-app-kb:
    build:
      context: ./.tmp-build-context
      dockerfile: Dockerfile.app-kb
    # dev-only:跨容器 kb→rag 调用的快捷身份(与 dev_server 的 dev_token 同机制;
    # 生产走 Keycloak 服务身份)。token 放 .env.local(已 gitignore)。
    env_file:
      - .env.local
    environment:
      KB_STORE: sql
      MATE_DB_URL: postgresql+psycopg://meta:meta@postgres:5432/metaplatform
  mate-api-gateway:
    build:
      context: ./.tmp-build-context
      dockerfile: services/api-gateway/Dockerfile
  mate-auth-service:
    build:
      context: ./.tmp-build-context
      dockerfile: services/auth-service/Dockerfile