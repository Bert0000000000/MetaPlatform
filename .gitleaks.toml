# gitleaks 配置（ga-012 / 硬规则 12：Secret 不进 git）
#
# 继承 gitleaks 内置全部规则（JWT / AWS / GitHub / PEM / generic-api-key …），
# 仅对下面**显式列出**的 dev 夹具文件放行——放行理由逐条写明，谁加谁负责。
#
# 为什么现在才有这个文件：ga-acceptance.yml 的注释一直写着「custom .gitleaks.toml
# extends default」，但文件从未落盘（closeout 批在 realm-mate.json 里新增两个
# 专用 client 的 dev secret 时被 generic-api-key 抓到才发现——门禁是对的）。

[extend]
useDefault = true

[[allowlists]]
description = "dev realm 夹具：本地 compose 栈首启导入的 realm（admin/admin123 与三个 client 的 dev secret 都在其中，属于公开的开发凭据，不是任何真实环境的密钥；同文件里 2026-07 起就有共享 client 的 secret）"
paths = ['''infra/keycloak/realm-mate\.json''']
