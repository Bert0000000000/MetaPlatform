server:
  port: 8000

spring:
  application:
    name: tech-gw
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        type:
          preferred_jdbc_type_code_for_string: 12
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: metaplatform
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: metaplatform
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: false
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

app:
  jwt:
    secret: ${JWT_SECRET:mate-platform-default-secret-key-must-be-over-32-bytes}
  whitelist:
    paths:
      - /api/v1/iam/auth/login
      - /api/v1/iam/auth/register
      - /api/v1/iam/auth/refresh
      - /api/v1/iam/auth/captcha
      - /actuator/**
      - /health/**

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
