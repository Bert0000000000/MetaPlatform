server:
  port: 8201

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/metaplatformont?stringtype=varchar
    username: ${DB_USER:meta}
    password: ${DB_PASSWORD:meta}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_jdbc_type_code_for_string: 12
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  application:
    name: tech-ont
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: metaplatform
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: metaplatform
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  ai:
    alibaba:
      dashscope:
        api-key: ${DASHSCOPE_API_KEY:sk-test}
        chat:
          options:
            model: qwen-max
        embedding:
          options:
            model: text-embedding-v3
            dimensions: 1024

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

ont:
  ea:
    base-url: ${EA_BASE_URL:http://localhost:8106}
