spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: metaplatform
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: metaplatform
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/metaplatform_kb
    username: ${DB_USERNAME:meta}
    password: ${DB_PASSWORD:meta}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 9004

mate:
  kb:
    rag-base-url: ${RAG_BASE_URL:http://localhost:8901}
    ont-base-url: ${ONT_BASE_URL:http://localhost:8201}
    data-base-url: ${DATA_BASE_URL:http://localhost:8701}
    iam-base-url: ${IAM_BASE_URL:http://localhost:8101}
    msg-base-url: ${MSG_BASE_URL:http://localhost:8102}
    obs-base-url: ${OBS_BASE_URL:http://localhost:8103}
