[project]
name = "mate-a2a-external-agent"
version = "0.1.0"
description = "Mate Platform federated A2A 1.0 acceptance agent"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk==1.1.2",
    "fastapi==0.140.4",
    "structlog>=25.0.0",
    "uvicorn==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_a2a_external_agent"]
