[project]
name = "mate-auth-service"
version = "0.1.0"
description = "Mate Platform - Auth Service (JWT verify + tenant resolution via Keycloak)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.8.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # GOVERN-02-FIX: IAM package mounted on auth-service (dashboard/admin/users/orgs/...)
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.20",
    "mate-common",
    "mate-tech-iam",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_auth_service"]

[tool.uv.sources]
mate-common = { workspace = true }
mate-tech-iam = { workspace = true }