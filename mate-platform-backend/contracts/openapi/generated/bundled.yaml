  /api/v1/agent-team/runs/{run_id}/cancel:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
      summary: 受理一次取消（202 cancel_requested，幂等）
      description: |
        **受理制**取消（B-3 起）。回 202 + **当前观察到的**状态，**不承诺**"回话
        那一刻图已经停了"——那个保证只在单副本下成立（跨副本时回话的副本根本没在
        跑这一轮）。

        `status` 是 `cancelled`（已落终态：本来就已经结束，或本请求落的）或
        `cancelling`（已受理、图还在收敛）。客户端拿到 `cancelling` 就接着看
        `GET /runs/{run_id}`，它会一直报 `cancelling` 直到真的 `cancelled`。

        **"有没有人在跑"由活跃 Run 注册表（租约）回答**：没有活跃租约 = 这一轮
        没人执行（停在闸门等人 / 进程崩过），终态由本请求落；有活跃租约时**绝不
        代庖**——否则正在跑的那一侧下一步会用它自己那份状态把终态盖回去。

        **执行中的 run 也能取消**：取消不靠外部杀——图在节点边界自查取消标志，
        看到就自己落终态。粒度是**波与波之间**：在途的那一波允许跑完（不硬断），
        已完成节点不重跑，下一波一个员工都不派。

        幂等：已经终态的直接回当前终态，不覆盖更早的终态。跨租户与不存在同码 404。
      tags:
        - agent-team
      operationId: agentTeamPostRunCancel
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: 已受理（status = cancelled | cancelling）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCancelAccepted'
        '404':
