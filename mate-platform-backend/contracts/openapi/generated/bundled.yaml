openapi: 3.1.0
info:
  title: Mate Platform API
  version: 1.0.0
  description: Canonical contract-first API for all Mate Platform domains.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-mate-owner: architecture-api-governance
servers:
  - url: /
    description: Gateway-relative production endpoint
security:
  - bearerAuth: []
tags:
  - name: iam
    description: iam domain operations
  - name: dashboard
    description: dashboard domain operations
  - name: msg
    description: msg domain operations
  - name: obs
    description: obs domain operations
  - name: mcp
    description: mcp domain operations
  - name: llmgw
    description: llmgw domain operations
  - name: ont
    description: ont domain operations
  - name: rag
    description: rag domain operations
  - name: agent
    description: agent domain operations
  - name: data
    description: data domain operations
  - name: kb
    description: kb domain operations
  - name: copilot
    description: copilot domain operations
  - name: dw
    description: dw domain operations
  - name: apphub
    description: apphub domain operations
  - name: arch
    description: arch domain operations
  - name: wfe
    description: wfe domain operations
  - name: a2a
    description: a2a domain operations
paths:
  /api/v1/a2a/agent-cards/search:
    get:
      tags:
        - a2a
      summary: /v1/a2a/agent-cards/search
      operationId: a2aGetA2aAgentCardsSearch
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/a2a/agent-cards/search
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
        - FR-A2A-A2AGETA2AAGENTCARDSSEARCH
      x-mate-implementation-status: planned
  /api/v1/a2a/delegations:
    get:
      tags:
        - a2a
      summary: /v1/a2a/delegations
      operationId: a2aGetA2aDelegations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/a2a/delegations
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
        - FR-A2A-A2AGETA2ADELEGATIONS
      x-mate-implementation-status: planned
  /api/v1/admin/configs:
    get:
      summary: List system configs
      tags:
        - iam
      parameters:
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/ConfigCategory'
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminConfigs
      description: List system configs
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINCONFIGS
      x-mate-implementation-status: implemented
  /api/v1/admin/configs/categories:
    get:
      summary: Distinct category counts
      tags:
        - iam
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminConfigsCategories
      description: Distinct category counts
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINCONFIGSCATEGORIES
      x-mate-implementation-status: implemented
  /api/v1/admin/configs/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    put:
      summary: Update a system config (with audit)
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: OK
        '400':
          description: Bad key or value not in enum
        '404':
          description: Not found
      operationId: iamPutAdminConfigsKeyPath
      description: Update a system config (with audit)
      x-mate-owner: security-iam
      x-mate-permission: iam.put
      x-mate-requirements:
        - FR-IAM-IAMPUTADMINCONFIGSKEYPATH
      x-mate-implementation-status: implemented
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
  /api/v1/admin/logs/audit:
    get:
      summary: Audit log query
      tags:
        - iam
      parameters:
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: module
          schema:
            type: string
        - in: query
          name: action
          schema:
            $ref: '#/components/schemas/AuditAction'
        - in: query
          name: resource_type
          schema:
            type: string
        - in: query
          name: resource_id
          schema:
            type: string
        - in: query
          name: start
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminLogsAudit
      description: Audit log query
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINLOGSAUDIT
      x-mate-implementation-status: implemented
  /api/v1/admin/logs/audit/export:
    get:
      summary: Export audit log (csv | json), max 50000 rows
      tags:
        - iam
      parameters:
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: module
          schema:
            type: string
        - in: query
          name: action
          schema:
            $ref: '#/components/schemas/AuditAction'
        - in: query
          name: start
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          schema:
            type: string
            format: date-time
        - in: query
          name: fmt
          schema:
            type: string
            enum:
              - csv
              - json
            default: csv
      responses:
        '200':
          description: text/csv | application/json stream
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminLogsAuditExport
      description: Export audit log (csv | json), max 50000 rows
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINLOGSAUDITEXPORT
      x-mate-implementation-status: implemented
  /api/v1/admin/logs/audit/{log_id}:
    parameters:
      - in: path
        name: log_id
        required: true
        schema:
          type: integer
    get:
      summary: Audit log detail
      tags:
        - iam
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      operationId: iamGetAdminLogsAuditLogId
      description: Audit log detail
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINLOGSAUDITLOGID
      x-mate-implementation-status: implemented
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: string
  /api/v1/admin/logs/modules:
    get:
      summary: Distinct module/action counts (for filter UI)
      tags:
        - iam
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminLogsModules
      description: Distinct module/action counts (for filter UI)
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINLOGSMODULES
      x-mate-implementation-status: implemented
  /api/v1/admin/operations/alerts/rules:
    get:
      summary: List alert rules
      tags:
        - obs
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsAlertsRules
      description: List alert rules
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSALERTSRULES
      x-mate-implementation-status: placeholder
  /api/v1/admin/operations/capacity:
    get:
      summary: Capacity snapshot
      tags:
        - obs
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsCapacity
      description: Capacity snapshot
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSCAPACITY
      x-mate-implementation-status: placeholder
  /api/v1/admin/operations/health:
    get:
      summary: Operations health (per service)
      tags:
        - obs
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsHealth
      description: Operations health (per service)
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSHEALTH
      x-mate-implementation-status: placeholder
  /api/v1/admin/operations/metrics/self:
    get:
      summary: Self process metrics snapshot
      tags:
        - obs
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsMetricsSelf
      description: Self process metrics snapshot
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSMETRICSSELF
      x-mate-implementation-status: placeholder
  /api/v1/admin/operations/prometheus/query:
    get:
      summary: Prometheus passthrough (best-effort)
      tags:
        - obs
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: PromQL expression
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsPrometheusQuery
      description: Prometheus passthrough (best-effort)
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSPROMETHEUSQUERY
      x-mate-implementation-status: placeholder
  /api/v1/admin/orgs:
    get:
      summary: List orgs (paginated)
      tags:
        - iam
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum:
              - DEPARTMENT
              - COMPANY
              - TEAM
              - VIRTUAL
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminOrgs
      description: List orgs (paginated)
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINORGS
      x-mate-implementation-status: implemented
    post:
      summary: Create org
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreate'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamPostAdminOrgs
      description: Create org
      x-mate-owner: security-iam
      x-mate-permission: iam.post
      x-mate-requirements:
        - FR-IAM-IAMPOSTADMINORGS
      x-mate-implementation-status: implemented
  /api/v1/admin/orgs/positions:
    get:
      summary: List positions
      tags:
        - iam
      parameters:
        - in: query
          name: org_id
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminOrgsPositions
      description: List positions
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINORGSPOSITIONS
      x-mate-implementation-status: implemented
    post:
      summary: Create position
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionCreate'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamPostAdminOrgsPositions
      description: Create position
      x-mate-owner: security-iam
      x-mate-permission: iam.post
      x-mate-requirements:
        - FR-IAM-IAMPOSTADMINORGSPOSITIONS
      x-mate-implementation-status: implemented
  /api/v1/admin/orgs/positions/{position_id}:
    parameters:
      - in: path
        name: position_id
        required: true
        schema:
          type: integer
    put:
      summary: Update position
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionUpdate'
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      operationId: iamPutAdminOrgsPositionsPositionId
      description: Update position
      x-mate-owner: security-iam
      x-mate-permission: iam.put
      x-mate-requirements:
        - FR-IAM-IAMPUTADMINORGSPOSITIONSPOSITIONID
      x-mate-implementation-status: implemented
      parameters:
        - name: position_id
          in: path
          required: true
          schema:
            type: string
    delete:
      summary: Delete position (rejected when employees still attached)
      tags:
        - iam
      responses:
        '200':
          description: OK
        '404':
          description: Not found
        '409':
          description: Holders still attached
      operationId: iamDeleteAdminOrgsPositionsPositionId
      description: Delete position (rejected when employees still attached)
      x-mate-owner: security-iam
      x-mate-permission: iam.delete
      x-mate-requirements:
        - FR-IAM-IAMDELETEADMINORGSPOSITIONSPOSITIONID
      x-mate-implementation-status: implemented
      parameters:
        - name: position_id
          in: path
          required: true
          schema:
            type: string
  /api/v1/admin/orgs/transfer:
    post:
      summary: Transfer an employee to a target org/position
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferPayload'
      responses:
        '200':
          description: OK
        '404':
          description: User or target org not found
        '409':
          description: Target org has no position
      operationId: iamPostAdminOrgsTransfer
      description: Transfer an employee to a target org/position
      x-mate-owner: security-iam
      x-mate-permission: iam.post
      x-mate-requirements:
        - FR-IAM-IAMPOSTADMINORGSTRANSFER
      x-mate-implementation-status: implemented
  /api/v1/admin/orgs/tree:
    get:
      summary: Org tree (root -> children)
      tags:
        - iam
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminOrgsTree
      description: Org tree (root -> children)
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINORGSTREE
      x-mate-implementation-status: implemented
  /api/v1/admin/orgs/{org_id}:
    parameters:
      - in: path
        name: org_id
        required: true
        schema:
          type: integer
    put:
      summary: Update org
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUpdate'
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      operationId: iamPutAdminOrgsOrgId
      description: Update org
      x-mate-owner: security-iam
      x-mate-permission: iam.put
      x-mate-requirements:
        - FR-IAM-IAMPUTADMINORGSORGID
      x-mate-implementation-status: implemented
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
    delete:
      summary: Delete org (rejected when children exist)
      tags:
        - iam
      responses:
        '200':
          description: OK
        '404':
          description: Not found
        '409':
          description: Children / positions still exist
      operationId: iamDeleteAdminOrgsOrgId
      description: Delete org (rejected when children exist)
      x-mate-owner: security-iam
      x-mate-permission: iam.delete
      x-mate-requirements:
        - FR-IAM-IAMDELETEADMINORGSORGID
      x-mate-implementation-status: implemented
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
  /api/v1/admin/permissions/assign:
    post:
      summary: Assign permissions to a user or a role
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPayload'
      responses:
        '200':
          description: OK
        '400':
          description: bad type/role_ids combination
      operationId: iamPostAdminPermissionsAssign
      description: Assign permissions to a user or a role
      x-mate-owner: security-iam
      x-mate-permission: iam.post
      x-mate-requirements:
        - FR-IAM-IAMPOSTADMINPERMISSIONSASSIGN
      x-mate-implementation-status: implemented
  /api/v1/admin/permissions/catalog:
    get:
      summary: Permission catalog (resource + actions)
      tags:
        - iam
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminPermissionsCatalog
      description: Permission catalog (resource + actions)
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINPERMISSIONSCATALOG
      x-mate-implementation-status: implemented
  /api/v1/admin/permissions/matrix:
    get:
      summary: Role x permission matrix
      tags:
        - iam
      parameters:
        - in: query
          name: role_id
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminPermissionsMatrix
      description: Role x permission matrix
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINPERMISSIONSMATRIX
      x-mate-implementation-status: implemented
  /api/v1/admin/permissions/roles:
    get:
      summary: List roles
      tags:
        - iam
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminPermissionsRoles
      description: List roles
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINPERMISSIONSROLES
      x-mate-implementation-status: implemented
    post:
      summary: Create role
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '201':
          description: Created
        '409':
          description: Role code already exists
      operationId: iamPostAdminPermissionsRoles
      description: Create role
      x-mate-owner: security-iam
      x-mate-permission: iam.post
      x-mate-requirements:
        - FR-IAM-IAMPOSTADMINPERMISSIONSROLES
      x-mate-implementation-status: implemented
  /api/v1/admin/permissions/roles/{role_id}:
    parameters:
      - in: path
        name: role_id
        required: true
        schema:
          type: integer
    get:
      summary: Role + permission detail
      tags:
        - iam
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      operationId: iamGetAdminPermissionsRolesRoleId
      description: Role + permission detail
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINPERMISSIONSROLESROLEID
      x-mate-implementation-status: implemented
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
    put:
      summary: Update role
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      operationId: iamPutAdminPermissionsRolesRoleId
      description: Update role
      x-mate-owner: security-iam
      x-mate-permission: iam.put
      x-mate-requirements:
        - FR-IAM-IAMPUTADMINPERMISSIONSROLESROLEID
      x-mate-implementation-status: implemented
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
    delete:
      summary: Delete role (rejected if users still assigned)
      tags:
        - iam
      responses:
        '200':
          description: OK
        '404':
          description: Not found
        '409':
          description: Role still has assignments
      operationId: iamDeleteAdminPermissionsRolesRoleId
      description: Delete role (rejected if users still assigned)
      x-mate-owner: security-iam
      x-mate-permission: iam.delete
      x-mate-requirements:
        - FR-IAM-IAMDELETEADMINPERMISSIONSROLESROLEID
      x-mate-implementation-status: implemented
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
