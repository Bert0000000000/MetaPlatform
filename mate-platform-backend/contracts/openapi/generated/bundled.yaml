components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak RS256/RS384/RS512 JWT. aud must include
        `metaplatform-backend`. iss must equal
        `${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}`. The token is
        verified against the live Keycloak JWKS endpoint; HS* algorithms
        are explicitly rejected (CVE-2015-9235 family).
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
      description: |
        Tenant binding. Must equal `token.tenant_id` (mismatch is 403).
        Mismatches are allowed only when the token carries the
        `tenant_switch_enabled` scope (BFF / SRE workflows) and the
        request is audit-logged to OBS.
    oidcScopes:
      type: oauth2
      description: |
        OAuth2 client_credentials grant against the same Keycloak realm.
        Scopes:
          - platform.read:  read-only access
          - platform.write: mutation access
          - platform.admin: service-to-service admin (rare)
          - tenant_switch_enabled: permits X-Tenant-Id header to differ
            from token.tenant_id
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            platform.marketplace.read: Platform-level (cross-tenant) marketplace install list
            platform.marketplace.read.tenant: Tenant-scoped marketplace install list
            platform.marketplace.write: Marketplace install / uninstall / license mutation
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ApiResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          enum:
            - 0
        message:
          type: string
        data: {}
        traceId:
          type: string
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
        traceId:
          type: string
    DeepResearchInput:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: The research question.
        depth:
          type: string
          enum:
            - shallow
            - medium
            - deep
          default: deep
        max_sources:
          type: integer
          default: 10
          minimum: 1
        output_format:
          type: string
          enum:
            - markdown
            - json
          default: markdown
    DeepResearchInvokeRequest:
      type: object
      required:
        - capability_id
        - input
      properties:
        capability_id:
          type: string
          enum:
            - web-research
          description: The capability to invoke.
        input:
          $ref: '#/components/schemas/DeepResearchInput'
    Source:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        snippet:
          type: string
        reliability:
          type: string
          enum:
            - high
            - medium
            - low
        fetched_at:
          type: string
          format: date-time
    DeepResearchInvokeResponse:
      type: object
      properties:
        capability_id:
          type: string
        report:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        duration_ms:
          type: integer
    schemas-ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    A2APart:
      type: object
      description: One content part of a W3C A2A message.
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - text
            - file
            - data
        text:
          type:
            - string
            - 'null'
        data:
          type:
            - object
            - 'null'
          additionalProperties: true
    A2AMessage:
      type: object
      description: W3C A2A message envelope (the `/messages` request body).
      required:
        - messageId
        - role
        - parts
      properties:
        messageId:
          type: string
          minLength: 1
        role:
          type: string
          enum:
            - user
            - agent
        parts:
          type: array
          items:
            $ref: '#/components/schemas/A2APart'
        contextId:
          type:
            - string
            - 'null'
        taskId:
          type:
            - string
            - 'null'
    A2AArtifact:
      type: object
      description: A W3C A2A artifact attached to a Task.
      required:
        - name
      properties:
        name:
          type: string
        mimeType:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/A2APart'
    A2ATask:
