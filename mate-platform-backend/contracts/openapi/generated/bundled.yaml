    Artifact:
      type: object
      required:
        - artifact_id
      description: |
        一件**产出物**的元数据（1.6 任务 2）。正文不在列表里——按
        `artifact_id` 走 `GET /artifacts/{artifact_id}` 另取。

        落地存储是 **PG**（不是 MinIO 作主存）：租户隔离只有 PG 这条路是数据库
        强制的（RLS），且"可寻址"要的主键 PG 直接给；对象存储只作**大正文的外移
        层**（见 `storage_uri`）。理由全文见服务端 `artifact_store` 模块注释。

        **C-4 起它是"某一版"的元数据**：`(artifact_id, version)` 才是一个不可变
        交付物。旧实现同地址 `ON CONFLICT DO UPDATE` 覆盖写，重跑一次就再也说
        不出"第一次交付的是什么"。
      properties:
        artifact_id:
          type: string
          description: |
            产出物地址，形状 `{run_id 前 8 位}-{计划内标签}`。按运行唯一，所以
            同一个员工在同一轮里的主交付物**只有一个地址**。跨轮重跑是不同地址；
            版本化管的是**同一地址被写第二次**（图重放 / 续跑重派 / 工具重试）。
        run_id:
          type: string
        task_id:
          type: string
        profile_id:
          type: string
          description: 产出它的数字员工
        kind:
          type: string
          description: |
            产出物种类。当前只有 `report`（员工的自由文本产出）。种类由**生产方**
            声明，不按正文内容猜。
        title:
          type: string
        content_type:
          type: string
          description: 正文的媒体类型（当前恒为 `text/markdown`）
        size:
          type: integer
          description: |
            正文的**字节数**（原文的，不是 PG 里那一列的长度——正文外移后
            `content` 为空，`size` 仍是原文大小）。
        version:
          type: integer
          default: 1
          description: |
            这一版的版本号，首次交付 = 1。同一地址**内容变了**才 +1；内容没变的
            重放是幂等的（不刷版本号）。
        immutable_digest:
          type: string
          description: |
            这一版正文的 sha256（十六进制）。行一旦落库不再重算——所以它既能验
            "同一份内容"，也能检出"这行被改过正文"。
        provenance:
          type: string
          description: 谁、按哪一版产出流程造的它（如 `agent-runtime/v1`）
        security_classification:
          type: string
          description: |
            密级标记。**只记录、不强制**：本服务不做访问策略判定，标记的强制由
            后续 Marking 批次负责（见 2.1-C 边界登记）。
        retention_policy:
          type: string
          description: 保留策略名（如 `7d`）。同上，只记录，不执行清理。
        storage_uri:
          type: string
          description: |
            正文外移后的对象存储地址；内联在 PG 时为空串。**没配 blob 客户端
            时一律内联**（不会出现"地址有了、内容取不回"）。
        created_at:
          type: string
          description: 落库时刻（ISO8601）
    ArtifactContent:
      allOf:
        - $ref: '#/components/schemas/Artifact'
        - type: object
          properties:
            content:
              type: string
              description: 正文原文
    EmployeeProfile:
      type: object
      required:
        - profile_id
        - name
        - base_role
      properties:
        profile_id:
          type: string
        name:
          type: string
        base_role:
          type: string
          description: kernel AgentRole 枚举之一
        system_prompt:
          type: string
        skills:
          type: array
          items:
            type: string
          description: 绑定的 skillhub skill id（只出清单，正文按需读）
        tools:
          type: array
          items:
            type: string
          description: 工具白名单（MCP 工具名）；白名单外调用被拒
        action_rids:
          type: array
          items:
            type: string
          description: 权限包络 · 可写的 Action rid（ADR-0066 §3.3）
        kb_ids:
          type: array
          items:
            type: string
          description: 权限包络 · 可读的知识库 id
        markings:
          type: array
          items:
            type: string
          description: 权限包络 · 可见的数据标记
        model:
          type: string
          description: 该员工使用的模型（llmgw 侧的名字）
        runtimes:
          type: array
          items:
            type: string
            enum:
              - superai
              - claude_code
              - external_a2a
          description: |
            允许的**执行面**（ADR-0066 §5.8：「角色」与「运行时」是正交两轴）。
            C-5（`MP-AGENT-PROFILE-MGMT-01`）起见得到的就是**库里那一列**的值——
            配了 `claude_code` 的员工，重启后读回来仍是 `claude_code`。

            省略 = `[superai]`（存量调用方的行为不变）。**不许静默切换 Runtime**：
            陌生的名字是 422，不会落回默认——两个执行面的沙箱与权限假设不同
            （外部 CLI 拿不到本仓的 `EnvelopeGate`）。
        origin:
          type: string
          description: builtin = 代码里的内置定义；instantiated = 本租户建出来的行
    ProfileWriteRequest:
      type: object
      required:
        - name
      properties:
        profile_id:
          type: string
          description: |
            省略时现生成 `EMP-XXXXXXXX`；给了就是**幂等 upsert**——同一个 id
            再提交一次即覆盖，不需要先查再建。
        name:
          type: string
          minLength: 1
        base_role:
          type: string
          default: ontology
          description: kernel AgentRole 枚举之一
        system_prompt:
          type: string
        skills:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
        action_rids:
          type: array
          items:
            type: string
        kb_ids:
          type: array
          items:
            type: string
        markings:
          type: array
          items:
            type: string
        model:
          type: string
        runtimes:
          type: array
          items:
            type: string
            enum:
              - superai
              - claude_code
              - external_a2a
          description: |
            这台员工允许跑在哪些执行面上（ADR-0066 §5.8）。省略 = `[superai]`。
            **陌生值 422**（不静默回落默认）；**空数组同样 422**——空列表会被下游
            当作"没声明"再回落默认，是同一种静默。
    SkillManifestEntry:
      type: object
      required:
        - skill_id
        - name
      properties:
        skill_id:
          type: string
        name:
          type: string
        description:
          type: string
          description: 一句话描述（清单层只出这个，不出正文）
    SkillManifest:
      type: object
      required:
        - profile_id
        - entries
        - manifest_chars
        - budget_chars
      properties:
        profile_id:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SkillManifestEntry'
        manifest_chars:
          type: integer
          description: 清单实际字符数
        budget_chars:
          type: integer
          description: 预算上限（默认 8000，即上下文 2%）
    SkillContent:
      type: object
      required:
        - skill_id
        - content
      properties:
        skill_id:
          type: string
        content:
          type: string
          description: skill 正文（渐进加载第 2 层，选中后才读）
    ConversationRun:
      type: object
      required:
        - conversation_id
        - run_id
      properties:
        conversation_id:
          type: string
        run_id:
          type: string
        turn_id:
          type: string
          default: ''
        created_by:
          type: string
          default: ''
          description: 发起者的 subject（取自令牌，不是请求体）
        relation_type:
          type: string
          default: initiated
          description: |
            关系种类。当前只有 `initiated`（这一轮由该会话发起）；"被引用"是
            另一种关系，出现时走契约新增。
        created_at:
          type: string
          default: ''
        status:
          type: string
          default: ''
          description: |
            该轮**此刻**的状态。它来自该轮自己的检查点（与 `GET /runs/{run_id}`
            同一份事实），本表不复制 run 状态。读不到检查点（已受理、尚未落第一个
            检查点）时为空串。
        goal:
          type: string
          default: ''
    RunList:
      type: object
      required:
        - conversation_id
      properties:
        conversation_id:
          type: string
        items:
          type: array
          default: []
          description: 该会话里的各轮 run，**新→旧**。
          items:
            $ref: '#/components/schemas/ConversationRun'
    StartRunRequest:
      type: object
      required:
        - goal
      properties:
        goal:
          type: string
          description: 用户的一句话目标
          minLength: 1
        max_parallel:
          type: integer
          default: 3
          description: 本轮最多并行派出的员工数（≥2）
        timeout_seconds:
          type: number
          minimum: 0
          description: |
            本轮的运行级截止时间（秒）。省略时用部署默认值
            （`MATE_AGENT_TEAM_RUN_TIMEOUT_SECONDS`，0 = 不设超时）。到点后运行
            落终态 `timeout`，不会一直停在闸门上等人。

            生效值**随 run 落库**（见 `RunState.timeout_seconds` / `deadline_at`），
            服务重启后仍按本轮的值裁决。
        conversation_id:
          type: string
          default: ''
          description: |
            发起这一轮的**会话 id**（C-1 / `MP-SESSION-RUN-LINK-01`）。给了就落
            后端（`conversation_run` 表），于是换机器 / 清浏览器之后仍查得到
            "这次对话里跑过哪几轮"（见 `GET /runs?conversation=`）。

            **后端是唯一关系源**：前端那份 `localStorage` 只是缓存。省略则不起
            这层关系——不是所有调用方都有会话（工作台直接起一轮、脚本、压测）。
        turn_id:
          type: string
          default: ''
          description: |
            这一轮是会话里的**第几次发言**（调用方生成，用于把多轮排成时间序）。
            仅在该轮有 `conversation_id` 时有意义。
    RunAccepted:
      type: object
      required:
        - run_id
        - tenant_id
        - status
      description: |
        `POST /runs` 的受理回执（1.7）：**只回受理事实，不回运行结果**。

        起一轮运行要拆图 + 并行派活，实测量级是**分钟**，而网关读超时是 60s。
        同步返回时客户端拿到的是 504，且**这一轮其实已经建好了**——重试一次
        就多跑一轮。改成受理制之后：提交立刻拿到 `run_id`，终态**只能**从
        `GET /runs/{run_id}` 或事件流取。
      properties:
        run_id:
          type: string
          description: 本轮运行的地址；`GET /runs/{run_id}` 与事件流都用它
        tenant_id:
          type: string
        status:
          type: string
          description: |
            受理那一刻的状态（通常是 `running`）。**不是终态**：终态要订阅
            事件流或轮询 `GET /runs/{run_id}` 才拿得到。
        deduplicated:
          type: boolean
          default: false
          description: |
            这次提交是否**没有新起一轮**：请求带了同一个 `Idempotency-Key`
            且该键已经对应到一个 run，此时原样返回那轮的 `run_id`。
            重试因此不会多跑一轮——这正是同步版 504 之后那个坑的根治办法。
    SubTask:
      type: object
      required:
        - task_id
        - profile_id
        - instruction
      properties:
        task_id:
          type: string
          description: 子任务 id（在一次 run 内唯一）
        profile_id:
          type: string
          description: 承接该子任务的数字员工 id
        instruction:
          type: string
          description: 下发给该员工的指令（已按 §5.4 裁剪，不是主上下文全量）
        depends_on:
          type: array
          items:
            type: string
          default: []
          description: |
            本节点的前置节点（**同一计划内**的 task_id）。依赖全部产出回执后
            本节点才会被派出去；无依赖 = 第一波。指向计划外的 id 或成环时，
            整轮在计划期判失败（不会静默挂住）。
    SubTaskResult:
      type: object
      properties:
        task_id:
          type: string
        team_task_id:
          type: string
          description: |
            该员工这次运行的**实例 id**（`team_task` 主键，跨运行唯一）。
            **追问该员工就投这个 id** —— `POST /tasks/{task_id}/messages` 收的
            是它；`task_id`（如 `t1`）只是计划内标签，两次运行会重复，投给它
            会被拒（终态）或投错运行。
        profile_id:
          type: string
        status:
          type: string
          enum:
            - ok
            - error
            - rejected
        output:
          type: string
          description: 员工真实产出（非原话回填）
        tool_calls:
          type: array
          items:
            type: object
          description: 该员工实际发起的工具调用记录（审计用）
        llm_calls:
          type: integer
          description: |
            **本地**模型轮次。B-7（`MP-EXTERNAL-RUNTIME-E2E-01`）起，出站到外部
            agent 的往返**不再计入这里**——远端的 token 不是本平台花的。它单独记在
            `external_agent_calls`。
        external_agent_calls:
          type: integer
          description: |
            出站到外部 agent 的**往返次数**（成功与失败都算：成本口径问的是
            "打出去几次"）。当前只有 A2A 出站这一类。
        runtime_calls:
          type: integer
          description: |
            运行时**派发次数**（含重试）。与 `llm_calls` 分开：一次派发可能一次模型
            都没调（外部 runtime），一次模型轮次也可能在多次派发里发生
            （重试用尽后成功）。
        source:
          type: string
          enum:
            - llm
            - external
            - stub
          description: |
            llm = 本地模型产出；external = 外部 agent 产出（A2A 出站）；
            stub = 未接线（供 D-10 "假回执" 断言）。
        error:
          type: string
        error_code:
          type: string
          description: |
            可判定的失败类别——`status` 里 `rejected`/`error` 分不开的几种情形
            靠它区分：
            - `E_AUTHORITY_ESCALATION`：派活越权，已转 proposal，**该子任务未执行**
              （授权只限本次任务，人工同意后才跑）；
            - `E_DEPTH_EXCEEDED`：嵌套层数超上限，硬拒，整轮判失败；
            - `E_PROFILE_NOT_FOUND`：员工不在本租户名册（跨租户 = 不存在），同上；
            - `E_RUNTIME_UNAVAILABLE`：**可重试**失败（模型 5xx / 网络抖动这类）
              按策略重试后仍不成功。只是**这一件**没干成，不是整轮失败。
        proposal:
          type: object
          description: |
            越权时的人审提案（ADR-0066 §3.4）：`escalations` 是越权的维度、
            `requested` 是各维度实际超出的能力、`scope=this_task_only` 声明
            授权范围**只作用于本次任务**（不写回员工定义）。
        attempts:
          type: integer
          default: 0
          description: |
            这一件**真正发起了几次**运行时调用（含重试；1 = 一次过手）。
            没被执行的（越权转 proposal / 硬拒）为 0。重试只作用于**运行时那一次
            调用**：派活（建任务行、落审计、转 proposal）是副作用，不会被重做。
        evidence:
          type: array
          description: |
            该员工工具调用结果映射出的**结构化证据**（1.6）。形状与 copilot 的
            证据条目**完全一致**——同一平台里"证据"只有一种样子：

            - `type`：`ONTOLOGY_OBJECT`（对象/类型级）或 `ONTOLOGY_METRIC`（聚合指标）；
            - `ref`：可寻址引用（实例 rid / 类型 rid / 指标名）；
            - `objectId`：**仅实例证据**有；类型级与指标级不设（拿它调实例接口会 404）；
            - `concept`：人读的名字（可缺）；
            - `fragment`：结果片段（可缺）；
            - `evidenceId`：运行内唯一，供前端去重/追加；
            - `capturedAt`：抓取时刻（UTC，`%Y-%m-%dT%H:%M:%SZ`）。

            **忠实映射**：只对结果里真实存在的字段取证，取不到就**不产出条目**
            （工具成功但无证据是正常结果，不是异常）。被闸门拒绝或执行失败的工具
            调用**不产证据**——那种结果里没有可取证的事实。
          items:
            type: object
        artifacts:
          type: array
          description: |
            该员工产出的**可寻址交付物**的元数据（1.6 任务 2，形状见
            `Artifact`）；正文按 `artifact_id` 另取。

            只有 `status=ok` 且产出**非空白**才有一条——空产出不是交付物。
            落库失败**不吞**：产出拿得到却在回执里给不出地址，等于另一种
            "假回执"，宁可让这一轮明确失败。
          items:
            $ref: '#/components/schemas/Artifact'
        input_tokens:
          type: integer
          description: |
            **输入** token 数（C-7 / `MP-OBSERVABILITY-DEEPEN-01`）。来自 llmgw
            `chat/real` 回包的 `usage`，登录在 `LlmgwChatModel` 那一层。

            **拿不到就是 0**，不是"没记"：外部执行面（`claude_code` /
            `external_a2a`）的 token 若 CLI/对端不回报，这里就是 0——远端花的
            token 本平台也拿不到，**不猜**。
        output_tokens:
          type: integer
          description: '**输出** token 数（同上）。'
        cached_tokens:
          type: integer
          description: |
            **命中缓存**的 token 数（同上）。上游不报这个维度时恒为 0。
        latency_ms:
          type: integer
          description: 这一件子任务的**墙钟耗时**（毫秒）。
        llm_latency_ms:
          type: integer
          description: |
            其中花在**模型调用**上的毫秒数。`superai` 是逐轮累加的真值；外部 CLI
            只有"整段调用"一个粒度，所以整段都记在这里（`tool_latency_ms` 留 0）。
        tool_latency_ms:
          type: integer
          description: |
            其中花在**工具调用**上的毫秒数。与 `llm_latency_ms` **并列测量**，
            **不是**"总 = 模型 + 工具"的拆解——模型轮次之间还有编排开销，硬凑成
            加法会得到一个编出来的数。
        runtime_kind:
          type: string
          enum:
            - superai
            - claude_code
            - external_a2a
          description: 跑它的执行面。**没有任何运行时跑过**的失败（如"声明的执行面都没装配"）为空串。
        model:
          type: string
          description: |
            这一件实际用的模型名。`superai` = 员工定义的模型；外部 CLI 只有在
            配了 `--model` 时才有值，否则是 CLI 自己的默认，如实留空。
        prompt_digest:
          type: string
          description: |
            员工定义的**提示词摘要**（A-6 的 `prompt_digest_of`）。同一轮里两件
            回执的它不同，就说明它们不是同一版员工跑的。
        failure_category:
          type: string
          enum:
            - ''
            - profile_not_found
            - depth_exceeded
            - authority
            - runtime_unavailable
            - model_error
            - tool_error
            - invalid_output
            - timeout
          description: |
            **低基数**的失败类别，供指标聚合；成功时为空串。

            与 `error_code` 刻意分开：`error_code` 是给调用方分支用的（稳定、进
            契约），`failure_category` 是给告警聚合用的。混成一套迟早要为一个
            指标名去改对外契约。
    ApprovalGate:
      type: object
      description: |
        **HITL 闸门的统一协议**（B-6 / `MP-APPROVAL-GATE-ABI-01`）。它是"图怎么
        暂停恢复"之外的那件事——**闸门长什么样**。在它之前闸门只有一个布尔
        `approved`，说不清"谁批的、还差几级、什么时候过期"。

        统一审批中心（`MP-APPROVAL-INBOX-01`）只需要两件事就能消费它：
        按 `state` 筛出 `pending` 的闸门列待办；按 `gate_id`（**稳定地址**：
        同 run 同类型永远是同一个）做一次决定。

        三种能力都表达在这份协议里：
        - **多级审批** —— `required_roles` 有序，逐级判；第 N 级没凑齐仍是 `pending`；
        - **会签** —— `required_approvals > 1`，且按 `actor` **去重**（同一个人
          批两次不算两票）；
        - **超时** —— 到 `expires_at` 还没凑齐 → `expired`，由读路径落终态
          （与运行级超时是同一个事实）。
      properties:
        gate_id:
          type: string
          description: 稳定地址（`<run_id>:<gate_type>`）。审批中心拿它当主键。
        run_id:
          type: string
        tenant_id:
          type: string
        gate_type:
          type: string
          enum:
            - plan_gate
        required_roles:
          type: array
          items:
            type: string
          description: |
            **有序**的审批层级。空数组 = 单级、任意审批角色（缺省形态）。
            `*` 表示"这一级不限定角色"。
        required_approvals:
          type: integer
          description: 每一级需要的**不同审批人**数。1 = 单人；>1 = 会签。
        payload:
          type: object
          description: 待批的内容（缺省闸门里是目标与各员工回执的摘要）。
        editable_fields:
          type: array
          items:
            type: string
          description: 审批人在批准时可以一并修订的字段名。
        expires_at:
          type: number
          description: 过期时刻（epoch 秒；0 = 不过期）。缺省取本轮的运行级截止时刻。
        created_at:
          type: number
        decisions:
          type: array
          items:
            type: object
            properties:
              actor:
                type: string
                description: 审批人标识（会签去重按它）。
              role:
                type: string
                description: |
                  这次决定**以哪个角色**作出——**来自令牌**，不是调用方自称的。
                  一个都归不上时为空串（绝不冒充）。
              decision:
                type: string
                enum:
                  - approved
                  - rejected
              comment:
                type: string
              decided_at:
                type: number
    RunState:
      type: object
      required:
        - run_id
        - tenant_id
        - goal
        - status
      properties:
        run_id:
          type: string
        tenant_id:
          type: string
        goal:
          type: string
          description: 用户那句话
        status:
          type: string
          enum:
            - planning
            - running
            - awaiting_approval
            - cancelling
            - completed
            - failed
            - cancelled
            - timeout
          description: |
            `cancelling` = **中间态**（B-3 起）：取消信号已落、这一轮还没收敛。
            它**不是**检查点里的一个状态，而是读路径**推**出来的（收到信号
            且未终态），所以不会出现"检查点说 running、信号表说已取消"这种两处
            打架。客户端看到它就继续观察，直到变成 `cancelled`。

            `cancelled` = 被 `POST /runs/{run_id}/cancel` 取消（正在执行的 run
            由**图自己在节点边界**落成这个状态，不是因为外部把它杀掉）；
            `timeout` = 超过本轮截止时间（`timeout_seconds` 或部署默认值）后落到
            的终态。`cancelled` / `timeout` 与另外三个都是**终态**：之后再
            `approve` 一律 409。
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/SubTask'
        results:
          type: object
          description: task_id → SubTaskResult
          additionalProperties:
            $ref: '#/components/schemas/SubTaskResult'
        summary:
          type: string
        hitl_reason:
          type: string
        error:
          type: string
        trace_id:
          type: string
          description: |
            **观测关联键**（C-7 / `MP-OBSERVABILITY-DEEPEN-01`）：开跑那一刻生成，
            随 run 落检查点。于是跨层（`agent.run` / `plan` / `wave` / `subagent`
            / `llm` / `tool` / `approval` / `artifact`）的观测记录靠它拼得回一次
            交付，**重启后续跑**的那些记录也带着同一个 trace。

            它是**关联键不是凭据**：拿到它只能把日志串起来，不能读任何东西。
            老 run（C-7 之前落的检查点）读到空串。
        timeout_seconds:
          type: number
          description: |
            本轮**实际生效**的运行级超时（秒；0 = 不设超时）。请求省略
            `timeout_seconds` 时这里落的是开跑那一刻的部署默认值。
        approval_gate:
          allOf:
            - $ref: '#/components/schemas/ApprovalGate'
          description: |
            **HITL 闸门的统一协议**（B-6）。停在 `awaiting_approval` 时它描述待批
            的是什么、还差几级几个人、什么时候过期。**老 run**（B-6 之前落的检查点）
            没有这个键，读到的是空对象——那时按单布尔审批的旧语义处理。
        deadline_at:
          type: number
          description: |
            本轮截止的**绝对时刻**（Unix 秒；0 = 无截止）。
            `timeout_seconds` 与 `deadline_at` 都随 run 落库：服务重启后仍按
            **本轮**定下的值裁决，不会回落到重启后进程的默认值。
    ApproveRequest:
      type: object
      properties:
        approved:
          type: boolean
          default: true
        comment:
          type: string
          default: ''
    ArtifactList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
    AuditRecord:
      type: object
      required:
        - audit_id
        - action
        - tenant_id
        - task_id
        - outcome
        - at
      properties:
        audit_id:
          type: string
          description: 审计行 id（进程内唯一，落一行一行）
        action:
          type: string
          enum:
            - agent_team.spawn
            - agent_team.authority_escalation
            - agent_team.approval
            - agent_team.delegation
          description: |
            被审计的动作。**派活**（每次派活一行）、**越权转 proposal**
            （包络超出链根 → 转人审）、**审批**（run 级闸门或任务级授权）、
            **委托签发**（A-2 起：续跑时那次运行期委托的签发或拒绝）。
        tenant_id:
          type: string
        actor:
          type: string
          description: 发起用户（令牌 sub）；解析不出就是空串
        task_id:
          type: string
        run_id:
          type: string
        profile_id:
          type: string
        outcome:
          type: string
          description: 该动作的结果（granted / proposal / approved / rejected …）
        detail:
          type: object
          additionalProperties: true
        at:
          type: string
          description: 记录时刻（ISO8601）
        sequence:
          type: integer
          description: |
            租户内单调序号（A-1 起）。链按租户成链，序号是链接起来的骨架：
            断号 = 有行被删。
        event_id:
          type: string
          description: 事件 id（投递到 Outbox 时用它做幂等键）
        agent_profile_revision:
          type: string
          description: 判定发生时该员工定义的修订号（空串 = 该员工无修订号）
        decision:
          type: string
          description: 判定结论（granted / escalated / approved / rejected …）
        approver_id:
          type: string
          description: 审批人（令牌 sub）；非审批动作是空串
        authority_before:
          type: object
          additionalProperties: true
          description: 判定**之前**的权限包络（四维定序）
        authority_after:
          type: object
          additionalProperties: true
          description: 判定**之后**的权限包络（收窄后的那一份）
        policy_version:
          type: string
          description: 依哪一版判定口径判的（改口径就加版号，历史行仍可解释）
        trace_id:
          type: string
          description: OTel trace id（硬规则
        previous_hash:
          type: string
          description: 该租户上一条的 event_hash（链首为 64 个 0）
        event_hash:
          type: string
          description: |
            sha256(previous_hash ‖ 规范化正文)。**改这一行就对不上**——审计员
            可以用这一列自己重算，不必信任服务端结论。
    AuditList:
