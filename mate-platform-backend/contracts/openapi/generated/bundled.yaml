  /api/v1/agent-team/runs/{run_id}/events:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.read
      summary: 步骤级事件流（SSE：按 Last-Event-ID 补发 + 尾随）
      description: |
        `text/event-stream`。连上先**补发**（从 `Last-Event-ID` 之后一条不少），
        再**尾随**新步骤：之后图每推进一步就往外推一条，直到 run 落终态才发
        `event: end` 收流。每条是 `event: step` + `id: <sequence>` +
        `data: {seq, step, ran, next, status, at, evidence}`（`ran` = 这一步真的
        跑掉的节点）。

        **断线重连不丢事件**：每条事件都带 SSE 标准的 `id:`；浏览器重连时自动
        把它作为 `Last-Event-ID` 请求头发回来，服务端从那条之后接着补发。
        省略该头（或值非法）则从头补发——一个坏游标不该让订阅彻底失败。

        `evidence` 是**这一步新出现的**证据条目（形状见 `SubTaskResult.evidence`），
        按 `evidenceId` 去重后顺序 append 即可。只出增量是刻意的：回执整份都在
        检查点里，整份重发的话每来一步都要重传全部历史证据。

        **推送机制（B-2 起）**：事件写进追加式的 `run_event` 表并 `NOTIFY`，
        订阅方由通知唤醒、只读事件表。**执行恢复的真相源仍是检查点**，事件日志
        只是产品观察模型——丢了事件不影响续跑。没配 PG 的部署退回"轮询检查点"
        的老路径（同样按 `Last-Event-ID` 补发）。

        **实现边界**：尾随在无通知时按兜底间隔（默认 2s）看一眼表。终态判定与
        流关闭是同一个事实——停在 `awaiting_approval` 的运行**不会**自己关流，
        它在等人确认。

        **调用方必须带 `Accept: text/event-stream`**：网关按这个头决定走不走
        "边收边发"的转发路径（它没有声明就等于不要流式，网关会把整份响应读完再
        回话，这条流就永远到不了）。浏览器 `fetch` / `EventSource` 天然会发；
        用 `curl` 试要写 `curl -N -H 'Accept: text/event-stream'`。
      tags:
        - agent-team
      operationId: agentTeamGetRunEvents
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: |
            SSE 标准的断线重连游标（浏览器 `EventSource` 自动带回）。值是上一条
            已处理事件的 `id`（= 这一轮内的 `sequence`）。省略或非法按 0 处理。
            它**不是**审计账本里那个 `sequence`——那是跨租户哈希链的序号，
            与"这一轮流到第几条事件"无关。
      responses:
        '200':
          description: SSE 流（text/event-stream）
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: 该租户下不存在此 run
      x-mate-owner: agent-product-layer
      x-mate-permission: agent-team.read
      x-mate-requirements:
        - FR-AGENT-TEAM-AGENTTEAMGETRUNEVENTS
      x-mate-implementation-status: implemented
  /api/v1/agent-team/tasks/{task_id}/messages:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
      summary: 给运行中的子 agent 投递一条消息（写入 team_task inbox）
      description: |
        ADR-0066 §5.5 的 send：消息写进目标任务的 inbox，子 agent 在**下一轮
        迭代边界**自己取走（消费即清空）。投递**不做唤醒**；任务已终态时返回
        409，**不隐式起新轮**。子 agent 回问父级走同一个接口，只是 task_id
        换成父任务——通道同一条，方向相反。
      tags:
        - agent-team
      operationId: agentTeamPostTaskMessage
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '202':
          description: 已投递（不唤醒，等下一轮迭代边界被取走）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMessage'
        '404':
          description: 该租户下不存在此任务（跨租户与不存在同码，不泄露存在性）
        '409':
          description: 任务已终态（E_TASK_TERMINAL），不隐式起新轮
      x-mate-owner: agent-product-layer
      x-mate-permission: agent-team.write
      x-mate-requirements:
