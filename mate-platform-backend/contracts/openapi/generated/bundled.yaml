                  - skipped
              proposal_id:
                type:
                  - string
                  - 'null'
              expected_diff:
                type: object
                additionalProperties: true
              impact_summary:
                type: string
        edges:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - from_step
              - to_step
            properties:
              from_step:
                type: string
              to_step:
                type: string
              data_refs:
                type: array
                items:
                  type: string
    ReviewRequest:
      type: object
      required:
        - approved
      properties:
        approved:
          type: boolean
        feedback:
          type: string
          default: ''
    CapabilityBinding:
      type: object
      required:
        - name
        - worker_kind
      properties:
        name:
          type: string
        worker_kind:
          type: string
          enum:
            - mcp
            - a2a
            - http
            - local
        ref:
          type: string
          description: MCP tool name | A2A agent id | HTTP url
    Role:
      type: object
      properties:
        role:
          type: string
        name:
          type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityBinding'
        enabled:
          type: boolean
    RegisterRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          description: kernel AgentRole slug (ontology/workflow/app/data_product/obs/security/knowledge/superai)
        name:
          type: string
          default: ''
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityBinding'
    CreateOrderRequest:
      type: object
      required:
        - order_id
        - amount_cents
      properties:
        order_id:
          type: string
          minLength: 1
        amount_cents:
          type: integer
          minimum: 1
        payment_status:
          type: string
          enum:
            - unpaid
            - paid
          default: unpaid
    Order:
      type: object
      required:
        - tenant_id
        - order_id
        - amount_cents
        - payment_status
        - review_status
        - version
      properties:
        tenant_id:
          type: string
        order_id:
          type: string
        amount_cents:
          type: integer
          minimum: 1
        payment_status:
          type: string
          enum:
            - unpaid
            - paid
        review_status:
          type: string
          enum:
            - pending
            - approved
        version:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
    HighValueUnpaidResponse:
      type: object
      required:
        - items
        - total
        - threshold_cents
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        total:
          type: integer
          minimum: 0
        threshold_cents:
          type: integer
          minimum: 1
          description: 本次列表实际使用的服务端复核阈值，已包含可选的更高查询筛选。
    PgStatsResponse:
      type: object
      required:
        - available
        - chunks_count
      properties:
        available:
          type: boolean
        chunks_count:
          type: integer
          minimum: 0
        dsn_host:
          type: string
    IngestRequest:
      type: object
      required:
        - document_id
        - chunks
      properties:
        document_id:
          type: string
          minLength: 1
          maxLength: 64
        chunks:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    IngestResponse:
      type: object
      required:
        - document_id
        - chunk_count
        - total_chunks
      properties:
        document_id:
          type: string
        chunk_count:
          type: integer
          minimum: 0
        total_chunks:
          type: integer
          minimum: 0
    ParseRequest:
      type: object
      required:
        - document_id
        - content
      properties:
        document_id:
          type: string
          minLength: 1
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 1000000
        metadata:
          type: object
          additionalProperties:
            type: string
    ParseResponse:
      type: object
      required:
        - document_id
        - chunk_count
        - ragflow_parsed
        - indexed_in
      properties:
        document_id:
          type: string
        chunk_count:
          type: integer
          minimum: 0
        ragflow_parsed:
          type: integer
          minimum: 0
        indexed_in:
          type: array
          items:
            type: string
    RetrievalRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4096
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        mode:
          type: string
          enum:
            - AUTO
            - FACTUAL
            - ENTITY
            - THEMATIC
          default: AUTO
        metadata_filter:
          type: object
          additionalProperties:
            type: string
        rerank_strategy:
          type: string
          enum:
            - identity
            - keyword
            - length
          default: identity
          description: Reranker strategy for second-pass reordering
    ChunkHit:
      type: object
      required:
        - chunk_id
        - document_id
        - score
        - text
      properties:
        chunk_id:
          type: string
        document_id:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        text:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    RetrievalResponse:
      type: object
      required:
        - query
        - hits
        - total
        - latency_ms
        - mode
      properties:
        query:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/ChunkHit'
        total:
          type: integer
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0
        mode:
          type: string
          enum:
            - FACTUAL
            - ENTITY
            - THEMATIC
    EmbedderInfo:
      type: object
      required:
        - provider
        - dim
      properties:
        provider:
          type: string
          description: local | openai
        model_name:
          type: string
        dim:
          type: integer
          minimum: 0
    IndexStatus:
      type: object
      required:
        - name
        - backend
        - chunk_count
      properties:
        name:
          type: string
          enum:
            - hybrid
            - graph
            - lightrag
        backend:
          type: string
          description: memory | milvus | neo4j | lightrag | lightrag-http
        chunk_count:
          type: integer
          minimum: 0
    SystemStatus:
      type: object
      required:
        - status
        - service
        - version
        - embedder
        - indexes
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        embedder:
          $ref: '#/components/schemas/EmbedderInfo'
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/IndexStatus'
    CreateReviewCaseRequest:
      type: object
      required:
        - order_id
        - suggestion
      properties:
        order_id:
          type: string
          minLength: 1
        suggestion:
          type: object
          additionalProperties: true
        source_refs:
          type: array
          items:
            type: string
    CreateReviewCaseResponse:
      type: object
      required:
        - review_case_id
        - proposal_id
        - status
        - expected_order_version
        - evidence
      properties:
        review_case_id:
          type: string
        proposal_id:
          type: string
        status:
          type: string
          enum:
            - pending
        expected_order_version:
          type: integer
        evidence:
          $ref: '#/components/schemas/EvidenceBundle'
