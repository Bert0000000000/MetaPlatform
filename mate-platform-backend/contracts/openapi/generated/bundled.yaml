components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    ApiResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          enum:
            - 0
        message:
          type: string
        data: {}
        traceId:
          type: string
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
        traceId:
          type: string
    ConfigCategory:
      type: string
      enum:
        - GENERAL
        - SECURITY
        - INTEGRATION
        - NOTIFICATION
        - BILLING
        - AI
    schemas-ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          pattern: ^E[0-9]{3}_[A-Z0-9_]+$
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
    ConfigUpdate:
      type: object
      required:
        - value
      properties:
        value: {}
        note:
          type:
            - string
            - 'null'
          maxLength: 512
    AuditAction:
      type: string
      enum:
        - CREATE
        - UPDATE
        - DELETE
        - ENABLE
        - DISABLE
        - RESET_PASSWORD
        - LOGIN
        - LOGOUT
        - IMPORT
        - EXPORT
        - CONFIG_CHANGE
    OrgCreate:
      type: object
      required:
        - code
        - name
      properties:
        parent_id:
          type:
            - integer
            - 'null'
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
            - DEPARTMENT
            - COMPANY
            - TEAM
            - VIRTUAL
          default: DEPARTMENT
        leader_id:
          type:
            - integer
            - 'null'
        sort_order:
          type: integer
          default: 0
        description:
          type:
            - string
            - 'null'
          maxLength: 512
    PositionCreate:
      type: object
      required:
        - org_id
        - code
        - name
      properties:
        org_id:
          type: integer
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        level:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
    PositionUpdate:
      type: object
      properties:
        name:
          type:
            - string
            - 'null'
        level:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
    TransferPayload:
      type: object
      required:
        - user_id
        - target_org_id
      properties:
        user_id:
          type: integer
        target_org_id:
          type: integer
        target_position_id:
          type:
            - integer
            - 'null'
        reports_to:
          type:
            - integer
            - 'null'
        reason:
          type:
            - string
            - 'null'
    OrgUpdate:
      type: object
      properties:
        parent_id:
          type:
            - integer
            - 'null'
        name:
          type:
            - string
            - 'null'
        type:
          type:
            - string
            - 'null'
          enum:
            - DEPARTMENT
            - COMPANY
            - TEAM
            - VIRTUAL
        leader_id:
          type:
            - integer
            - 'null'
        sort_order:
          type:
            - integer
            - 'null'
        description:
          type:
            - string
            - 'null'
    AssignPayload:
