  /api/v1/agent-team/runs:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
      summary: 提交一句话，受理后**异步**拆任务图并并行派活（返回 202 + run_id）
      description: |
        一句话 → 拆任务图 → 并行派给 ≥2 个数字员工 → 停在人工确认闸门。

        **受理制（1.7）**：本接口**不再同步等图跑完**。拆图 + 并行派活实测量级
        是分钟，而网关读超时是 60s——同步返回时客户端只会拿到 504，且这一轮
        其实已经建好，重试一次就多跑一轮。现在提交**立刻**返回 `202` +
        `run_id`；终态只能从 `GET /runs/{run_id}` 或 `GET /runs/{run_id}/events`
        取。返回时该 `run_id` **已经可查**（首次检查点已落），所以拿到就能订阅。

        **重复提交不产生重复 run**：带上 `Idempotency-Key` 时，同一个键（同租户
        内）永远映射到同一轮运行；重复提交原样回同一个 `run_id`，并置
        `deduplicated: true`，**不会再起一轮**。不带该头则每次都起新一轮。

        **可重试的员工故障会按策略重试**（1.5）：员工运行时那一次调用遇到"可能
        自己好"的失败（模型 5xx / 限流 / 网络抖动）时重试（次数与退避由部署
        配置决定），重试用尽才把这一件记成 `E_RUNTIME_UNAVAILABLE`。**派活**
        （建任务行、落审计、越权转 proposal）不重试——它是副作用。
      tags:
        - agent-team
      operationId: agentTeamPostRuns
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
          description: |
            提交幂等键。同一个键（**同一租户内**）重复提交只会有一轮运行：
            第二次起原样回第一次的 `run_id`。省略则不受幂等保护。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: |
            已受理。`run_id` 立即可查（首次检查点已落），终态请订阅事件流或轮询。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '422':
          description: 目标为空或无法拆解
      x-mate-owner: agent-product-layer
      x-mate-permission: agent-team.write
      x-mate-requirements:
        - FR-AGENT-TEAM-AGENTTEAMPOSTRUNS
      x-mate-implementation-status: implemented
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.read
      summary: 列一个会话里的各轮 run（新→旧，后端是唯一关系源）
      description: |
        **C-1 / `MP-SESSION-RUN-LINK-01`**：会话与 run 的关系以前只写在浏览器
        `localStorage`（`mp-agent-team-run:<会话id>` → run_id），换个机器就没了。
        现在这条关系落在本服务的库里，本接口是它的唯一读法。

        **为什么 `conversation` 是必填**：去掉它这个端点就变成"列出全租户的
        run"，那既不是它的用途，也会把这个读路径的代价放大到不可控。要按租户
        全量列 run 是另一个面（且需要分页），不在本批次。

        **状态不在这里复制**：每一项的 `status` / `goal` 来自该轮自己的检查点，
        与 `GET /runs/{run_id}` 是同一份事实、同一条读取路径（含超时裁决），
        所以列表与详情不会各说各话。代价是 N 轮 = N 次检查点读，服务端因此有
        条数上限。

        租户取自**令牌**，不是查询参数：拿别的租户的 `conversation_id` 来查
        只会查到空，不泄露"这个 id 存在过"。
      tags:
        - agent-team
      operationId: agentTeamGetRuns
      parameters:
        - name: conversation
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: 会话 id（与 `POST /runs` 的 `conversation_id` 同一个值）
      responses:
        '200':
          description: 该会话里的各轮 run，**新→旧**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '422':
          description: 缺少 `conversation` 查询参数
      x-mate-owner: agent-product-layer
      x-mate-permission: agent-team.read
      x-mate-requirements:
        - FR-AGENT-TEAM-AGENTTEAMGETRUNS
