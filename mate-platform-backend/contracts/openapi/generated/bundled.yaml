openapi: 3.1.0
info:
  title: Mate Platform API
  version: 1.0.0
  description: Canonical contract-first API for all Mate Platform domains.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-mate-owner: architecture-api-governance
servers:
  - url: /
    description: Gateway-relative production endpoint
security:
  - bearerAuth: []
tags:
  - name: iam
    description: iam domain operations
  - name: dashboard
    description: dashboard domain operations
  - name: msg
    description: msg domain operations
  - name: obs
    description: obs domain operations
  - name: mcp
    description: mcp domain operations
  - name: llmgw
    description: llmgw domain operations
  - name: ont
    description: ont domain operations
  - name: rag
    description: rag domain operations
  - name: agent
    description: agent domain operations
  - name: data
    description: data domain operations
  - name: kb
    description: kb domain operations
  - name: copilot
    description: copilot domain operations
  - name: dw
    description: dw domain operations
  - name: apphub
    description: apphub domain operations
  - name: arch
    description: arch domain operations
  - name: wfe
    description: wfe domain operations
  - name: a2a
    description: a2a domain operations
  - name: analytics
    description: analytics domain operations
  - name: deep-research
    description: deep-research domain operations
  - name: orchestrator
    description: orchestrator domain operations
  - name: agent-team
    description: agent-team domain operations
  - name: marketplace
    description: marketplace domain operations
paths:
  /api/v1/a2a/agent-cards/search:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.read
      tags:
        - a2a
      summary: /v1/a2a/agent-cards/search
      operationId: a2aGetA2aAgentCardsSearch
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/a2a/agent-cards/search
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
        - FR-A2A-A2AGETA2AAGENTCARDSSEARCH
      x-mate-implementation-status: implemented
  /api/v1/a2a/agent/deep-research/invoke:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
      tags:
        - deep-research
      summary: Delegate a deep research task to DeerFlow
      operationId: deepResearchInvokeDeepResearch
      description: |
        Invokes the Deep Research agent. The caller supplies a
        capability id (currently only `web-research`) and an input
        payload describing the query, depth, and source budget. The
        agent delegates to DeerFlow Engine and returns a markdown
        report plus the sources used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepResearchInvokeRequest'
      responses:
        '200':
          description: Research completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepResearchInvokeResponse'
        '400':
          description: Malformed request (unknown capability, empty query)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas-ErrorResponse'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Tenant binding rejected
        '503':
          description: DeerFlow Engine unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas-ErrorResponse'
      x-mate-owner: ai-protocols
      x-mate-permission: deep-research.invoke
      x-mate-requirements:
        - FR-DEEP-RESEARCH-INVOKE
      x-mate-implementation-status: planned
  /api/v1/a2a/delegate:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
      tags:
        - a2a
      summary: /v1/a2a/delegate (deprecated; use /messages)
      operationId: a2aPostA2aDelegate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_agent_id
                - message
              properties:
                target_agent_id:
                  type: string
                message:
                  type: string
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - task_id
                  - status
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Create a delegation task (deprecated). Superseded by the W3C `POST /api/v1/a2a/messages` envelope (GOVERN-12-03).
      deprecated: true
      x-sunset: '2026-12-31'
      x-migration-target: /api/v1/a2a/messages
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.post
      x-mate-requirements:
        - FR-A2A-A2APOSTA2ADELEGATE
      x-mate-implementation-status: implemented
  /api/v1/a2a/delegations:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.read
      tags:
        - a2a
      summary: /v1/a2a/delegations
      operationId: a2aGetA2aDelegations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/a2a/delegations
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
        - FR-A2A-A2AGETA2ADELEGATIONS
      x-mate-implementation-status: implemented
  /api/v1/a2a/health:
    get:
      security: []
      tags:
        - a2a
      summary: /v1/a2a/health (anonymous liveness probe)
      operationId: a2aGetA2aHealth
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
        '500':
          $ref: '#/components/responses/ServerError'
      description: Anonymous liveness probe — no tenant guard.
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
        - FR-A2A-A2AGETA2AHEALTH
      x-mate-implementation-status: implemented
  /api/v1/a2a/messages:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
      tags:
        - a2a
      summary: /v1/a2a/messages (W3C A2A envelope, GOVERN-12-03)
      operationId: a2aPostA2aMessages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2AMessage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ATask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: 'Accept a W3C A2A message and open a delegation task (GOVERN-12-03). The envelope is translated into the existing DelegationTask model: text parts become the task message, data parts are merged into the task context (alongside the W3C correlation ids). The response is a W3C Task object rather than the legacy `{task_id,status}` shape returned by `/delegate`.'
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.post
      x-mate-requirements:
        - FR-A2A-A2APOSTA2AMESSAGES
      x-mate-implementation-status: implemented
  /api/v1/a2a/tasks/{task_id}:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.read
      tags:
        - a2a
      summary: /v1/a2a/tasks/{task_id} (W3C Task status)
      operationId: a2aGetA2aTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ATask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Get delegation task status (W3C Task schema).
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
        - FR-A2A-A2AGETA2ATASK
      x-mate-implementation-status: implemented
  /api/v1/action-proposals/{proposal_id}:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.read
      summary: 查看 Action Proposal
      tags:
        - order-review
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionProposal'
        '404':
          description: Proposal 不存在或不属于当前租户
      operationId: orderReviewGetActionProposal
      x-mate-owner: orchestrator
      x-mate-permission: order.read
      x-mate-requirements:
        - ORD-004
      x-mate-implementation-status: implemented
  /api/v1/action-proposals/{proposal_id}:confirm:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
      summary: 确认 Action Proposal 并创建跟进单
      tags:
        - order-review
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmActionProposalRequest'
      responses:
        '200':
          description: 已确认，订单、跟进单、幂等记录和 Outbox 同事务提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '409':
          description: 版本冲突、重复处理、幂等键冲突或 evidence required
          headers:
            X-Error-Code:
              description: Application error code.
              schema:
                type: string
                enum:
                  - version_conflict
                  - idempotency_conflict
                  - already_resolved
                  - evidence_required
        '503':
          description: Evidence unavailable
          headers:
            X-Error-Code:
              description: Application error code.
              schema:
                type: string
                enum:
                  - evidence_unavailable
      operationId: orderReviewPostActionProposalConfirm
      x-mate-owner: orchestrator
      x-mate-permission: order.write
      x-mate-requirements:
        - ORD-005
      x-mate-implementation-status: implemented
  /api/v1/action-proposals/{proposal_id}:reject:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
      summary: 拒绝 Action Proposal
      tags:
        - order-review
      parameters:
        - name: proposal_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectActionProposalRequest'
      responses:
        '200':
          description: 已拒绝并写入审计 Outbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '409':
          description: 重复处理或幂等键冲突
      operationId: orderReviewPostActionProposalReject
      x-mate-owner: orchestrator
      x-mate-permission: order.write
      x-mate-requirements:
        - ORD-006
      x-mate-implementation-status: implemented
  /api/v1/admin/configs:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: List system configs
      tags:
        - iam
      parameters:
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/ConfigCategory'
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminConfigs
      description: List system configs
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINCONFIGS
      x-mate-implementation-status: implemented
  /api/v1/admin/configs/categories:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Distinct category counts
      tags:
        - iam
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminConfigsCategories
      description: Distinct category counts
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINCONFIGSCATEGORIES
      x-mate-implementation-status: implemented
  /api/v1/admin/configs/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
    put:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.write
            - platform.admin
      summary: Update a system config (with audit)
      tags:
        - iam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: OK
        '400':
          description: Bad key or value not in enum
        '404':
          description: Not found
      operationId: iamPutAdminConfigsKeyPath
      description: Update a system config (with audit)
      x-mate-owner: security-iam
      x-mate-permission: iam.put
      x-mate-requirements:
        - FR-IAM-IAMPUTADMINCONFIGSKEYPATH
      x-mate-implementation-status: implemented
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
  /api/v1/admin/logs/audit:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Audit log query
      tags:
        - iam
      parameters:
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: module
          schema:
            type: string
        - in: query
          name: action
          schema:
            $ref: '#/components/schemas/AuditAction'
        - in: query
          name: resource_type
          schema:
            type: string
        - in: query
          name: resource_id
          schema:
            type: string
        - in: query
          name: start
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminLogsAudit
      description: Audit log query
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINLOGSAUDIT
      x-mate-implementation-status: implemented
  /api/v1/admin/logs/audit/export:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Export audit log (csv | json), max 50000 rows
      tags:
        - iam
      parameters:
        - in: query
          name: actor
          schema:
            type: string
        - in: query
          name: module
          schema:
            type: string
        - in: query
          name: action
          schema:
            $ref: '#/components/schemas/AuditAction'
        - in: query
          name: start
          schema:
            type: string
            format: date-time
        - in: query
          name: end
          schema:
            type: string
            format: date-time
        - in: query
          name: fmt
          schema:
            type: string
            enum:
              - csv
              - json
            default: csv
      responses:
        '200':
          description: text/csv | application/json stream
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminLogsAuditExport
      description: Export audit log (csv | json), max 50000 rows
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINLOGSAUDITEXPORT
      x-mate-implementation-status: implemented
  /api/v1/admin/logs/audit/{log_id}:
    parameters:
      - in: path
        name: log_id
        required: true
        schema:
          type: integer
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Audit log detail
      tags:
        - iam
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      operationId: iamGetAdminLogsAuditLogId
      description: Audit log detail
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINLOGSAUDITLOGID
      x-mate-implementation-status: implemented
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: string
  /api/v1/admin/logs/modules:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Distinct module/action counts (for filter UI)
      tags:
        - iam
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: iamGetAdminLogsModules
      description: Distinct module/action counts (for filter UI)
      x-mate-owner: security-iam
      x-mate-permission: iam.get
      x-mate-requirements:
        - FR-IAM-IAMGETADMINLOGSMODULES
      x-mate-implementation-status: implemented
  /api/v1/admin/operations/alerts/rules:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: List alert rules
      tags:
        - obs
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsAlertsRules
      description: List alert rules
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSALERTSRULES
      x-mate-implementation-status: placeholder
  /api/v1/admin/operations/capacity:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Capacity snapshot
      tags:
        - obs
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsCapacity
      description: Capacity snapshot
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSCAPACITY
      x-mate-implementation-status: placeholder
  /api/v1/admin/operations/health:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Operations health (per service)
      tags:
        - obs
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsHealth
      description: Operations health (per service)
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSHEALTH
      x-mate-implementation-status: placeholder
  /api/v1/admin/operations/metrics/self:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Self process metrics snapshot
      tags:
        - obs
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsMetricsSelf
      description: Self process metrics snapshot
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSMETRICSSELF
      x-mate-implementation-status: placeholder
  /api/v1/admin/operations/prometheus/query:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: Prometheus passthrough (best-effort)
      tags:
        - obs
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: PromQL expression
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/Error400'
      operationId: obsGetAdminOperationsPrometheusQuery
      description: Prometheus passthrough (best-effort)
      x-mate-owner: platform-observability
      x-mate-permission: obs.get
      x-mate-requirements:
        - FR-OBS-OBSGETADMINOPERATIONSPROMETHEUSQUERY
      x-mate-implementation-status: placeholder
  /api/v1/admin/orgs:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes:
            - platform.admin
      summary: List orgs (paginated)
      tags:
        - iam
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum:
              - DEPARTMENT
