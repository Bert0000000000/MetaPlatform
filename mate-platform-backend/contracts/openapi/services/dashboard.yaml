      x-mate-permission: dashboard.get
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDGETDASHBOARDNOTIFICATIONSUNREADCOUNT
      x-mate-implementation-status: placeholder
  /api/v1/dashboard/notifications/{notification_id}/read:
    parameters:
