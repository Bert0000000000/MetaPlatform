      description: List API keys (synthetic)
      x-mate-owner: business-workbench
      x-mate-permission: dashboard.get
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDGETDASHBOARDAPIKEYS
      x-mate-implementation-status: placeholder
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create API key
      tags:
      - dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: dashboardPostDashboardApiKeys
      description: Create API key
      x-mate-owner: business-workbench
      x-mate-permission: dashboard.post
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDPOSTDASHBOARDAPIKEYS
      x-mate-implementation-status: placeholder
  /api/v1/dashboard/api-keys/{api_key_id}:
    parameters:
    - in: path
      name: api_key_id
      required: true
      schema:
        type: string
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Revoke API key
      tags:
      - dashboard
      responses:
        '204':
          description: No Content
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: dashboardDeleteDashboardApiKeysApiKeyId
      description: Revoke API key
      x-mate-owner: business-workbench
      x-mate-permission: dashboard.delete
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDDELETEDASHBOARDAPIKEYSAPIKEYID
