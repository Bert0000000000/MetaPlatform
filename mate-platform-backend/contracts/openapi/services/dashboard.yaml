openapi: 3.1.0
info:
  title: Mate Platform dashboard API
  version: 1.0.0
  x-mate-owner: business-workbench
  description: Canonical contract for Mate Platform dashboard API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
- url: /
tags:
- name: dashboard
  description: dashboard domain operations
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes: [platform.read]
paths:
  /api/v1/dashboard/auth/login:
    post:
      summary: 'Workbench login (DEV: returns synthetic tokens, NOT real IAM)'
      tags:
      - dashboard
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
                tenantId:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Missing username or password
      operationId: dashboardPostDashboardAuthLogin
      description: 'Workbench login (DEV: returns synthetic tokens, NOT real IAM)'
      x-mate-owner: business-workbench
      x-mate-permission: dashboard.post
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDPOSTDASHBOARDAUTHLOGIN
      x-mate-implementation-status: placeholder
  /api/v1/dashboard/profile:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Current user profile (synthetic)
      tags:
      - dashboard
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: dashboardGetDashboardProfile
      description: Current user profile (synthetic)
      x-mate-owner: business-workbench
      x-mate-permission: dashboard.get
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDGETDASHBOARDPROFILE
      x-mate-implementation-status: placeholder
  /api/v1/dashboard/profile/permissions:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Aggregated permissions (synthetic)
      tags:
      - dashboard
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: dashboardGetDashboardProfilePermissions
      description: Aggregated permissions (synthetic)
      x-mate-owner: business-workbench
      x-mate-permission: dashboard.get
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDGETDASHBOARDPROFILEPERMISSIONS
      x-mate-implementation-status: placeholder
  /api/v1/dashboard/settings:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Get user preferences
      tags:
      - dashboard
      parameters:
      - in: query
        name: userId
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: dashboardGetDashboardSettings
      description: Get user preferences
      x-mate-owner: business-workbench
      x-mate-permission: dashboard.get
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDGETDASHBOARDSETTINGS
      x-mate-implementation-status: placeholder
    put:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Update user preferences
      tags:
      - dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
