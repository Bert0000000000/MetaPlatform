          - boolean
          - 'null'
        system:
          type:
          - boolean
          - 'null'
        mention:
          type:
          - boolean
          - 'null'
        alert:
          type:
          - boolean
          - 'null'
        email:
          type:
          - boolean
          - 'null'
        push:
          type:
          - boolean
          - 'null'
    ApiKeyCreate:
      type: object
      required:
      - name
      properties:
        tenantId:
          type: string
          default: tenant-default
        name:
          type: string
        userId:
          type:
          - string
          - 'null'
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    DownloadRequest:
      type: object
      required:
      - format
      properties:
        format:
          type: string
    TodoActionRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - approve
          - reject
        comment:
          type:
          - string
          - 'null'
    AnomalyRuleCreate:
      type: object
      required:
      - name
      - metricType
      - conditionOperator
      - threshold
      - timeWindowSeconds
      - aggregationFunction
      - severity
      properties:
        name:
          type: string
        metricType:
          type: string
        conditionOperator:
          type: string
        threshold:
          type: number
        timeWindowSeconds:
          type: integer
        aggregationFunction:
          type: string
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        enabled:
          type: boolean
          default: true
