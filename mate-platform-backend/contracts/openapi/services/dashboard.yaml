      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: List API keys (synthetic)
      tags:
      - dashboard
      parameters:
      - in: query
        name: tenantId
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
          default: 0
      - in: query
        name: size
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
