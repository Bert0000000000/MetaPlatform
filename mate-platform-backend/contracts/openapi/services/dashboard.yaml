      operationId: dashboardDeleteDashboardSessionsSessionId
      description: Revoke session
      x-mate-owner: business-workbench
      x-mate-permission: dashboard.delete
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDDELETEDASHBOARDSESSIONSSESSIONID
      x-mate-implementation-status: placeholder
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
  /api/v1/dashboard/api-keys:
