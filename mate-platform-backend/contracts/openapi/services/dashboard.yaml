      x-mate-permission: dashboard.get
      x-mate-requirements:
      - FR-DASHBOARD-DASHBOARDGETDASHBOARDSESSIONS
      x-mate-implementation-status: placeholder
  /api/v1/dashboard/sessions/{session_id}:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Revoke session
