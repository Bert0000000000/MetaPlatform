components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
        tenantId:
          type:
          - string
          - 'null'
    AuthResponse:
      type: object
      required:
      - accessToken
      - refreshToken
      - userId
      - username
      - user
      properties:
        loginResult:
          type: string
          default: SUCCESS
        userId:
          type: string
        username:
          type: string
        realName:
          type:
          - string
          - 'null'
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
        refreshExpiresIn:
          type: integer
        requirePasswordReset:
          type: boolean
        mfaRequired:
          type: boolean
        user:
          $ref: '#/components/schemas/UserInfo'
        loginAt:
          type: string
          format: date-time
        loginIp:
          type:
          - string
          - 'null'
    UserInfo:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type:
          - string
          - 'null'
        realName:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      - LOCKED
    UserCreate:
      type: object
      required:
      - username
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 64
        real_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        department:
          type:
          - string
          - 'null'
        position:
          type:
          - string
          - 'null'
        password:
          type:
          - string
          - 'null'
          minLength: 8
          maxLength: 128
        status:
          $ref: '#/components/schemas/UserStatus'
        is_super_admin:
          type: boolean
          default: false
        role_ids:
          type: array
          items:
            type: integer
    UserUpdate:
      type: object
      properties:
        real_name:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        department:
          type:
          - string
          - 'null'
        position:
          type:
          - string
          - 'null'
        avatar:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/UserStatus'
        is_super_admin:
          type:
          - boolean
          - 'null'
        role_ids:
          type:
          - array
          - 'null'
          items:
            type: integer
    OrgCreate:
      type: object
      required:
      - code
      - name
      properties:
        parent_id:
          type:
          - integer
          - 'null'
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
          - DEPARTMENT
          - COMPANY
          - TEAM
          - VIRTUAL
          default: DEPARTMENT
        leader_id:
          type:
          - integer
          - 'null'
        sort_order:
          type: integer
          default: 0
        description:
          type:
          - string
          - 'null'
          maxLength: 512
    OrgUpdate:
      type: object
      properties:
        parent_id:
          type:
          - integer
          - 'null'
        name:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
          enum:
          - DEPARTMENT
          - COMPANY
          - TEAM
          - VIRTUAL
        leader_id:
          type:
          - integer
          - 'null'
        sort_order:
          type:
          - integer
          - 'null'
        description:
          type:
          - string
          - 'null'
    PositionCreate:
      type: object
      required:
      - org_id
      - code
      - name
      properties:
        org_id:
          type: integer
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        level:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
    PositionUpdate:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        level:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
    TransferPayload:
      type: object
      required:
      - user_id
      - target_org_id
      properties:
        user_id:
          type: integer
        target_org_id:
          type: integer
        target_position_id:
          type:
          - integer
          - 'null'
        reports_to:
          type:
          - integer
          - 'null'
        reason:
          type:
          - string
          - 'null'
    RoleCreate:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type:
          - string
          - 'null'
        data_scope:
          type: string
          enum:
          - ALL
          - DEPT
          - DEPT_AND_SUB
          - SELF
          - CUSTOM
          default: SELF
        permission_ids:
          type: array
          items:
            type: integer
    RoleUpdate:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
          maxLength: 8192
        data_scope:
          type:
          - string
          - 'null'
          enum:
          - ALL
          - DEPT
          - DEPT_AND_SUB
          - SELF
          - CUSTOM
        permission_ids:
          type:
          - array
          - 'null'
          items:
            type: integer
    AssignPayload:
      type: object
      required:
      - type
