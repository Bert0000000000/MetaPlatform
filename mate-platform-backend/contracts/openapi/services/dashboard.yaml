      required: true
      schema:
        type: string
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Trigger remediation (synthetic; mode=AUTO executes, mode=ADVISE suggests)
      tags:
      - dashboard
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - AUTO
                  - ADVISE
                  default: ADVISE
                actionCode:
                  type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not found
      operationId: dashboardPostDashboardAnomaliesAnomalyIdRemediate
