openapi: 3.1.0
info:
  title: Mate Platform agent-team API
  version: 2.1.0
  x-mate-owner: agent-product-layer
  description: >-
    Agent 产品层 2.1 —— 超级大脑（langgraph 任务图）+ 数字员工。
    一句话 → 拆任务图 → 并行派给 ≥2 个数字员工（各有提示词与工具白名单）→ 真实执行
    → 中途一处人工确认 → 汇总。全程租户隔离由数据库 RLS 强制
    （thread_id = "<租户ID>|<任务ID>"，每连接设 app.tenant_id）。
    派活一律过 TeamBus 闸门（1.3 轨 1）：子员工权限包络必须 ⊆ **发起用户**
    从自身令牌解析出的包络，越权转 proposal、深度超限与跨租户硬拒。
  contact:
    name: Mate Platform Team
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes: [platform.read]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.local/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: read access
            platform.write: write access
            platform.admin: admin access
  schemas:
    SubTask:
      type: object
      required: [task_id, profile_id, instruction]
      properties:
        task_id:
          type: string
          description: 子任务 id（在一次 run 内唯一）
        profile_id:
          type: string
          description: 承接该子任务的数字员工 id
        instruction:
          type: string
          description: 下发给该员工的指令（已按 §5.4 裁剪，不是主上下文全量）
        depends_on:
          type: array
          items:
            type: string
          default: []
          description: |
            本节点的前置节点（**同一计划内**的 task_id）。依赖全部产出回执后
            本节点才会被派出去；无依赖 = 第一波。指向计划外的 id 或成环时，
            整轮在计划期判失败（不会静默挂住）。
    SubTaskResult:
      type: object
      properties:
        task_id:
          type: string
        team_task_id:
          type: string
          description: |
            该员工这次运行的**实例 id**（`team_task` 主键，跨运行唯一）。
            **追问该员工就投这个 id** —— `POST /tasks/{task_id}/messages` 收的
            是它；`task_id`（如 `t1`）只是计划内标签，两次运行会重复，投给它
            会被拒（终态）或投错运行。
        profile_id:
          type: string
        status:
          type: string
          enum: [ok, error, rejected]
        output:
          type: string
          description: 员工真实产出（非原话回填）
        tool_calls:
          type: array
          items:
            type: object
          description: 该员工实际发起的工具调用记录（审计用）
        llm_calls:
          type: integer
          description: |
            **本地**模型轮次。B-7（`MP-EXTERNAL-RUNTIME-E2E-01`）起，出站到外部
            agent 的往返**不再计入这里**——远端的 token 不是本平台花的。它单独记在
            `external_agent_calls`。
        external_agent_calls:
          type: integer
          description: |
            出站到外部 agent 的**往返次数**（成功与失败都算：成本口径问的是
            "打出去几次"）。当前只有 A2A 出站这一类。
        runtime_calls:
          type: integer
          description: |
            运行时**派发次数**（含重试）。与 `llm_calls` 分开：一次派发可能一次模型
            都没调（外部 runtime），一次模型轮次也可能在多次派发里发生
            （重试用尽后成功）。
          # 工具调用数**不另设标量**：`tool_calls` 那张清单就是记录，数出来的
          # 长度才是计数。同一个事实两个来源在本项目是明令禁止的。
        source:
          type: string
          enum: [llm, external, stub]
          description: |
            llm = 本地模型产出；external = 外部 agent 产出（A2A 出站）；
            stub = 未接线（供 D-10 "假回执" 断言）。
        error:
          type: string
        error_code:
          type: string
          description: |
            可判定的失败类别——`status` 里 `rejected`/`error` 分不开的几种情形
            靠它区分：
            - `E_AUTHORITY_ESCALATION`：派活越权，已转 proposal，**该子任务未执行**
              （授权只限本次任务，人工同意后才跑）；
            - `E_DEPTH_EXCEEDED`：嵌套层数超上限，硬拒，整轮判失败；
            - `E_PROFILE_NOT_FOUND`：员工不在本租户名册（跨租户 = 不存在），同上；
            - `E_RUNTIME_UNAVAILABLE`：**可重试**失败（模型 5xx / 网络抖动这类）
              按策略重试后仍不成功。只是**这一件**没干成，不是整轮失败。
        proposal:
          type: object
          description: |
            越权时的人审提案（ADR-0066 §3.4）：`escalations` 是越权的维度、
            `requested` 是各维度实际超出的能力、`scope=this_task_only` 声明
            授权范围**只作用于本次任务**（不写回员工定义）。
        attempts:
          type: integer
          default: 0
          description: |
            这一件**真正发起了几次**运行时调用（含重试；1 = 一次过手）。
            没被执行的（越权转 proposal / 硬拒）为 0。重试只作用于**运行时那一次
            调用**：派活（建任务行、落审计、转 proposal）是副作用，不会被重做。
        evidence:
          type: array
          description: |
            该员工工具调用结果映射出的**结构化证据**（1.6）。形状与 copilot 的
            证据条目**完全一致**——同一平台里"证据"只有一种样子：

            - `type`：`ONTOLOGY_OBJECT`（对象/类型级）或 `ONTOLOGY_METRIC`（聚合指标）；
            - `ref`：可寻址引用（实例 rid / 类型 rid / 指标名）；
            - `objectId`：**仅实例证据**有；类型级与指标级不设（拿它调实例接口会 404）；
            - `concept`：人读的名字（可缺）；
            - `fragment`：结果片段（可缺）；
            - `evidenceId`：运行内唯一，供前端去重/追加；
            - `capturedAt`：抓取时刻（UTC，`%Y-%m-%dT%H:%M:%SZ`）。

            **忠实映射**：只对结果里真实存在的字段取证，取不到就**不产出条目**
            （工具成功但无证据是正常结果，不是异常）。被闸门拒绝或执行失败的工具
            调用**不产证据**——那种结果里没有可取证的事实。
          items:
            type: object
        artifacts:
          type: array
          description: |
            该员工产出的**可寻址交付物**的元数据（1.6 任务 2，形状见
            `Artifact`）；正文按 `artifact_id` 另取。

            只有 `status=ok` 且产出**非空白**才有一条——空产出不是交付物。
            落库失败**不吞**：产出拿得到却在回执里给不出地址，等于另一种
            "假回执"，宁可让这一轮明确失败。
          items:
            $ref: "#/components/schemas/Artifact"
    RunState:
      type: object
      required: [run_id, tenant_id, goal, status]
      properties:
        run_id:
          type: string
        tenant_id:
          type: string
        goal:
          type: string
          description: 用户那句话
        status:
          type: string
          enum:
            [
              planning,
              running,
              awaiting_approval,
              completed,
              failed,
              cancelled,
              timeout,
            ]
          description: |
            `cancelled` = 被 `POST /runs/{run_id}/cancel` 取消（正在执行的 run
            由**图自己在节点边界**落成这个状态，不是因为外部把它杀掉）；
            `timeout` = 超过本轮截止时间（`timeout_seconds` 或部署默认值）后落到
            的终态。两者都是**终态**：之后再 `approve` 一律 409。
        subtasks:
          type: array
          items:
            $ref: "#/components/schemas/SubTask"
        results:
          type: object
          description: task_id → SubTaskResult
          additionalProperties:
            $ref: "#/components/schemas/SubTaskResult"
        summary:
          type: string
        hitl_reason:
          type: string
        error:
          type: string
        timeout_seconds:
          type: number
          description: |
            本轮**实际生效**的运行级超时（秒；0 = 不设超时）。请求省略
            `timeout_seconds` 时这里落的是开跑那一刻的部署默认值。
        deadline_at:
          type: number
          description: |
            本轮截止的**绝对时刻**（Unix 秒；0 = 无截止）。
            `timeout_seconds` 与 `deadline_at` 都随 run 落库：服务重启后仍按
            **本轮**定下的值裁决，不会回落到重启后进程的默认值。
    RunAccepted:
      type: object
      required: [run_id, tenant_id, status]
      description: |
        `POST /runs` 的受理回执（1.7）：**只回受理事实，不回运行结果**。

        起一轮运行要拆图 + 并行派活，实测量级是**分钟**，而网关读超时是 60s。
        同步返回时客户端拿到的是 504，且**这一轮其实已经建好了**——重试一次
        就多跑一轮。改成受理制之后：提交立刻拿到 `run_id`，终态**只能**从
        `GET /runs/{run_id}` 或事件流取。
      properties:
        run_id:
          type: string
          description: 本轮运行的地址；`GET /runs/{run_id}` 与事件流都用它
        tenant_id:
          type: string
        status:
          type: string
          description: |
            受理那一刻的状态（通常是 `running`）。**不是终态**：终态要订阅
            事件流或轮询 `GET /runs/{run_id}` 才拿得到。
        deduplicated:
          type: boolean
          default: false
          description: |
            这次提交是否**没有新起一轮**：请求带了同一个 `Idempotency-Key`
            且该键已经对应到一个 run，此时原样返回那轮的 `run_id`。
            重试因此不会多跑一轮——这正是同步版 504 之后那个坑的根治办法。
    StartRunRequest:
      type: object
      required: [goal]
      properties:
        goal:
          type: string
          description: 用户的一句话目标
          minLength: 1
        max_parallel:
          type: integer
          default: 3
          description: 本轮最多并行派出的员工数（≥2）
        timeout_seconds:
          type: number
          minimum: 0
          description: |
            本轮的运行级截止时间（秒）。省略时用部署默认值
            （`MATE_AGENT_TEAM_RUN_TIMEOUT_SECONDS`，0 = 不设超时）。到点后运行
            落终态 `timeout`，不会一直停在闸门上等人。

            生效值**随 run 落库**（见 `RunState.timeout_seconds` / `deadline_at`），
            服务重启后仍按本轮的值裁决。
    ApproveRequest:
      type: object
      properties:
        approved:
          type: boolean
          default: true
        comment:
          type: string
          default: ""
    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        sender:
          type: string
          default: user
          description: 投递方标识；子 agent 回问时填自己的 task_id
    ChannelMessage:
      type: object
      required: [sender, text, at]
      properties:
        sender:
          type: string
        text:
          type: string
        at:
          type: string
          description: 投递时刻（ISO8601）
    AuditRecord:
      type: object
      required: [audit_id, action, tenant_id, task_id, outcome, at]
      properties:
        audit_id:
          type: string
          description: 审计行 id（进程内唯一，落一行一行）
        action:
          type: string
          enum:
            - agent_team.spawn
            - agent_team.authority_escalation
            - agent_team.approval
            - agent_team.delegation
          description: |
            被审计的动作。**派活**（每次派活一行）、**越权转 proposal**
            （包络超出链根 → 转人审）、**审批**（run 级闸门或任务级授权）、
            **委托签发**（A-2 起：续跑时那次运行期委托的签发或拒绝）。
        tenant_id:
          type: string
        actor:
          type: string
          description: 发起用户（令牌 sub）；解析不出就是空串
        task_id:
          type: string
        run_id:
          type: string
        profile_id:
          type: string
        outcome:
          type: string
          description: 该动作的结果（granted / proposal / approved / rejected …）
        detail:
          type: object
          additionalProperties: true
        at:
          type: string
          description: 记录时刻（ISO8601）
        sequence:
          type: integer
          description: |
            租户内单调序号（A-1 起）。链按租户成链，序号是链接起来的骨架：
            断号 = 有行被删。
        event_id:
          type: string
          description: 事件 id（投递到 Outbox 时用它做幂等键）
        agent_profile_revision:
          type: string
          description: 判定发生时该员工定义的修订号（空串 = 该员工无修订号）
        decision:
          type: string
          description: 判定结论（granted / escalated / approved / rejected …）
        approver_id:
          type: string
          description: 审批人（令牌 sub）；非审批动作是空串
        authority_before:
          type: object
          additionalProperties: true
          description: 判定**之前**的权限包络（四维定序）
        authority_after:
          type: object
          additionalProperties: true
          description: 判定**之后**的权限包络（收窄后的那一份）
        policy_version:
          type: string
          description: 依哪一版判定口径判的（改口径就加版号，历史行仍可解释）
        trace_id:
          type: string
          description: OTel trace id（硬规则 #9：审计与 trace 可互查）
        previous_hash:
          type: string
          description: 该租户上一条的 event_hash（链首为 64 个 0）
        event_hash:
          type: string
          description: |
            sha256(previous_hash ‖ 规范化正文)。**改这一行就对不上**——审计员
            可以用这一列自己重算，不必信任服务端结论。
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"
    Artifact:
      type: object
      required: [artifact_id]
      description: |
        一件**产出物**的元数据（1.6 任务 2）。正文不在列表里——按
        `artifact_id` 走 `GET /artifacts/{artifact_id}` 另取。

        落地存储是 **PG**（不是 MinIO）：租户隔离只有 PG 这条路是数据库强制的
        （RLS），且"可寻址"要的主键 PG 直接给；产出物是 KB 级文本，对象存储的
        强项用不上。理由全文见服务端 `artifact_store` 模块注释。
      properties:
        artifact_id:
          type: string
          description: |
            产出物地址，形状 `{run_id 前 8 位}-{计划内标签}`。按运行唯一，所以
            同一个员工在同一轮里的主交付物**只有一个地址**（重放不会攒出第二条）。
        run_id:
          type: string
        task_id:
          type: string
        profile_id:
          type: string
          description: 产出它的数字员工
        kind:
          type: string
          description: |
            产出物种类。当前只有 `report`（员工的自由文本产出）。种类由**生产方**
            声明，不按正文内容猜。
        title:
          type: string
        content_type:
          type: string
          description: 正文的媒体类型（当前恒为 `text/markdown`）
        size:
          type: integer
          description: 正文的**字节数**
        created_at:
          type: string
          description: 落库时刻（ISO8601）
    ArtifactContent:
      allOf:
        - $ref: "#/components/schemas/Artifact"
        - type: object
          properties:
            content:
              type: string
              description: 正文原文
    ArtifactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
    EmployeeProfile:
      type: object
      required: [profile_id, name, base_role]
      properties:
        profile_id:
          type: string
        name:
          type: string
        base_role:
          type: string
          description: kernel AgentRole 枚举之一
        system_prompt:
          type: string
        skills:
          type: array
          items:
            type: string
          description: 绑定的 skillhub skill id（只出清单，正文按需读）
        tools:
          type: array
          items:
            type: string
          description: 工具白名单（MCP 工具名）；白名单外调用被拒
        action_rids:
          type: array
          items:
            type: string
          description: 权限包络 · 可写的 Action rid（ADR-0066 §3.3）
        kb_ids:
          type: array
          items:
            type: string
          description: 权限包络 · 可读的知识库 id
        markings:
          type: array
          items:
            type: string
          description: 权限包络 · 可见的数据标记
        model:
          type: string
          description: 该员工使用的模型（llmgw 侧的名字）
        origin:
          type: string
          description: builtin = 代码里的内置定义；instantiated = 本租户建出来的行
    ProfileWriteRequest:
      type: object
      required: [name]
      properties:
        profile_id:
          type: string
          description: |
            省略时现生成 `EMP-XXXXXXXX`；给了就是**幂等 upsert**——同一个 id
            再提交一次即覆盖，不需要先查再建。
        name:
          type: string
          minLength: 1
        base_role:
          type: string
          default: ontology
          description: kernel AgentRole 枚举之一
        system_prompt:
          type: string
        skills:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
        action_rids:
          type: array
          items:
            type: string
        kb_ids:
          type: array
          items:
            type: string
        markings:
          type: array
          items:
            type: string
        model:
          type: string
    SkillManifestEntry:
      type: object
      required: [skill_id, name]
      properties:
        skill_id:
          type: string
        name:
          type: string
        description:
          type: string
          description: 一句话描述（清单层只出这个，不出正文）
    SkillManifest:
      type: object
      required: [profile_id, entries, manifest_chars, budget_chars]
      properties:
        profile_id:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SkillManifestEntry"
        manifest_chars:
          type: integer
          description: 清单实际字符数
        budget_chars:
          type: integer
          description: 预算上限（默认 8000，即上下文 2%）
    SkillContent:
      type: object
      required: [skill_id, content]
      properties:
        skill_id:
          type: string
        content:
          type: string
          description: skill 正文（渐进加载第 2 层，选中后才读）
paths:
  /api/v1/agent-team/runs:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes: [platform.write]
      summary: 提交一句话，受理后**异步**拆任务图并并行派活（返回 202 + run_id）
      description: |
        一句话 → 拆任务图 → 并行派给 ≥2 个数字员工 → 停在人工确认闸门。

        **受理制（1.7）**：本接口**不再同步等图跑完**。拆图 + 并行派活实测量级
        是分钟，而网关读超时是 60s——同步返回时客户端只会拿到 504，且这一轮
        其实已经建好，重试一次就多跑一轮。现在提交**立刻**返回 `202` +
        `run_id`；终态只能从 `GET /runs/{run_id}` 或 `GET /runs/{run_id}/events`
        取。返回时该 `run_id` **已经可查**（首次检查点已落），所以拿到就能订阅。

        **重复提交不产生重复 run**：带上 `Idempotency-Key` 时，同一个键（同租户
        内）永远映射到同一轮运行；重复提交原样回同一个 `run_id`，并置
        `deduplicated: true`，**不会再起一轮**。不带该头则每次都起新一轮。

        **可重试的员工故障会按策略重试**（1.5）：员工运行时那一次调用遇到"可能
        自己好"的失败（模型 5xx / 限流 / 网络抖动）时重试（次数与退避由部署
        配置决定），重试用尽才把这一件记成 `E_RUNTIME_UNAVAILABLE`。**派活**
