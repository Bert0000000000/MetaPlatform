      tags: [agent-team]
      operationId: agentTeamPostRuns
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
          description: |
            提交幂等键。同一个键（**同一租户内**）重复提交只会有一轮运行：
            第二次起原样回第一次的 `run_id`。省略则不受幂等保护。
