  /api/v1/agent-team/runs/{run_id}/cancel:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes: [platform.write]
      summary: 取消一轮运行（落终态，幂等）
      description: |
        把 run 写进终态 `cancelled`——**写进检查点**，因此 `GET /runs/{id}` 与
        后续 `approve` 都看得到（确认一个已作废的计划一律 409）。重复取消不会
        覆盖更早的终态。跨租户与不存在同码 404，不泄露存在性。

        **执行中的 run 也能取消**（1.5）：取消不靠外部杀——图在节点边界自查取消
        标志，看到就自己落终态。粒度是**波与波之间**：在途的那一波允许跑完
        （不硬断），已完成节点不重跑，下一波一个员工都不派。本调用**等图停下
        再回**，所以 200 时该 run 已经不再推进。
      tags: [agent-team]
      operationId: agentTeamPostRunCancel
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 取消后的运行状态（status = cancelled）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunState"
        "404":
          description: 该租户下不存在此 run（跨租户与不存在同码）
      x-mate-owner: agent-product-layer
      x-mate-permission: agent-team.write
      x-mate-requirements: [FR-AGENT-TEAM-AGENTTEAMPOSTRUNCANCEL]
      x-mate-implementation-status: implemented
  /api/v1/agent-team/runs/{run_id}/events:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes: [platform.read]
      summary: 步骤级事件流（SSE：回放 + 尾随）
      description: |
        `text/event-stream`。连上先**回放**已有步骤（历史一条不少），再**尾随**
        新步骤：之后图每推进一步就往外推一条，直到 run 落终态才发 `event: end`
        收流。每条是 `event: step` +
        `data: {seq, step, ran, next, status, at, evidence}`（`ran` = 这一步真的
        跑掉的节点）。

        `evidence` 是**这一步新出现的**证据条目（形状见 `SubTaskResult.evidence`），
        按 `evidenceId` 去重后顺序 append 即可。只出增量是刻意的：回执整份都在
        检查点里，整份重发的话每来一步都要重传全部历史证据。

        **实现边界**：尾随靠轮询检查点（没有引入消息总线），新步骤最多晚一个
        轮询间隔（当前 250ms）到达。终态判定与流关闭是同一个事实——停在
        `awaiting_approval` 的运行**不会**自己关流，它在等人确认。

        **调用方必须带 `Accept: text/event-stream`**：网关按这个头决定走不走
        "边收边发"的转发路径（它没有声明就等于不要流式，网关会把整份响应读完再
        回话，这条流就永远到不了）。浏览器 `fetch` / `EventSource` 天然会发；
        用 `curl` 试要写 `curl -N -H 'Accept: text/event-stream'`。
      tags: [agent-team]
      operationId: agentTeamGetRunEvents
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE 流（text/event-stream）
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: 该租户下不存在此 run
      x-mate-owner: agent-product-layer
      x-mate-permission: agent-team.read
      x-mate-requirements: [FR-AGENT-TEAM-AGENTTEAMGETRUNEVENTS]
      x-mate-implementation-status: implemented
