openapi: 3.1.0
info:
  title: Mate Platform rag API
  version: 1.0.0
  x-mate-owner: knowledge-platform
servers:
- url: /
tags:
- name: rag
  description: rag domain operations
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      tags:
      - rag
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      operationId: ragGetHealthz
      description: Liveness probe
      x-mate-owner: knowledge-platform
      x-mate-permission: rag.get
      x-mate-requirements:
      - FR-RAG-RAGGETHEALTHZ
      x-mate-implementation-status: placeholder
  /api/v1/rag/status:
    get:
      summary: System status (embedder + index backends)
      tags:
      - rag
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
      operationId: ragGetRagStatus
      description: System status (embedder + index backends)
      x-mate-owner: knowledge-platform
      x-mate-permission: rag.get
      x-mate-requirements:
      - FR-RAG-RAGGETRAGSTATUS
      x-mate-implementation-status: placeholder
  /api/v1/rag/stats:
    get:
      summary: Indexed chunk count + embedder dim
      tags:
      - rag
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
      operationId: ragGetRagStats
      description: Indexed chunk count + embedder dim
      x-mate-owner: knowledge-platform
      x-mate-permission: rag.get
      x-mate-requirements:
      - FR-RAG-RAGGETRAGSTATS
      x-mate-implementation-status: placeholder
  /api/v1/rag/admin/pg-stats:
    get:
      summary: PostgreSQL store diagnostics
      tags:
      - rag
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PgStatsResponse'
      operationId: ragGetRagAdminPgStats
      description: PostgreSQL store diagnostics
      x-mate-owner: knowledge-platform
      x-mate-permission: rag.get
      x-mate-requirements:
      - FR-RAG-RAGGETRAGADMINPGSTATS
      x-mate-implementation-status: placeholder
  /api/v1/rag/parse:
    post:
      summary: Parse raw text via RAGFlow and fan out to 3 indexes
      tags:
      - rag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
        '500':
          description: Parse / index failure
      operationId: ragPostRagParse
      description: Parse raw text via RAGFlow and fan out to 3 indexes
      x-mate-owner: knowledge-platform
      x-mate-permission: rag.post
      x-mate-requirements:
      - FR-RAG-RAGPOSTRAGPARSE
      x-mate-implementation-status: placeholder
  /api/v1/rag/ingest:
    post:
      summary: Ingest pre-chunked text into all 3 indexes
      tags:
      - rag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '500':
          description: Ingest failure
      operationId: ragPostRagIngest
      description: Ingest pre-chunked text into all 3 indexes
      x-mate-owner: knowledge-platform
      x-mate-permission: rag.post
      x-mate-requirements:
      - FR-RAG-RAGPOSTRAGINGEST
      x-mate-implementation-status: placeholder
  /api/v1/rag/upload:
    post:
      summary: Multipart upload (text/markdown) -> parse + 3-index fan-out
      tags:
      - rag
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: text/markdown file
                document_id:
                  type: string
                  description: optional client-supplied document id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Empty file
        '500':
          description: Parse / index failure
      operationId: ragPostRagUpload
      description: Multipart upload (text/markdown) -> parse + 3-index fan-out
      x-mate-owner: knowledge-platform
      x-mate-permission: rag.post
      x-mate-requirements:
      - FR-RAG-RAGPOSTRAGUPLOAD
      x-mate-implementation-status: placeholder
  /api/v1/rag/search:
    post:
      summary: 3-strategy retrieval (auto / factual / entity / thematic)
      tags:
      - rag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalResponse'
        '500':
          description: Retrieval failure
      operationId: ragPostRagSearch
      description: 3-strategy retrieval (auto / factual / entity / thematic)
      x-mate-owner: knowledge-platform
      x-mate-permission: rag.post
      x-mate-requirements:
      - FR-RAG-RAGPOSTRAGSEARCH
      x-mate-implementation-status: placeholder
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - service
      - version
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
    EmbedderInfo:
      type: object
      required:
      - provider
      - dim
      properties:
        provider:
          type: string
          description: local | openai
        model_name:
          type: string
        dim:
          type: integer
          minimum: 0
    IndexStatus:
      type: object
      required:
      - name
      - backend
      - chunk_count
      properties:
        name:
          type: string
          enum:
          - hybrid
          - graph
          - lightrag
        backend:
          type: string
          description: memory | milvus | neo4j | lightrag | lightrag-http
        chunk_count:
          type: integer
          minimum: 0
    SystemStatus:
      type: object
      required:
      - status
      - service
      - version
      - embedder
      - indexes
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        embedder:
          $ref: '#/components/schemas/EmbedderInfo'
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/IndexStatus'
    StatsResponse:
      type: object
      required:
      - total_chunks
      - embedder_dim
      properties:
        total_chunks:
          type: integer
          minimum: 0
        embedder_dim:
          type: integer
          minimum: 0
    PgStatsResponse:
      type: object
      required:
      - available
      - chunks_count
      properties:
        available:
          type: boolean
        chunks_count:
          type: integer
          minimum: 0
        dsn_host:
          type: string
    ParseRequest:
      type: object
      required:
      - document_id
      - content
      properties:
        document_id:
          type: string
          minLength: 1
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 1000000
        metadata:
          type: object
          additionalProperties:
            type: string
    ParseResponse:
      type: object
      required:
      - document_id
      - chunk_count
      - ragflow_parsed
      - indexed_in
      properties:
        document_id:
          type: string
        chunk_count:
          type: integer
          minimum: 0
        ragflow_parsed:
          type: integer
          minimum: 0
        indexed_in:
          type: array
          items:
            type: string
    IngestRequest:
      type: object
      required:
      - document_id
      - chunks
      properties:
        document_id:
          type: string
          minLength: 1
          maxLength: 64
        chunks:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    IngestResponse:
      type: object
      required:
      - document_id
      - chunk_count
      - total_chunks
      properties:
        document_id:
          type: string
        chunk_count:
          type: integer
          minimum: 0
        total_chunks:
          type: integer
          minimum: 0
    UploadResponse:
      type: object
      required:
      - document_id
      - filename
      - size_bytes
      - chunk_count
      - indexed_in
      properties:
        document_id:
          type: string
        filename:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        chunk_count:
          type: integer
          minimum: 0
        indexed_in:
          type: array
          items:
            type: string
    ChunkHit:
      type: object
      required:
      - chunk_id
      - document_id
      - score
      - text
      properties:
        chunk_id:
          type: string
        document_id:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        text:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    RetrievalRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4096
        top_k:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        mode:
          type: string
          enum:
          - AUTO
          - FACTUAL
          - ENTITY
          - THEMATIC
          default: AUTO
        metadata_filter:
          type: object
          additionalProperties:
            type: string
    RetrievalResponse:
      type: object
      required:
      - query
      - hits
      - total
      - latency_ms
      - mode
      properties:
        query:
          type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/ChunkHit'
        total:
          type: integer
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0
        mode:
          type: string
          enum:
          - FACTUAL
          - ENTITY
          - THEMATIC
