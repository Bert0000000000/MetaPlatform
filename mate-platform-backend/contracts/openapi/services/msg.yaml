openapi: 3.1.0
info:
  title: Mate Platform msg API
  version: 1.0.0
  x-mate-owner: platform-messaging
servers:
- url: /
tags:
- name: msg
  description: msg domain operations
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      summary: 健康检查
      tags:
      - msg
      responses:
        '200':
          description: OK
      operationId: msgGetHealthz
      description: 健康检查
      x-mate-owner: platform-messaging
      x-mate-permission: msg.get
      x-mate-requirements:
      - FR-MSG-MSGGETHEALTHZ
      x-mate-implementation-status: implemented
  /api/v1/msg/publish:
    post:
      summary: 发布消息
      tags:
      - msg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '500':
          description: 发布失败
      operationId: msgPostMsgPublish
      description: 发布消息
      x-mate-owner: platform-messaging
      x-mate-permission: msg.post
      x-mate-requirements:
      - FR-MSG-MSGPOSTMSGPUBLISH
      x-mate-implementation-status: implemented
  /api/v1/msg/topics:
    get:
      summary: 列出主题
      tags:
      - msg
      responses:
        '200':
          description: OK
      operationId: msgGetMsgTopics
      description: 列出主题
      x-mate-owner: platform-messaging
      x-mate-permission: msg.get
      x-mate-requirements:
      - FR-MSG-MSGGETMSGTOPICS
      x-mate-implementation-status: placeholder
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PublishRequest:
      type: object
      required:
      - topic
      - payload
      properties:
        topic:
          type: string
        payload:
          type: object
        partition_key:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
    PublishResponse:
      type: object
      properties:
        topic:
          type: string
        partition:
          type: integer
        offset:
          type: integer
        idempotency_hit:
          type: boolean
