openapi: 3.1.0
info:
  title: Mate Platform mcp API
  version: 1.0.0
  x-mate-owner: ai-protocols
  description: Canonical contract for Mate Platform mcp API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
- url: /
tags:
- name: mcp
  description: mcp domain operations
- name: federation
  description: MCP federation (external MCP server registry & cross-server tool routing)
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes: [platform.read]
paths:
  /healthz:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
      summary: 健康检查
      tags:
      - mcp
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: mcpGetHealthz
      description: 健康检查
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.get
      x-mate-requirements:
      - FR-MCP-MCPGETHEALTHZ
      x-mate-implementation-status: implemented
  /api/v1/mcp/tool-categories:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: 列出所有工具分类
      tags:
      - mcp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolCategory'
      operationId: mcpGetMcpToolCategories
      description: 列出所有工具分类（工具注册中心的分类树数据源）
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.get
      x-mate-requirements:
      - FR-MCP-MCPGETMCPTOOLCATEGORIES
      x-mate-implementation-status: implemented
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: 创建工具分类
      tags:
      - mcp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCategoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCategory'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: mcpPostMcpToolCategory
      description: 创建工具分类（code 重复返回 400）
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-MCPPOSTMCPTOOLCATEGORY
      x-mate-implementation-status: implemented
  /api/v1/mcp/tool-categories/{category_id}:
    put:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: 更新工具分类
      tags:
      - mcp
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCategoryCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCategory'
        '404':
          $ref: ../common/errors.yaml#/components/responses/Error404
      operationId: mcpPutMcpToolCategory
      description: 更新工具分类的名称/描述/排序
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-MCPPUTMCPTOOLCATEGORY
      x-mate-implementation-status: implemented
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: 删除工具分类
      tags:
      - mcp
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '404':
          $ref: ../common/errors.yaml#/components/responses/Error404
      operationId: mcpDeleteMcpToolCategory
      description: 删除工具分类（无工具引用时）
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-MCPDELETEMCPTOOLCATEGORY
      x-mate-implementation-status: implemented
  /api/v1/mcp/tools:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: 列出所有已注册工具
      tags:
      - mcp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolSpec'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: mcpGetMcpTools
      description: 列出所有已注册工具
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.get
      x-mate-requirements:
      - FR-MCP-MCPGETMCPTOOLS
      x-mate-implementation-status: implemented
    post:
      summary: 动态注册工具（W2 服务中心）
      tags:
      - mcp
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterToolRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicTool'
        '401':
          description: 缺少或无效 JWT
        '422':
          description: 请求体校验失败
      operationId: mcpPostMcpTools
      description: 动态注册工具（数字员工 / 外部 worker 能力，带转发 endpoint）
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-MCPPOSTMCPTOOLS
      x-mate-implementation-status: implemented
  /api/v1/mcp/tools/{name}:
    post:
      summary: HTTP 桥接 — 调工具
      tags:
      - mcp
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                arguments:
                  type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool:
                    type: string
                  result: {}
        '401':
          description: 缺少或无效 JWT
        '404':
          description: 工具不存在
        '429':
          description: 触发限流
      operationId: mcpPostMcpToolsName
      description: HTTP 桥接 — 调工具
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-MCPPOSTMCPTOOLSNAME
      x-mate-implementation-status: implemented
    put:
      summary: 更新动态工具（W2）
      tags:
      - mcp
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateToolRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicTool'
        '401':
          description: 缺少或无效 JWT
        '404':
          description: 工具不存在
      operationId: mcpPutMcpToolsName
      description: 更新动态工具（endpoint / description / enabled）
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.put
      x-mate-requirements:
      - FR-MCP-MCPPUTMCPTOOLSNAME
      x-mate-implementation-status: implemented
    delete:
      summary: 注销动态工具（W2）
      tags:
      - mcp
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 注销成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        '401':
          description: 缺少或无效 JWT
        '404':
          description: 工具不存在
      operationId: mcpDeleteMcpToolsName
      description: 注销动态工具
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.delete
      x-mate-requirements:
      - FR-MCP-MCPDELETEMCPTOOLSNAME
      x-mate-implementation-status: implemented
  /api/v1/mcp/resources:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: 列出资源
      tags:
      - mcp
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: mcpGetMcpResources
      description: 列出资源
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.get
      x-mate-requirements:
      - FR-MCP-MCPGETMCPRESOURCES
      x-mate-implementation-status: implemented
  /api/v1/mcp/prompts:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: 列出 prompt 模板
      tags:
      - mcp
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: mcpGetMcpPrompts
      description: 列出 prompt 模板
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.get
      x-mate-requirements:
      - FR-MCP-MCPGETMCPPROMPTS
      x-mate-implementation-status: implemented
  /api/v1/mcp/prompts/{name}:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: 渲染 prompt 模板
      tags:
      - mcp
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '404':
          description: prompt 不存在
      operationId: mcpPostMcpPromptsName
      description: 渲染 prompt 模板
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-MCPPOSTMCPPROMPTSNAME
      x-mate-implementation-status: implemented
  # ---- MCP Federation (backlog §3.8): external MCP server registry ----
  # Field names / response wrappers / status enum mirror the actual
  # implementation in packages/mate-tech-mcp (federation.py +
  # federation_routes.py). Spec follows code.
  /api/v1/mcp/federation/servers:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: 注册外部 MCP server
      tags:
      - federation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterFederationServerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    $ref: '#/components/schemas/FederatedServer'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: mcpPostMcpFederationServers
      description: 注册外部 MCP server(租户隔离)
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-FEDERATION-REGISTER
      x-mate-implementation-status: implemented
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: 列出已注册的联邦 server
      tags:
      - federation
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [active, disabled, deleted]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FederatedServer'
                  total:
                    type: integer
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: mcpGetMcpFederationServers
      description: 列出已注册的联邦 server(按 status 过滤)
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.get
      x-mate-requirements:
      - FR-MCP-FEDERATION-LIST
      x-mate-implementation-status: implemented
  /api/v1/mcp/federation/servers/{server_id}:
    parameters:
    - name: server_id
      in: path
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: 获取单个联邦 server 详情
      tags:
      - federation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    $ref: '#/components/schemas/FederatedServer'
        '404':
          description: federated server not found
      operationId: mcpGetMcpFederationServersServerId
      description: 获取单个联邦 server 详情
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.get
      x-mate-requirements:
      - FR-MCP-FEDERATION-GET
      x-mate-implementation-status: implemented
    put:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: 更新联邦 server(transport_url / auth_token_ref / status / tools)
      tags:
      - federation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFederationServerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    $ref: '#/components/schemas/FederatedServer'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
        '404':
          description: federated server not found
      operationId: mcpPutMcpFederationServersServerId
      description: 更新联邦 server
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-FEDERATION-UPDATE
      x-mate-implementation-status: implemented
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: 注销联邦 server(软删除 → status=deleted)
      tags:
      - federation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  server_id:
                    type: string
        '404':
          description: federated server not found
      operationId: mcpDeleteMcpFederationServersServerId
      description: 注销联邦 server
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-FEDERATION-DELETE
      x-mate-implementation-status: implemented
  /api/v1/mcp/federation/tools:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: 列出所有联邦 server 暴露的远程工具(聚合)
      tags:
      - federation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FederatedTool'
                  total:
                    type: integer
      operationId: mcpGetMcpFederationTools
      description: 列出所有联邦 server 暴露的远程工具(聚合)
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.get
      x-mate-requirements:
      - FR-MCP-FEDERATION-TOOLS
      x-mate-implementation-status: implemented
  /api/v1/mcp/federation/tools/{tool_name}/invoke:
    parameters:
    - name: tool_name
      in: path
      required: true
      schema:
        type: string
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: 路由调用联邦工具
      tags:
      - federation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRemoteToolRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tool:
                    type: string
                  server_id:
                    type: string
                  server_name:
                    type: string
                  result: {}
        '404':
          description: tool not found in any federated server
        '502':
          description: remote MCP server unreachable
      operationId: mcpPostMcpFederationToolsToolNameInvoke
      description: 路由调用联邦工具(按 tool_name 找到暴露它的 server)
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.post
      x-mate-requirements:
      - FR-MCP-FEDERATION-INVOKE
      x-mate-implementation-status: implemented
  /api/v1/mcp/protocol/mcp:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: MCP streamable-http SSE 流（W4 外部 MCP 客户端）
      description: MCP 协议标准端点 — initialize / tools/list / tools/call 经 streamable HTTP (JSON-RPC + SSE)。
      tags: [mcp]
      responses:
        '200':
          description: SSE 事件流
      operationId: mcpGetMcpProtocol
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.read
      x-mate-requirements:
      - FR-MCP-PROTOCOL-GET
      x-mate-implementation-status: implemented
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      x-required-scopes: [platform.write]
      summary: MCP streamable-http JSON-RPC 端点（W4）
      description: MCP 协议标准端点 — 外部 MCP 客户端（Claude Desktop / Cursor 等）经此发现与调用服务中心工具。
      tags: [mcp]
      responses:
        '200':
          description: MCP JSON-RPC 响应或 SSE 流
        '401':
          description: 缺少或无效 JWT
      operationId: mcpPostMcpProtocol
      x-mate-owner: ai-protocols
      x-mate-permission: mcp.write
      x-mate-requirements:
      - FR-MCP-PROTOCOL-POST
      x-mate-implementation-status: implemented
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  schemas:
    ToolSpec:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        inputSchema:
          type: object
    RegisterToolRequest:
      type: object
      required:
      - name
      - endpoint
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          default: ""
        input_schema:
          type: object
          default:
            type: object
        endpoint:
          type: string
          description: 转发执行目标 URL（MCP-to-MCP）
    UpdateToolRequest:
      type: object
      properties:
        description:
          type: string
        input_schema:
          type: object
        endpoint:
          type: string
        enabled:
          type: boolean
    DynamicTool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
        endpoint:
          type: string
        enabled:
          type: boolean
    ToolCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        parent_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, code]
    ToolCategoryCreate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        parent_id:
          type: string
          nullable: true
      required: [name, code]
    # ---- Federation schemas (mirror federation.py FederatedServer) ----
    FederatedServer:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        transport_url:
          type: string
          format: uri
          description: Base URL of the remote MCP server (http/https)
        auth_token_ref:
          type: string
          description: Secret reference, e.g. 'vault://path/to/token'
        status:
          type: string
          enum: [active, disabled, deleted]
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tools:
          type: array
          items:
            type: string
    RegisterFederationServerRequest:
      type: object
      required: [name, transport_url, auth_token_ref]
      properties:
        name:
          type: string
          minLength: 1
          description: Logical name (unique per tenant)
        transport_url:
          type: string
          description: Base URL of the remote MCP server (http/https)
        auth_token_ref:
          type: string
          description: Secret reference, e.g. 'vault://path/to/token'
        description:
          type: string
        tools:
          type: array
          items:
            type: string
          description: Tool names this server exposes
    UpdateFederationServerRequest:
      type: object
      properties:
        transport_url:
          type: string
          nullable: true
        auth_token_ref:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          enum: [active, disabled, deleted]
        tools:
          type: array
          items:
            type: string
          nullable: true
    FederatedTool:
      type: object
      properties:
        name:
          type: string
        server_id:
          type: string
        server_name:
          type: string
    InvokeRemoteToolRequest:
      type: object
      properties:
        arguments:
          type: object
