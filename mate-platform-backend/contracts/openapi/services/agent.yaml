openapi: 3.1.0
info:
  title: Mate Platform agent API
  version: 1.0.0
  x-mate-owner: agent-platform
  description: Canonical contract for Mate Platform agent API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
- url: /
tags:
- name: agent
  description: agent domain operations
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes: [platform.read]
paths:
  /healthz:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
      summary: Liveness probe
      tags:
      - agent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: agentGetHealthz
      description: Liveness probe
      x-mate-owner: agent-platform
      x-mate-permission: agent.get
      x-mate-requirements:
      - FR-AGENT-AGENTGETHEALTHZ
      x-mate-implementation-status: placeholder
  /api/v1/agent/chat:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Agent chat (S1 | S2 | S3 | S4)
      tags:
      - agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '501':
          description: Scenario not implemented
        '500':
          description: Graph execution failure
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: agentPostAgentChat
      description: Agent chat (S1 | S2 | S3 | S4)
      x-mate-owner: agent-platform
      x-mate-permission: agent.post
      x-mate-requirements:
      - FR-AGENT-AGENTPOSTAGENTCHAT
      x-mate-implementation-status: placeholder
  /api/v1/agent/chat/stream:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: SSE streaming chat (S1 / S2 / S3)
      tags:
      - agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: text/event-stream
        '501':
          description: Scenario not implemented
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: agentPostAgentChatStream
      description: SSE streaming chat (S1 / S2 / S3)
      x-mate-owner: agent-platform
      x-mate-permission: agent.post
      x-mate-requirements:
      - FR-AGENT-AGENTPOSTAGENTCHATSTREAM
      x-mate-implementation-status: placeholder
  /api/v1/agent/review:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: S3 human review resume (approve / abort)
      tags:
      - agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanReviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReviewResponse'
        '500':
          description: Post-review execution failure
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: agentPostAgentReview
      description: S3 human review resume (approve / abort)
      x-mate-owner: agent-platform
      x-mate-permission: agent.post
      x-mate-requirements:
      - FR-AGENT-AGENTPOSTAGENTREVIEW
      x-mate-implementation-status: placeholder
  /api/v1/agent/state/{thread_id}:
    parameters:
    - in: path
      name: thread_id
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Read persisted thread state
      tags:
      - agent
      responses:
        '200':
          description: OK
        '404':
          description: thread not found
      operationId: agentGetAgentStateThreadId
      description: Read persisted thread state
      x-mate-owner: agent-platform
      x-mate-permission: agent.get
      x-mate-requirements:
      - FR-AGENT-AGENTGETAGENTSTATETHREADID
      x-mate-implementation-status: placeholder
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Delete persisted thread state
      tags:
      - agent
      responses:
        '200':
          description: OK
        '404':
          description: thread not found
      operationId: agentDeleteAgentStateThreadId
      description: Delete persisted thread state
      x-mate-owner: agent-platform
      x-mate-permission: agent.delete
      x-mate-requirements:
      - FR-AGENT-AGENTDELETEAGENTSTATETHREADID
      x-mate-implementation-status: placeholder
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - service
      - version
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
    ChatRequest:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4096
        thread_id:
          type:
          - string
          - 'null'
        scenario:
          type: string
          enum:
          - S1
          - S2
          - S3
          - S4
          default: S1
    ChatResponse:
      type: object
      required:
      - thread_id
      - scenario
      - answer
      - latency_ms
      properties:
        thread_id:
          type: string
        scenario:
          type: string
        answer:
          type: string
        retrieved_chunks:
          type: array
          items:
            type: object
        tool_calls:
          type: array
          items:
            type: object
        latency_ms:
          type: integer
          minimum: 0
    HumanReviewRequest:
      type: object
      required:
      - thread_id
      - approved
      properties:
        thread_id:
          type: string
        approved:
          type: boolean
        feedback:
          type:
          - string
          - 'null'
    HumanReviewResponse:
      type: object
      required:
      - thread_id
      - status
      properties:
        thread_id:
          type: string
        status:
          type: string
          enum:
          - approved
          - aborted
          - no_pending
        message:
          type:
          - string
          - 'null'
