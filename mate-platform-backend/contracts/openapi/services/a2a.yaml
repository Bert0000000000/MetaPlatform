openapi: 3.1.0
info:
  title: Mate Platform a2a API
  version: 1.0.0
  x-mate-owner: ai-protocols
  description: Canonical contract for Mate Platform a2a API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
- url: /
tags:
- name: a2a
  description: a2a domain operations
security:
- bearerAuth: []
  tenantHeader: []
  oidcScopes:
  - platform.read
paths:
  /api/v1/a2a/agent-cards/search:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.read
      tags:
      - a2a
      summary: /v1/a2a/agent-cards/search
      operationId: a2aGetA2aAgentCardsSearch
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/a2a/agent-cards/search
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
      - FR-A2A-A2AGETA2AAGENTCARDSSEARCH
      x-mate-implementation-status: implemented
  /api/v1/a2a/delegate:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.write
      tags:
      - a2a
      summary: /v1/a2a/delegate (deprecated; use /messages)
      operationId: a2aPostA2aDelegate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target_agent_id
              - message
              properties:
                target_agent_id:
                  type: string
                message:
                  type: string
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - task_id
                - status
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Create a delegation task (deprecated). Superseded by the W3C
        `POST /api/v1/a2a/messages` envelope (GOVERN-12-03).
      deprecated: true
      x-sunset: 2026-12-31
      x-migration-target: /api/v1/a2a/messages
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.post
      x-mate-requirements:
      - FR-A2A-A2APOSTA2ADELEGATE
      x-mate-implementation-status: implemented
  /api/v1/a2a/delegations:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.read
      tags:
      - a2a
      summary: /v1/a2a/delegations
      operationId: a2aGetA2aDelegations
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/a2a/delegations
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
      - FR-A2A-A2AGETA2ADELEGATIONS
      x-mate-implementation-status: implemented
  /api/v1/a2a/health:
    get:
      security: []
      tags:
      - a2a
      summary: /v1/a2a/health (anonymous liveness probe)
      operationId: a2aGetA2aHealth
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Anonymous liveness probe — no tenant guard.
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
      - FR-A2A-A2AGETA2AHEALTH
      x-mate-implementation-status: implemented
  /api/v1/a2a/messages:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.write
      tags:
      - a2a
      summary: /v1/a2a/messages (W3C A2A envelope, GOVERN-12-03)
      operationId: a2aPostA2aMessages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2AMessage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ATask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: >-
        Accept a W3C A2A message and open a delegation task (GOVERN-12-03).
        The envelope is translated into the existing DelegationTask
        model: text parts become the task message, data parts are merged
        into the task context (alongside the W3C correlation ids). The
        response is a W3C Task object rather than the legacy
        `{task_id,status}` shape returned by `/delegate`.
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.post
      x-mate-requirements:
      - FR-A2A-A2APOSTA2AMESSAGES
      x-mate-implementation-status: implemented
  /api/v1/a2a/tasks/{task_id}:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.read
      tags:
      - a2a
      summary: /v1/a2a/tasks/{task_id} (W3C Task status)
      operationId: a2aGetA2aTask
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A2ATask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Get delegation task status (W3C Task schema).
      x-mate-owner: ai-protocols
      x-mate-permission: a2a.get
      x-mate-requirements:
      - FR-A2A-A2AGETA2ATASK
      x-mate-implementation-status: implemented
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: 租户 ID
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: 服务器错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
        traceId:
          type: string
    ApiResponse:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: integer
          enum:
          - 0
        message:
          type: string
        data: {}
        traceId:
          type: string
    PageResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      - pages
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        pages:
          type: integer
    BigDataSource:
      type: object
      required:
      - sourceId
      - name
      - sourceType
      - host
      - port
      - authType
      - status
      properties:
        sourceId:
          type: string
        tenantId:
          type: string
        name:
          type: string
          maxLength: 64
        sourceType:
          type: string
          enum:
          - HIVE
          - HBASE
          - CLICKHOUSE
          - DORIS
          - STARROCKS
          - ICEBERG
          - HUDI
          - DELTA
          - PRESTO
          - TRINO
          - KAFKA
          - PULSAR
          - HDFS
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
        schema:
          type: string
        authType:
          type: string
          enum:
          - NONE
          - USER_PASSWORD
          - KERBERY
          - LDAP
          default: NONE
        sslEnabled:
          type: boolean
          default: false
        poolSize:
          type: integer
          default: 10
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          - ERROR
          - DELETED
    CDCTask:
      type: object
      required:
      - taskId
      - name
      - sourceId
      - syncMode
      - targetType
      - targetName
      - status
      properties:
        taskId:
          type: string
        name:
          type: string
        sourceId:
          type: string
        syncMode:
          type: string
          enum:
          - FULL_INCREMENTAL
          - INCREMENTAL_ONLY
          - SNAPSHOT_ONLY
        targetType:
          type: string
          enum:
          - KAFKA
          - CLICKHOUSE
          - HUDI
          - ICEBERG
        targetName:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - SNAPSHOTTING
          - RUNNING
          - PAUSED
          - FAILED
          - STOPPED
        lagMs:
          type: integer
        totalRecords:
          type: integer
          format: int64
    ETLTask:
      type: object
      required:
      - taskId
      - name
      - mode
      - sourceIds
      - targetType
      - targetTable
      - writeMode
      - status
      properties:
        taskId:
          type: string
        name:
          type: string
        mode:
          type: string
          enum:
          - BATCH_SPARK
          - BATCH_FLINK
          - STREAMING_FLINK
          - STREAMING_SPARK
          - SQL_TRANSFORM
        priority:
          type: string
          enum:
          - LOW
          - NORMAL
          - HIGH
          - URGENT
        sourceIds:
          type: array
          items:
            type: string
        transformDag:
          type: object
        transformSql:
          type: string
        targetType:
          type: string
          enum:
          - HIVE
          - CLICKHOUSE
          - ICEBERG
          - HUDI
          - DELTA
          - DORIS
        targetTable:
          type: string
        writeMode:
          type: string
          enum:
          - OVERWRITE
          - APPEND
          - UPSERT
          - MERGE
        status:
          type: string
          enum:
          - DRAFT
          - READY
          - RUNNING
          - SUCCESS
          - FAILED
          - CANCELLED
          - TIMEOUT
    SchedulerTask:
      type: object
      required:
      - schedulerId
      - name
      - taskType
      - taskId
      - triggerType
      - status
      properties:
        schedulerId:
          type: string
        name:
          type: string
        taskType:
          type: string
          enum:
          - ETL_TASK
          - CDC_TASK
          - QUALITY_CHECK
          - CUSTOM_ACTION
        taskId:
          type: string
        triggerType:
          type: string
          enum:
          - CRON
          - EVENT
          - MANUAL
          - DEPENDENCY
        cron:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - EXPIRED
          - DELETED
    Metric:
      type: object
      required:
      - metricId
      - name
      - code
      - type
      - sourceId
      - sourceTable
      - sourceField
      - aggregation
      - calculationFrequency
      - status
      properties:
        metricId:
          type: string
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum:
          - ATOMIC
          - DERIVED
          - COMPOSITE
          - REALTIME
        sourceId:
          type: string
        sourceTable:
          type: string
        sourceField:
          type: string
        aggregation:
          type: string
          enum:
          - SUM
          - AVG
          - COUNT
          - MAX
          - MIN
          - LAST
        calculationFrequency:
          type: string
          enum:
          - REALTIME
          - MINUTELY
          - HOURLY
          - DAILY
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          - ERROR
    A2APart:
      type: object
      description: One content part of a W3C A2A message.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - text
          - file
          - data
        text:
          type: string
          nullable: true
        data:
          type: object
          additionalProperties: true
          nullable: true
    A2AMessage:
      type: object
      description: W3C A2A message envelope (the `/messages` request body).
      required:
      - messageId
      - role
      - parts
      properties:
        messageId:
          type: string
          minLength: 1
        role:
          type: string
          enum:
          - user
          - agent
        parts:
          type: array
          items:
            $ref: '#/components/schemas/A2APart'
        contextId:
          type: string
          nullable: true
        taskId:
          type: string
          nullable: true
    A2AArtifact:
      type: object
      description: A W3C A2A artifact attached to a Task.
      required:
      - name
      properties:
        name:
          type: string
        mimeType:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/A2APart'
    A2ATask:
      type: object
      description: W3C A2A Task object returned by `/messages` and `/tasks/{task_id}`.
      required:
      - id
      - status
      properties:
        id:
          type: string
        contextId:
          type: string
        status:
          type: object
          required:
          - state
          properties:
            state:
              type: string
              enum:
              - submitted
              - working
              - input-required
              - completed
              - failed
              - canceled
            message:
              $ref: '#/components/schemas/A2AMessage'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/A2AArtifact'
        history:
          type: array
          items:
            $ref: '#/components/schemas/A2AMessage'
