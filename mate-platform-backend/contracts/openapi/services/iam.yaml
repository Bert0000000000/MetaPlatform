components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
        tenantId:
          type: string
          nullable: true
    AuthResponse:
      type: object
      required:
      - accessToken
      - refreshToken
      - userId
      - username
      - user
      properties:
        loginResult:
          type: string
          default: SUCCESS
        userId:
          type: string
        username:
          type: string
        realName:
          type: string
          nullable: true
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
        refreshExpiresIn:
          type: integer
        requirePasswordReset:
          type: boolean
        mfaRequired:
          type: boolean
        user:
          $ref: '#/components/schemas/UserInfo'
        loginAt:
          type: string
          format: date-time
        loginIp:
          type: string
          nullable: true
    UserInfo:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          nullable: true
        realName:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      - LOCKED
    UserCreate:
      type: object
      required:
      - username
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 64
        real_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8
          maxLength: 128
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        is_super_admin:
          type: boolean
          default: false
        role_ids:
          type: array
          items:
            type: integer
    UserUpdate:
      type: object
      properties:
        real_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        is_super_admin:
          type: boolean
          nullable: true
        role_ids:
          type: array
          nullable: true
          items:
            type: integer
    OrgCreate:
      type: object
      required:
      - code
      - name
      properties:
        parent_id:
          type: integer
          nullable: true
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
          - DEPARTMENT
          - COMPANY
          - TEAM
          - VIRTUAL
          default: DEPARTMENT
        leader_id:
          type: integer
          nullable: true
        sort_order:
          type: integer
          default: 0
        description:
          type: string
          nullable: true
          maxLength: 512
    OrgUpdate:
      type: object
      properties:
        parent_id:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
        type:
          type: string
          enum:
          - DEPARTMENT
          - COMPANY
          - TEAM
          - VIRTUAL
          nullable: true
        leader_id:
          type: integer
          nullable: true
        sort_order:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
    PositionCreate:
      type: object
      required:
      - org_id
      - code
      - name
      properties:
        org_id:
          type: integer
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        level:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    PositionUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
    TransferPayload:
      type: object
      required:
      - user_id
      - target_org_id
      properties:
        user_id:
          type: integer
        target_org_id:
          type: integer
        target_position_id:
          type: integer
          nullable: true
        reports_to:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true
    RoleCreate:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          nullable: true
        data_scope:
          type: string
          enum:
          - ALL
          - DEPT
          - DEPT_AND_SUB
          - SELF
          - CUSTOM
          default: SELF
        permission_ids:
          type: array
          items:
            type: integer
    RoleUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          maxLength: 8192
        data_scope:
          type: string
          enum:
          - ALL
          - DEPT
          - DEPT_AND_SUB
          - SELF
          - CUSTOM
          nullable: true
        permission_ids:
          type: array
          nullable: true
          items:
            type: integer
    AssignPayload:
      type: object
      required:
      - type
      - target_id
      properties:
        type:
          type: string
          enum:
          - user
          - role
        target_id:
          type: integer
        permission_ids:
          type: array
          items:
            type: integer
        role_ids:
          type: array
          nullable: true
          description: required when type=user
          items:
            type: integer
    AuditAction:
      type: string
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - ENABLE
      - DISABLE
      - RESET_PASSWORD
      - LOGIN
      - LOGOUT
      - IMPORT
      - EXPORT
      - CONFIG_CHANGE
    ConfigCategory:
      type: string
      enum:
      - GENERAL
      - SECURITY
      - INTEGRATION
      - NOTIFICATION
      - BILLING
      - AI
    ConfigUpdate:
      type: object
      required:
      - value
      properties:
        value: {}
        note:
          type: string
          nullable: true
          maxLength: 512
    SettingsUpdate:
      type: object
      properties:
        userId:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        dateFormat:
          type: string
          nullable: true
        defaultPage:
          type: string
          nullable: true
        theme:
          type: string
          nullable: true
        layout:
          type: array
          nullable: true
          items:
            type: string
    NotificationSettingsUpdate:
      type: object
      properties:
        userId:
          type: string
          nullable: true
        approval:
          type: boolean
          nullable: true
        task:
          type: boolean
          nullable: true
        system:
          type: boolean
          nullable: true
        mention:
          type: boolean
          nullable: true
        alert:
          type: boolean
          nullable: true
        email:
          type: boolean
          nullable: true
        push:
          type: boolean
          nullable: true
    ApiKeyCreate:
      type: object
      required:
      - name
      properties:
        tenantId:
          type: string
          default: tenant-default
        name:
          type: string
        userId:
          type: string
          nullable: true
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
    DownloadRequest:
      type: object
      required:
      - format
      properties:
        format:
          type: string
    TodoActionRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - approve
          - reject
        comment:
          type: string
          nullable: true
    AnomalyRuleCreate:
      type: object
      required:
      - name
      - metricType
      - conditionOperator
      - threshold
      - timeWindowSeconds
      - aggregationFunction
      - severity
      properties:
        name:
          type: string
        metricType:
          type: string
        conditionOperator:
          type: string
        threshold:
          type: number
        timeWindowSeconds:
          type: integer
        aggregationFunction:
          type: string
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        enabled:
          type: boolean
          default: true
