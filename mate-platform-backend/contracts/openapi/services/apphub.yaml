components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: 租户 ID
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: 服务器错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AppProposalContextRequest:
      properties:
        page_id:
          type: string
          title: Page Id
        version_id:
          type: string
          title: Version Id
        action_rid:
          type: string
          title: Action Rid
        target_iid:
          type: string
          title: Target Iid
      type: object
      required:
      - page_id
      - version_id
      - action_rid
      - target_iid
      title: AppProposalContextRequest
    AppHubVerifiedProposalContext:
      type: object
      properties:
        app_id:
          type: string
        page_id:
          type: string
        app_version_id:
          type: string
        app_version:
          type: string
      required:
      - app_id
      - page_id
      - app_version_id
      - app_version
    AppHubReleaseTask:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        assignee:
          type: string
        status:
          type: string
        createTime:
          type: string
        comment:
          type: string
        completedAt:
          type: string
      required:
      - id
      - name
      - assignee
      - status
      - createTime
    AppHubReleaseLog:
      type: object
      properties:
        logId:
          type: string
        releaseId:
          type: string
        action:
          type: string
        operator:
          type: string
        remark:
          type: string
        createdAt:
          type: string
      required:
      - logId
      - releaseId
      - action
      - operator
      - remark
      - createdAt
    AppHubActionReceipt:
      type: object
      properties:
        audit_id:
          type: string
        tenant_id:
          type: string
        proposal_id:
          type: string
        action_rid:
          type: string
        target_iid:
          type: string
        actor_id:
          type: string
        result:
          type: object
          additionalProperties: true
        created_at:
          type: string
      required:
      - audit_id
      - tenant_id
      - proposal_id
      - action_rid
      - target_iid
      - actor_id
      - result
      - created_at
    AppHubPublicationCheck:
      type: object
      properties:
        app_id:
          type: string
        draft_version:
          type: string
        revision:
          type: integer
        checked_at:
          type: string
        can_publish:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              key:
                enum:
                - bindings
                - reference_versions
                - access
                - components
                - action_policy
                - runtime
              status:
                enum:
                - pass
                - fail
                - unknown
              message:
                type: string
              next_step:
                type: string
            required:
            - key
            - status
            - message
            - next_step
      required:
      - app_id
      - draft_version
      - revision
      - checked_at
      - can_publish
      - checks
    AppHubModule:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        code:
          type: string
        app_code:
          type: string
        description:
          type: string
        entry_path:
          type: string
      required:
      - id
      - tenant_id
      - name
      - code
      - app_code
      - description
      - entry_path
    AppHubGroup:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        code:
          type: string
        icon:
          type: string
        sort_order:
          type: integer
      required:
      - id
      - tenant_id
      - name
      - code
      - icon
      - sort_order
    AppHubPage:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        code:
          type: string
        module_code:
          type: string
        layout:
          type: string
        schema_version:
          type: integer
        definition:
          type: object
          additionalProperties: true
      required:
      - id
      - tenant_id
      - name
      - code
      - module_code
      - layout
      - schema_version
      - definition
    AppHubError:
      type: object
      properties:
        detail: {}
      required:
      - detail
    AppHubApplication:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        code:
          type: string
        category:
          type: string
        description:
          type: string
        version:
          type: string
        owner:
          type: string
        business_domain:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - DESIGNING
          - PUBLISHED
          - OFFLINE
        created_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
        published_version_id:
          type:
          - string
          - 'null'
        module_count:
          type: integer
        revision:
          type: integer
          readOnly: true
          description: Internal store-owned compare-and-swap revision; not accepted in mutation input.
        published_version:
          type:
          - string
          - 'null'
          description: Version of the exact published snapshot; version is editable draft metadata.
      required:
      - id
      - tenant_id
      - name
      - code
      - status
      - revision
    AppHubOrderBinding:
      type: object
      properties:
        object_type:
          type: string
        model_checksum:
          type: string
        customer_type:
          type: string
        customer_checksum:
          type: string
        link_type:
          type: string
        action_rid:
          type: string
        action_checksum:
          type: string
        link_checksum:
          type: string
        fields:
          type: array
          items:
            type: string
        object_set:
          type: object
          properties:
            class_rid:
              type: string
            filter_expr:
              type: string
            paging_limit:
              type: integer
              minimum: 1
              maximum: 1000
            paging_offset:
              type: integer
        field_metadata:
          type: array
          items:
            type: object
            additionalProperties: true
        action_parameters:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - object_type
      - model_checksum
      - customer_type
      - customer_checksum
      - link_type
      - action_rid
      - fields
      - object_set
      description: Exact same-tenant active published models/checksums, actual fields, relation and registered Action.on.
        Fingerprints are captured by server and checked on publication/runtime.
    AppHubPageDefinition:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        layout:
          type: string
        widgets:
          type: array
          items:
            type: object
            additionalProperties: true
        scripts:
          type: object
          additionalProperties: true
        binding:
          $ref: '#/components/schemas/AppHubOrderBinding'
        application_metadata_updated:
          type: boolean
      required:
      - name
      - widgets
      description: Draft definition. Save may return application_metadata_updated=false after page success and a concurrent
        app metadata conflict; page remains saved.
    AppHubVersion:
      type: object
      properties:
        versionId:
          type: string
        appId:
          type: string
        version:
          type: string
        status:
          type: string
        createdAt:
          type: string
        publishedAt:
          type: string
        changeLog:
          type: string
        modules:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - versionId
      - appId
      - version
      - status
      - createdAt
      - modules
      description: Server-captured immutable page/binding snapshot; publication status may advance. Client supplied
        module snapshots are ignored.
    AppHubRuntimeData:
      type: object
      properties:
        orders:
          type: array
          items:
            type: object
            additionalProperties: true
        customers:
          type: array
          items:
            type: object
            additionalProperties: true
        links:
          type: array
          items:
            type: object
            additionalProperties: true
        binding:
          $ref: '#/components/schemas/AppHubOrderBinding'
        version:
          type: string
      required:
      - orders
      - customers
      - links
      - binding
      - version
    AppHubRuntime:
      type: object
      properties:
        app_id:
          type: string
        version:
          type: string
        modules:
          type: array
          items:
            type: object
            additionalProperties: true
        render_tree:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
      - app_id
      - version
      - modules
      - render_tree
    AppHubPublication:
      type: object
      properties:
        app_id:
          type: string
        status:
          type: string
        version:
          type: string
        version_id:
          type: string
      required:
      - app_id
      - status
      - version
      - version_id
    AppHubVersionCreate:
      type: object
      properties:
        version:
          type: string
        changeLog:
          type: string
    AppHubReleaseCreate:
      type: object
      properties:
        version:
          type: string
        releaseNotes:
          type: string
        strategy:
          type: string
          enum:
          - FULL
          default: FULL
        techLeadId:
          type: string
        opsOwnerId:
          type: string
      description: Full releases only. Empty approval assignees default to authenticated actor. Grayscale is explicitly
        rejected.
    AppHubRelease:
      type: object
      properties:
        releaseId:
          type: string
        appId:
          type: string
        version:
          type: string
        versionId:
          type: string
        releaseNotes:
          type: string
        strategy:
          type: string
        status:
          type: string
        approvalStatus:
          type: string
        processInstanceId:
          type: string
        createdAt:
          type: string
        publishedAt:
          type: string
        createdBy:
          type: string
        basePublishedVersionId:
          type:
          - string
          - 'null'
        grayPercent:
          type: integer
        grayUsers:
          type: array
          items:
            type: string
        grayDepts:
          type: array
          items:
            type: string
      required:
      - releaseId
      - appId
      - versionId
      - status
      - processInstanceId
    AppHubApproval:
      type: object
      properties:
        approved:
          type: boolean
        comment:
          type: string
      required:
      - approved
    AppHubShortlinkCreate:
      type: object
      properties:
        app_id:
          type: string
        expires_at:
          type:
          - string
          - 'null'
      required:
      - app_id
      description: Current PUBLISHED binding required; supplied role never grants runtime authority.
    AppHubShortlink:
      type: object
      properties:
        code:
          type: string
        app_id:
          type: string
        created_at:
          type: string
      required:
      - code
      - app_id
      - created_at
    AppHubBindingUsage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              app_id:
                type: string
              app_name:
                type: string
              page_id:
                type: string
              status:
                type: string
              version_id:
                type:
                - string
                - 'null'
              model_version:
                type: string
              model_checksum:
                type:
                - string
                - 'null'
              action_rid:
                type: string
            required:
            - app_id
            - app_name
            - page_id
            - status
            - version_id
            - model_version
        total:
          type: integer
      required:
      - items
      - total
    AppHubRuntimeExecute:
      type: object
      properties:
        action_id:
          type: string
        action_type:
          type: string
        page_id:
          type: string
        target:
          type: string
        payload:
          type: object
          additionalProperties: true
      required:
      - action_type
      description: ontology_propose resolves Action exclusively from published page binding and restricts target_iid
        to its actual ObjectSet. No confirmation or execution occurs here.
    AppHubRuntimeResult:
      type: object
      properties:
        action_id:
          type: string
        success:
          type: boolean
        data: {}
        error:
          type:
          - string
          - 'null'
      required:
      - action_id
      - success
      - data
      - error
    AppRegisterRequest:
      properties:
        name:
          type: string
          maxLength: 256
          minLength: 1
          title: Name
        code:
          type: string
          maxLength: 64
          minLength: 1
          title: Code
        category:
          type: string
          maxLength: 64
          minLength: 1
          title: Category
        description:
          type: string
          maxLength: 2048
          title: Description
          default: ''
        version:
          type: string
          title: Version
          default: 1.0.0
        owner:
          type: string
          title: Owner
          default: platform-team
        tags:
          items:
            type: string
          type: array
          title: Tags
        business_domain:
          type: string
          maxLength: 64
          title: Business Domain
          default: ''
      type: object
      required:
      - name
      - code
      - category
      title: AppRegisterRequest
      description: Body schema for POST /apps.
    ModuleCreateRequest:
      properties:
        name:
          type: string
          maxLength: 256
          minLength: 1
          title: Name
        code:
          type: string
          maxLength: 64
          minLength: 1
          title: Code
        app_code:
          type: string
          maxLength: 64
          minLength: 1
          title: App Code
        description:
          type: string
          maxLength: 2048
          title: Description
          default: ''
        entry_path:
          type: string
          maxLength: 512
          title: Entry Path
          default: ''
      type: object
      required:
      - name
      - code
      - app_code
      title: ModuleCreateRequest
    PageCreateRequest:
      properties:
        name:
          type: string
          maxLength: 256
          minLength: 1
          title: Name
        code:
          type: string
          maxLength: 64
          minLength: 1
          title: Code
        module_code:
          type: string
          maxLength: 64
          minLength: 1
          title: Module Code
        layout:
          type: string
          maxLength: 64
          title: Layout
          default: single
        schema_version:
          type: integer
          minimum: 1.0
          title: Schema Version
          default: 1
      type: object
      required:
      - name
      - code
      - module_code
      title: PageCreateRequest
    AppUpdateRequest:
      properties:
        status:
          anyOf:
          - type: string
            enum:
            - OFFLINE
            - DESIGNING
          - type: 'null'
          title: Status
        name:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
          title: Description
        version:
          anyOf:
          - type: string
          - type: 'null'
