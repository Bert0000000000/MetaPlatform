openapi: 3.1.0
info:
  title: Mate Platform apphub API
  version: 1.0.0
  x-mate-owner: application-platform
  description: Canonical contract for Mate Platform apphub API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
  - url: /
tags:
  - name: apphub
    description: apphub domain operations
  - name: runtime
    description: app runtime lifecycle operations
  - name: publish
    description: app publish operations
  - name: shortlink
    description: shortlink operations
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes:
      - platform.read
paths:
  /api/v1/apphub/apps/{app_id}/runtime/proposal-context:
    post:
      tags:
      - apphub
      summary: Validate Proposal Context
      description: Read-only POST. Verifies caller tenant/read access, exact app ID, historical PUBLISHED snapshot,
        page, registered Action and actual ObjectSet target. No proposal creation or action execution. Published application
        required; older published snapshots remain valid independently of current pointer.
      operationId: apphubValidateProposalContext
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppProposalContextRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubVerifiedProposalContext'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
          description: Ontology dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
      security:
      - bearerAuth: []
        oidcScopes:
        - platform.read
      x-mate-owner: application-platform
      x-mate-permission: apphub.read
      x-mate-requirements:
      - MP11-APP-01
      x-mate-implementation-status: implemented
  /api/v1/apphub/apps/{app_id}/runtime/history:
    get:
      tags:
      - apphub
      summary: Get Order Runtime History
      operationId: apphubGetOrderRuntimeHistory
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      - name: page_id
        in: query
        required: true
        schema:
          type: string
          title: Page Id
      - name: version_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppHubActionReceipt'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
          description: Ontology dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
      security:
      - bearerAuth: []
        oidcScopes:
        - platform.read
      x-mate-owner: application-platform
      x-mate-permission: apphub.read
      x-mate-requirements:
      - MP11-APP-01
      x-mate-implementation-status: implemented
      description: Verified tenant and actual app/page authorization. Exact published snapshot history independent
        of live ObjectSet membership. Defaults to current published version; explicit version_id must belong to this
        app and contain this page. Legacy receipts without complete provenance are excluded.
  /api/v1/apphub/apps/{app_id}/publication-check:
    get:
      tags:
      - apphub
      summary: Check Publication
      operationId: apphubCheckPublication
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubPublicationCheck'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
          description: Ontology dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
      security:
      - bearerAuth: []
        oidcScopes:
        - platform.read
      x-mate-owner: application-platform
      x-mate-permission: apphub.read
      x-mate-requirements:
      - MP11-APP-01
      x-mate-implementation-status: implemented
      description: Verified tenant and actual app/page authorization. Real saved draft checks; unknown dependencies
        prevent publication. Final publish revalidates.
  /api/v1/apphub/apps/{app_id}:
    get:
      tags:
      - apphub
      summary: Get App Detail
      description: Get a single application detail by id or code. Verified tenant comes exclusively from authentication.
        Order bindings additionally require platform.read and forward the verified caller Bearer. Concurrent stale
        app changes fail409; no automatic retry overwrites newer publication/history.
      operationId: apphubGetAppDetail
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: App Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubApplication'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
          description: Ontology dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
      security:
      - bearerAuth: []
      x-mate-owner: application-platform
      x-mate-permission: apphub.read
      x-mate-requirements:
      - MP11-APP-01
      - MP11-ONT-03
      - MP11-UX-01
      x-mate-implementation-status: implemented
    patch:
      tags:
      - apphub
      summary: Update App
      description: 'Update an application''s metadata.


        Version bumps must follow semver. The new version must differ

        from the current one. Verified tenant comes exclusively from authentication. Order bindings additionally require
        platform.read and forward the verified caller Bearer. Concurrent stale app changes fail409; no automatic retry
        overwrites newer publication/history.'
      operationId: apphubPatchApphubAppsCode
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubApplication'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
          description: Ontology dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
      security:
      - bearerAuth: []
        oidcScopes:
        - platform.write
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - MP11-APP-01
      - MP11-ONT-03
      - MP11-UX-01
      x-mate-implementation-status: implemented
    delete:
      tags:
      - apphub
      summary: Delete App Endpoint
      description: Delete an application by code. Verified tenant comes exclusively from authentication. Order bindings
        additionally require platform.read and forward the verified caller Bearer. Concurrent stale app changes fail409;
        no automatic retry overwrites newer publication/history.
      operationId: apphubDeleteApphubAppsCode
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
          description: Ontology dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
      security:
      - bearerAuth: []
        oidcScopes:
        - platform.write
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - MP11-APP-01
      - MP11-ONT-03
      - MP11-UX-01
      x-mate-implementation-status: implemented
  /api/v1/apphub/apps:
    get:
      tags:
      - apphub
      summary: List Registered Apps
      operationId: apphubGetApphubApps
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: name/code 模糊匹配
          title: Keyword
        description: name/code 模糊匹配
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: category 精确过滤
          title: Category
        description: category 精确过滤
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppHubApplication'
                  total:
                    type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
          description: Ontology dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
      security:
      - bearerAuth: []
      x-mate-owner: application-platform
      x-mate-permission: apphub.read
      x-mate-requirements:
      - MP11-APP-01
      - MP11-ONT-03
      - MP11-UX-01
      x-mate-implementation-status: implemented
      description: ' Verified tenant comes exclusively from authentication. Order bindings additionally require platform.read
        and forward the verified caller Bearer. Concurrent stale app changes fail409; no automatic retry overwrites
        newer publication/history.'
    post:
      tags:
      - apphub
      summary: Register App
      description: "Register a new application.\n\nValidation rules:\n  - ``code`` must be unique within the tenant.\n\
        \  - ``category`` must be one of the known categories (knowledge /\n    platform / data) and match an existing\
        \ group.\n  - ``version`` must be a valid semver (MAJOR.MINOR.PATCH). Verified tenant comes exclusively from\
        \ authentication. Order bindings additionally require platform.read and forward the verified caller Bearer.\
        \ Concurrent stale app changes fail409; no automatic retry overwrites newer publication/history."
      operationId: apphubPostApphubApps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppRegisterRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubApplication'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
          description: Ontology dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
      security:
      - bearerAuth: []
        oidcScopes:
        - platform.write
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - MP11-APP-01
      - MP11-ONT-03
      - MP11-UX-01
      x-mate-implementation-status: implemented
