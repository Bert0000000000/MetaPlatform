openapi: 3.1.0
info:
  title: Mate Platform apphub API
  version: 1.0.0
  x-mate-owner: application-platform
  description: Canonical contract for Mate Platform apphub API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
- url: /
tags:
- name: apphub
  description: apphub domain operations
- name: runtime
  description: app runtime lifecycle operations
- name: publish
  description: app publish operations
- name: shortlink
  description: shortlink operations
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes: [platform.read]
paths:
  /api/v1/apphub/apps:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      tags:
      - apphub
      summary: /v1/apphub/apps
      operationId: apphubGetApphubApps
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/apphub/apps
      x-mate-owner: application-platform
      x-mate-permission: apphub.get
      x-mate-requirements:
      - FR-APPHUB-APPHUBGETAPPHUBAPPS
      x-mate-implementation-status: implemented
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - apphub
      summary: Create application
      operationId: apphubPostApphubApps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ServerError'
        '422':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Register a new application.
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - FR-APPHUB-APPHUBPOSTAPPHUBAPPS
      x-mate-implementation-status: implemented
  /api/v1/apphub/apps/groups:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      tags:
      - apphub
      summary: /v1/apphub/apps/groups
      operationId: apphubGetApphubAppsGroups
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/apphub/apps/groups
      x-mate-owner: application-platform
      x-mate-permission: apphub.get
      x-mate-requirements:
      - FR-APPHUB-APPHUBGETAPPHUBAPPSGROUPS
      x-mate-implementation-status: implemented
  /api/v1/apphub/modules:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      tags:
      - apphub
      summary: /v1/apphub/modules
      operationId: apphubGetApphubModules
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/apphub/modules
      x-mate-owner: application-platform
      x-mate-permission: apphub.get
      x-mate-requirements:
      - FR-APPHUB-APPHUBGETAPPHUBMODULES
      x-mate-implementation-status: implemented
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - apphub
      summary: Create business module
      operationId: apphubPostApphubModules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ServerError'
        '422':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Create a new business module.
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - FR-APPHUB-APPHUBPOSTAPPHUBMODULES
      x-mate-implementation-status: implemented
  /api/v1/apphub/pages:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      tags:
      - apphub
      summary: /v1/apphub/pages
      operationId: apphubGetApphubPages
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/apphub/pages
      x-mate-owner: application-platform
      x-mate-permission: apphub.get
      x-mate-requirements:
      - FR-APPHUB-APPHUBGETAPPHUBPAGES
      x-mate-implementation-status: implemented
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - apphub
      summary: Create page template
      operationId: apphubPostApphubPages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Create a new page template.
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - FR-APPHUB-APPHUBPOSTAPPHUBPAGES
      x-mate-implementation-status: implemented
  /api/v1/apphub/templates:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      tags:
      - apphub
      summary: /v1/apphub/templates
      operationId: apphubGetApphubTemplates
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: /v1/apphub/templates
      x-mate-owner: application-platform
      x-mate-permission: apphub.get
      x-mate-requirements:
      - FR-APPHUB-APPHUBGETAPPHUBTEMPLATES
      x-mate-implementation-status: implemented
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - apphub
      summary: Create workflow / form / approval template
      operationId: apphubPostApphubTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ServerError'
        '422':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Create a new workflow / form / approval template.
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - FR-APPHUB-APPHUBPOSTAPPHUBTEMPLATES
      x-mate-implementation-status: implemented
  /api/v1/apphub/apps/{code}:
    patch:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - apphub
      summary: Update application metadata
      operationId: apphubPatchApphubAppsCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ServerError'
        '422':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Update an application's metadata (version bumps follow semver).
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - FR-APPHUB-APPHUBPATCHAPPHUBAPPSCODE
      x-mate-implementation-status: implemented
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - apphub
      summary: Delete application
      operationId: apphubDeleteApphubAppsCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Delete an application by code.
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-requirements:
      - FR-APPHUB-APPHUBDELETEAPPHUBAPPSCODE
      x-mate-implementation-status: implemented
  /api/v1/apphub/groups:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - apphub
      summary: Create application group
      operationId: apphubPostApphubGroups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Create a new application group.
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-implementation-status: implemented
  /api/v1/apphub/groups/{code}:
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - apphub
      summary: Delete application group
      operationId: apphubDeleteApphubGroupsCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Delete a group (blocked if apps reference its category).
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-implementation-status: implemented
  /api/v1/apphub/apps/{appId}/runtime:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      tags:
      - runtime
      summary: Get app runtime status
      operationId: apphubGetAppRuntime
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Get the runtime status of an application.
      x-mate-owner: application-platform
      x-mate-permission: runtime.read
      x-mate-implementation-status: implemented
  /api/v1/apphub/apps/{appId}/runtime/execute:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - runtime
      summary: Execute app runtime action
      operationId: apphubPostAppRuntimeExecute
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Execute a runtime action for an application.
      x-mate-owner: application-platform
      x-mate-permission: runtime.execute
      x-mate-implementation-status: implemented
  /api/v1/apphub/apps/{appId}/publish:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - publish
      summary: Publish application version
      operationId: apphubPostAppPublish
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Publish a new version of an application.
      x-mate-owner: application-platform
      x-mate-permission: apphub.write
      x-mate-implementation-status: implemented
  /api/v1/apphub/shortlinks:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      tags:
      - shortlink
      summary: List shortlinks
      operationId: apphubListShortlinks
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      description: List shortlinks for the current tenant.
      x-mate-owner: application-platform
      x-mate-permission: shortlink.read
      x-mate-implementation-status: implemented
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      tags:
      - shortlink
      summary: Create shortlink
      operationId: apphubPostShortlink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResponse'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Create a new shortlink for an application.
      x-mate-owner: application-platform
      x-mate-permission: shortlink.write
      x-mate-implementation-status: implemented
  /api/v1/apphub/shortlinks/{code}:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      tags:
      - shortlink
      summary: Resolve shortlink
      operationId: apphubGetShortlink
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Resolve a shortlink by code.
      x-mate-owner: application-platform
      x-mate-permission: shortlink.read
      x-mate-implementation-status: implemented
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: 租户 ID
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: 服务器错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
        traceId:
          type: string
    ApiResponse:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: integer
          enum:
          - 0
        message:
          type: string
        data: {}
        traceId:
          type: string
    PageResponse:
      type: object
      required:
      - items
      - total
      - page
      - size
      - pages
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
        pages:
          type: integer
    BigDataSource:
      type: object
      required:
      - sourceId
      - name
      - sourceType
      - host
      - port
      - authType
      - status
      properties:
        sourceId:
          type: string
        tenantId:
          type: string
        name:
          type: string
          maxLength: 64
        sourceType:
          type: string
          enum:
          - HIVE
          - HBASE
          - CLICKHOUSE
          - DORIS
          - STARROCKS
          - ICEBERG
          - HUDI
          - DELTA
          - PRESTO
          - TRINO
          - KAFKA
          - PULSAR
          - HDFS
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
        schema:
          type: string
        authType:
          type: string
          enum:
          - NONE
          - USER_PASSWORD
          - KERBERY
          - LDAP
          default: NONE
        sslEnabled:
          type: boolean
          default: false
        poolSize:
          type: integer
          default: 10
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
          - ERROR
          - DELETED
    CDCTask:
      type: object
      required:
      - taskId
      - name
      - sourceId
      - syncMode
      - targetType
      - targetName
      - status
      properties:
        taskId:
          type: string
        name:
          type: string
        sourceId:
          type: string
        syncMode:
          type: string
          enum:
          - FULL_INCREMENTAL
          - INCREMENTAL_ONLY
          - SNAPSHOT_ONLY
        targetType:
          type: string
          enum:
          - KAFKA
          - CLICKHOUSE
          - HUDI
          - ICEBERG
        targetName:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - SNAPSHOTTING
          - RUNNING
          - PAUSED
          - FAILED
          - STOPPED
        lagMs:
          type: integer
        totalRecords:
          type: integer
          format: int64
    ETLTask:
      type: object
      required:
      - taskId
      - name
      - mode
      - sourceIds
      - targetType
      - targetTable
      - writeMode
      - status
      properties:
        taskId:
          type: string
