  /api/v1/apphub/modules:
    get:
      tags:
      - apphub
      summary: List Business Modules
      operationId: apphubGetApphubModules
      parameters:
      - name: app_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 所属 app 编码
          title: App Code
        description: 所属 app 编码
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppHubModule'
                  total:
                    type: integer
                required:
