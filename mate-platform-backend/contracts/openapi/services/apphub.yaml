              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Unpublished/offline/drifted version, stale revision or lifecycle conflict
          content:
            application/json:
              schema:
