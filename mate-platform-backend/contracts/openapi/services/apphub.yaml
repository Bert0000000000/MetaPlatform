      x-mate-requirements:
      - MP11-APP-01
      - MP11-ONT-03
      - MP11-UX-01
      x-mate-implementation-status: implemented
      description: ' Verified tenant comes exclusively from authentication. Order bindings additionally require platform.read
        and forward the verified caller Bearer. Concurrent stale app changes fail409; no automatic retry overwrites
        newer publication/history.'
    post:
      tags:
      - apphub
      summary: Create Module
      description: 'Create a new business module.


        The ``app_code`` must reference an existing registered app. Verified tenant comes exclusively from authentication.
        Order bindings additionally require platform.read and forward the verified caller Bearer. Concurrent stale
        app changes fail409; no automatic retry overwrites newer publication/history.'
      operationId: apphubPostApphubModules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleCreateRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubModule'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '403':
          description: Verified tenant/scope/human identity denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '404':
          description: Artifact not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '409':
          description: Existing same-tenant code or concurrent creation rejected; no overwrite. IDs are tenant-scoped
            and code is separate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '422':
          description: Invalid request or unresolved dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppHubError'
        '503':
