openapi: 3.1.0
info:
  title: Mate Platform ont API
  version: 1.0.0
  x-mate-owner: ontology-platform
  description: Canonical contract for Mate Platform ont API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
- url: /
tags:
- name: ont
  description: ont domain operations
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes: [platform.read]
paths:
  /healthz:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
      summary: Liveness probe
      tags:
      - ont
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontGetHealthz
      description: Liveness probe
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETHEALTHZ
      x-mate-implementation-status: implemented
  /api/v1/ont/ontologies:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create ontology
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OntologyCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
        '409':
          description: Ontology already exists
      operationId: ontPostOntOntologies
      description: Create ontology
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTONTOLOGIES
      x-mate-implementation-status: implemented
  /api/v1/ont/ontologies/{ontology_id}:
    parameters:
    - in: path
      name: ontology_id
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Read ontology
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
        '404':
          description: not found
      operationId: ontGetOntOntologiesOntologyId
      description: Read ontology
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTONTOLOGIESONTOLOGYID
      x-mate-implementation-status: implemented
      parameters:
      - name: ontology_id
        in: path
        required: true
        schema:
          type: string
  /api/v1/ont/classes:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create class
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassResponse'
        '409':
          description: Class already exists
      operationId: ontPostOntClasses
      description: Create class
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTCLASSES
      x-mate-implementation-status: implemented
  /api/v1/ont/classes/{class_id}:
    parameters:
    - in: path
      name: class_id
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Read class
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassResponse'
        '404':
          description: not found
      operationId: ontGetOntClassesClassId
      description: Read class
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTCLASSESCLASSID
      x-mate-implementation-status: implemented
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
  /api/v1/ont/instances:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: List instances (optional class_id filter)
      tags:
      - ont
      parameters:
      - in: query
        name: class_id
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontGetOntInstances
      description: List instances (optional class_id filter)
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTINSTANCES
      x-mate-implementation-status: placeholder
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create instance
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontPostOntInstances
      description: Create instance
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTINSTANCES
      x-mate-implementation-status: placeholder
  /api/v1/ont/instances/{iid}:
    parameters:
    - in: path
      name: iid
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Read instance
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: not found
      operationId: ontGetOntInstancesIid
      description: Read instance
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTINSTANCESIID
      x-mate-implementation-status: placeholder
      parameters:
      - name: iid
        in: path
        required: true
        schema:
          type: string
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Delete instance
      tags:
      - ont
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontDeleteOntInstancesIid
      description: Delete instance
      x-mate-owner: ontology-platform
      x-mate-permission: ont.delete
      x-mate-requirements:
      - FR-ONT-ONTDELETEONTINSTANCESIID
      x-mate-implementation-status: placeholder
      parameters:
      - name: iid
        in: path
        required: true
        schema:
          type: string
  /api/v1/ont/instances/relations:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: List relations
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelationResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontGetOntInstancesRelations
      description: List relations
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTINSTANCESRELATIONS
      x-mate-implementation-status: placeholder
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create relation
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationResponse'
        '400':
          description: Bad payload
      operationId: ontPostOntInstancesRelations
      description: Create relation
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTINSTANCESRELATIONS
      x-mate-implementation-status: placeholder
  /api/v1/ont/sparql:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: SPARQL -> Cypher -> execute
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SparqlRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparqlResponse'
        '400':
          description: SPARQL parse / transpile failure
      operationId: ontPostOntSparql
      description: SPARQL -> Cypher -> execute
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTSPARQL
      x-mate-implementation-status: placeholder
  /api/v1/ont/explain:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: SPARQL EXPLAIN (parse + transpile only)
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cypher:
                    type: string
                  plan:
                    type: string
                  estimated_rows:
                    type: integer
                  variables:
                    type: array
                    items:
                      type: string
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontPostOntExplain
      description: SPARQL EXPLAIN (parse + transpile only)
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTEXPLAIN
      x-mate-implementation-status: implemented
  /api/v1/ont/federation/query:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Cross-ontology federation query
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationQueryResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
        '500':
          description: Internal federation error
      operationId: ontPostFederationQuery
      description: Execute a federated SPARQL query across multiple ontologies and merge results
      x-mate-owner: ontology-platform
      x-mate-permission: ont.query
      x-mate-required-tenant: true
      x-mate-requirements:
      - FR-ONT-ONTPOSTFEDERATIONQUERY
      x-mate-implementation-status: implemented
  /api/v1/ont/federation/mappings:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create cross-ontology mapping
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMappingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontPostFederationMappings
      description: Register a class/property mapping between two ontologies
      x-mate-owner: ontology-platform
      x-mate-permission: ont.write
      x-mate-required-tenant: true
      x-mate-requirements:
      - FR-ONT-ONTPOSTFEDERATIONMAPPINGS
      x-mate-implementation-status: implemented
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: List cross-ontology mappings
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MappingResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontGetFederationMappings
      description: List all registered cross-ontology mappings for the current tenant
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-required-tenant: true
      x-mate-requirements:
      - FR-ONT-ONTGETFEDERATIONMAPPINGS
      x-mate-implementation-status: implemented
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  schemas:
    OntologyCreate:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        namespace:
          type: string
          default: default
        description:
          type: string
    Ontology:
      type: object
      required:
      - id
      - namespace
      - description
      properties:
        id:
          type: string
        namespace:
          type: string
        description:
          type: string
    ClassCreate:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        namespace:
          type: string
          default: default
        label:
          type: string
        parent:
          type:
          - string
          - 'null'
        properties:
          type: array
          items:
            type: object
    ClassResponse:
      type: object
      required:
      - id
      - namespace
      - label
      properties:
        id:
          type: string
        namespace:
          type: string
        label:
          type: string
        parent:
          type:
          - string
          - 'null'
        properties:
          type: array
          items:
            type: object
    InstanceCreate:
      type: object
      required:
      - class_id
      properties:
        class_id:
          type: string
        properties:
          type: object
        namespace:
          type: string
          default: default
    InstanceResponse:
      type: object
      required:
      - id
      - class_id
      - namespace
      properties:
        id:
          type: string
        class_id:
          type: string
        namespace:
          type: string
        properties:
          type: object
    RelationCreate:
      type: object
      required:
      - type
      - src_id
      - dst_id
      properties:
        type:
          type: string
        src_id:
          type: string
        dst_id:
          type: string
        properties:
          type: object
    RelationResponse:
      type: object
      required:
      - id
      - type
      - src_id
      - dst_id
      properties:
        id:
          type: string
        type:
          type: string
        src_id:
          type: string
        dst_id:
          type: string
        properties:
          type: object
    SparqlRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        format:
          type: string
          default: json
          enum:
          - json
          - xml
          - csv
    SparqlResponse:
      type: object
      required:
      - cypher
      properties:
        cypher:
          type: string
        bindings:
          type: array
          items:
            type: object
        took_ms:
          type: number
    ClassMappingSpec:
      type: object
      required:
      - source_class
      - target_class
      properties:
        source_class:
          type: string
        target_class:
          type: string
    PropertyMappingSpec:
      type: object
      required:
      - source_property
      - target_property
      properties:
        source_property:
          type: string
        target_property:
          type: string
    CreateMappingRequest:
      type: object
      required:
      - source_ontology
      - target_ontology
      properties:
        source_ontology:
          type: string
        target_ontology:
          type: string
        class_mappings:
          type: array
          items:
            $ref: '#/components/schemas/ClassMappingSpec'
        property_mappings:
          type: array
          items:
            $ref: '#/components/schemas/PropertyMappingSpec'
    MappingResponse:
      type: object
      required:
      - source_ontology
      - target_ontology
      properties:
        source_ontology:
          type: string
        target_ontology:
          type: string
        class_mappings:
          type: array
          items:
            $ref: '#/components/schemas/ClassMappingSpec'
        property_mappings:
          type: array
          items:
            $ref: '#/components/schemas/PropertyMappingSpec'
    FederationQueryRequest:
      type: object
      required:
      - query
      - target_ontologies
      properties:
        query:
          type: string
        target_ontologies:
          type: array
          items:
            type: string
        merge_strategy:
          type: string
          default: union
          enum:
          - union
          - intersection
          - priority
        ontology_priority:
          type: object
          additionalProperties:
            type: integer
    FederationQueryResponse:
      type: object
      required:
      - results
      - count
      properties:
        results:
          type: array
          items:
            type: object
        count:
          type: integer
