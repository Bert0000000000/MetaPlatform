      properties:
        rid: {type: string}
        class_rid: {$ref: '#/components/schemas/RidString'}
        props:
          type: array
          items:
            type: array
            items: 2
        primary_key: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        tenant_id: {type: string}
        marking:
          type: array
          items: {type: string}
    IndividualCreateV2:
      type: object
      additionalProperties: false
      required: [rid, class_rid, primary_key]
      properties:
        rid: {type: string}
        class_rid: {$ref: '#/components/schemas/RidString'}
        props:
          type: array
          items:
            type: array
            items: 2
        primary_key: {type: string}
        marking:
          type: array
          items: {type: string}
    LinkInstanceV2:
      type: object
      additionalProperties: false
      required: [rid, link_type_rid, src, dst, tenant_id]
      properties:
        rid: {type: string}
        link_type_rid: {$ref: '#/components/schemas/RidString'}
        src: {type: string}
        dst: {type: string}
        props:
          type: array
          items:
            type: array
            items: 2
        created_at: {type: string, format: date-time}
        tenant_id: {type: string}
        marking:
          type: array
          items: {type: string}
    LinkInstanceCreateV2:
      type: object
      additionalProperties: false
      required: [rid, link_type_rid, src, dst]
      properties:
        rid: {type: string}
        link_type_rid: {$ref: '#/components/schemas/RidString'}
        src: {type: string}
        dst: {type: string}
        props:
          type: array
          items:
            type: array
            items: 2
        marking:
          type: array
          items: {type: string}
    AxiomV2:
      type: object
      additionalProperties: false
      required: [rid, kind, operands, rule_ref]
