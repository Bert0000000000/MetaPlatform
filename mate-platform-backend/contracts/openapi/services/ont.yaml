components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  schemas:
    OntologyCreate:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        namespace:
          type: string
          default: default
        description:
          type: string
    Ontology:
      type: object
      required:
      - id
      - namespace
      - description
      properties:
        id:
          type: string
        namespace:
          type: string
        description:
          type: string
    ClassCreate:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        namespace:
          type: string
          default: default
        label:
          type: string
        parent:
          type:
          - string
          - 'null'
        properties:
          type: array
          items:
            type: object
    ClassResponse:
      type: object
      required:
      - id
      - namespace
      - label
      properties:
        id:
          type: string
        namespace:
          type: string
        label:
          type: string
        parent:
          type:
          - string
          - 'null'
        properties:
          type: array
          items:
            type: object
    InstanceCreate:
      type: object
      required:
      - class_id
      properties:
        class_id:
          type: string
        properties:
          type: object
        namespace:
          type: string
          default: default
    InstanceResponse:
      type: object
      required:
      - id
      - class_id
      - namespace
      properties:
        id:
          type: string
        class_id:
          type: string
        namespace:
          type: string
        properties:
          type: object
    RelationCreate:
      type: object
      required:
      - type
      - src_id
      - dst_id
      properties:
        type:
          type: string
        src_id:
          type: string
        dst_id:
          type: string
        properties:
          type: object
    RelationResponse:
      type: object
      required:
      - id
      - type
      - src_id
      - dst_id
      properties:
        id:
          type: string
        type:
          type: string
        src_id:
          type: string
        dst_id:
          type: string
        properties:
          type: object
    SparqlRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
        format:
          type: string
          default: json
          enum:
          - json
          - xml
          - csv
    SparqlResponse:
      type: object
      required:
      - cypher
      properties:
        cypher:
          type: string
        bindings:
          type: array
          items:
            type: object
        took_ms:
          type: number
    ClassMappingSpec:
      type: object
      required:
      - source_class
      - target_class
      properties:
        source_class:
          type: string
        target_class:
          type: string
    PropertyMappingSpec:
      type: object
      required:
      - source_property
      - target_property
      properties:
        source_property:
          type: string
        target_property:
          type: string
    CreateMappingRequest:
      type: object
      required:
      - source_ontology
      - target_ontology
      properties:
        source_ontology:
          type: string
        target_ontology:
          type: string
        class_mappings:
          type: array
          items:
            $ref: '#/components/schemas/ClassMappingSpec'
        property_mappings:
          type: array
          items:
            $ref: '#/components/schemas/PropertyMappingSpec'
    MappingResponse:
      type: object
      required:
      - source_ontology
      - target_ontology
      properties:
        source_ontology:
          type: string
        target_ontology:
          type: string
        class_mappings:
          type: array
          items:
            $ref: '#/components/schemas/ClassMappingSpec'
        property_mappings:
          type: array
          items:
            $ref: '#/components/schemas/PropertyMappingSpec'
    FederationQueryRequest:
      type: object
      required:
      - query
      - target_ontologies
      properties:
        query:
          type: string
        target_ontologies:
          type: array
          items:
            type: string
        merge_strategy:
          type: string
          default: union
          enum:
          - union
          - intersection
          - priority
        ontology_priority:
          type: object
          additionalProperties:
            type: integer
    FederationQueryResponse:
      type: object
      required:
      - results
      - count
      properties:
        results:
          type: array
          items:
            type: object
        count:
          type: integer
    # ────────────────────────────────────────────────────────────────────
    # v3.1 KERNEL-01 · 12 基元 schemas（ADR-0021 冻结）
    # ────────────────────────────────────────────────────────────────────
    RidString:
      type: string
      pattern: '^ont\.[a-z0-9_-]{1,64}\.[a-z]+\.[a-z0-9_:\-.]{1,200}$'
      description: Canonical rid (e.g. ont.<tenant>.<kind>.<rest>).
    PropertyFormatV2:
      type: string
      enum: [string, integer, double, boolean, date, timestamp, marking]
    CardinalityV2:
      type: string
      enum: ['1:1', '1:N', 'N:1', 'N:N']
    DirectionalityV2:
      type: string
      enum: [undirected, directed, bidirectional]
    AxiomKindV2:
      type: string
      enum: [subclass, transitivity, same_as, functional, domain_range, cardinality]
    FunctionLanguageV2:
      type: string
      enum: [python, typescript, sql, rest]
    PropertyV2:
      type: object
      additionalProperties: false
      required: [rid, type_id, nullable, primary_key, title, format]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        type_id: {type: string, minLength: 1}
        nullable: {type: boolean}
        primary_key: {type: boolean}
        title: {type: string, minLength: 1}
        format: {$ref: '#/components/schemas/PropertyFormatV2'}
    ObjectTypeV2:
      type: object
      additionalProperties: false
      required: [rid, primary_key, properties]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        primary_key:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RidString'}
        properties:
          type: array
          items: {$ref: '#/components/schemas/PropertyV2'}
        interfaces:
          type: array
          items: {$ref: '#/components/schemas/RidString'}
        display_name: {type: string}
    ObjectTypeCreateV2:
      type: object
      additionalProperties: false
      required: [rid, primary_key, properties]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        primary_key:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RidString'}
        properties:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PropertyV2'}
        interfaces:
          type: array
          items: {$ref: '#/components/schemas/RidString'}
        display_name: {type: string}
    LinkTypeV2:
      type: object
      additionalProperties: false
      required: [rid, src, dst, cardinality, directionality]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        src: {$ref: '#/components/schemas/RidString'}
        dst: {$ref: '#/components/schemas/RidString'}
        cardinality: {$ref: '#/components/schemas/CardinalityV2'}
        directionality: {$ref: '#/components/schemas/DirectionalityV2'}
        link_properties:
          type: array
          items: {$ref: '#/components/schemas/PropertyV2'}
    LinkTypeCreateV2:
      type: object
      additionalProperties: false
      required: [rid, src, dst, cardinality, directionality]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        src: {$ref: '#/components/schemas/RidString'}
        dst: {$ref: '#/components/schemas/RidString'}
        cardinality: {$ref: '#/components/schemas/CardinalityV2'}
        directionality: {$ref: '#/components/schemas/DirectionalityV2'}
        link_properties:
          type: array
          items: {$ref: '#/components/schemas/PropertyV2'}
    ActionTypeV2:
      type: object
      additionalProperties: false
      required: [rid, parameters, function_ref, on]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        parameters:
          type: array
          items: {$ref: '#/components/schemas/PropertyV2'}
        submission_criteria:
          type: array
          items: {type: string}
        side_effects:
          type: array
          items: {type: string}
        function_ref: {$ref: '#/components/schemas/RidString'}
        on:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RidString'}
    ActionTypeCreateV2:
      type: object
      additionalProperties: false
      required: [rid, parameters, function_ref, on]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        parameters:
          type: array
          items: {$ref: '#/components/schemas/PropertyV2'}
        submission_criteria:
          type: array
          items: {type: string}
        side_effects:
          type: array
          items: {type: string}
        function_ref: {$ref: '#/components/schemas/RidString'}
        on:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RidString'}
    ActionApplyRequest:
      type: object
      additionalProperties: false
      required: [parameters]
      properties:
        parameters: {type: object, additionalProperties: true}
        target_iid: {type: string}
        provenance:
          type: object
