        action_rid: {$ref: '#/components/schemas/RidString'}
        applied_at: {type: string, format: date-time}
        side_effects_emitted:
          type: array
          items: {type: string}
    InterfaceV2:
      type: object
      additionalProperties: false
      required: [rid]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        properties:
          type: array
          items: {$ref: '#/components/schemas/PropertyV2'}
        required_links:
          type: array
          items: {$ref: '#/components/schemas/RidString'}
        polymorphic_action_constraints:
          type: array
          items: {type: string}
    InterfaceCreateV2:
      type: object
      additionalProperties: false
      required: [rid]
      properties:
        rid: {$ref: '#/components/schemas/RidString'}
        properties:
          type: array
          items: {$ref: '#/components/schemas/PropertyV2'}
        required_links:
          type: array
          items: {$ref: '#/components/schemas/RidString'}
        polymorphic_action_constraints:
          type: array
          items: {type: string}
    IndividualV2:
      type: object
