openapi: 3.1.0
info:
  title: Mate Platform ont API
  version: 1.0.0
  x-mate-owner: ontology-platform
  description: Canonical contract for Mate Platform ont API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
- url: /
tags:
- name: ont
  description: ont domain operations
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes: [platform.read]
paths:
  /healthz:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
      summary: Liveness probe
      tags:
      - ont
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: ontGetHealthz
      description: Liveness probe
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETHEALTHZ
      x-mate-implementation-status: implemented
  /api/v1/ont/ontologies:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create ontology
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OntologyCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
        '409':
          description: Ontology already exists
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-types"
      operationId: ontPostOntOntologies
      description: Create ontology
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTONTOLOGIES
      x-mate-implementation-status: implemented
  /api/v1/ont/ontologies/{ontology_id}:
    parameters:
    - in: path
      name: ontology_id
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Read ontology
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
        '404':
          description: not found
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-types"
      operationId: ontGetOntOntologiesOntologyId
      description: Read ontology
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTONTOLOGIESONTOLOGYID
      x-mate-implementation-status: implemented
      parameters:
      - name: ontology_id
        in: path
        required: true
        schema:
          type: string
  /api/v1/ont/classes:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create class
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassResponse'
        '409':
          description: Class already exists
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-types"
      operationId: ontPostOntClasses
      description: Create class
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTCLASSES
      x-mate-implementation-status: implemented
  /api/v1/ont/classes/{class_id}:
    parameters:
    - in: path
      name: class_id
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Read class
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassResponse'
        '404':
          description: not found
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-types"
      operationId: ontGetOntClassesClassId
      description: Read class
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTCLASSESCLASSID
      x-mate-implementation-status: implemented
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
  /api/v1/ont/instances:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: List instances (optional class_id filter)
      tags:
      - ont
      parameters:
      - in: query
        name: class_id
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/individuals"
      operationId: ontGetOntInstances
      description: List instances (optional class_id filter)
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTINSTANCES
      x-mate-implementation-status: placeholder
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create instance
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/individuals"
      operationId: ontPostOntInstances
      description: Create instance
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTINSTANCES
      x-mate-implementation-status: placeholder
  /api/v1/ont/instances/{iid}:
    parameters:
    - in: path
      name: iid
      required: true
      schema:
        type: string
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Read instance
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: not found
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/individuals"
      operationId: ontGetOntInstancesIid
      description: Read instance
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTINSTANCESIID
      x-mate-implementation-status: placeholder
      parameters:
      - name: iid
        in: path
        required: true
        schema:
          type: string
    delete:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Delete instance
      tags:
      - ont
      responses:
        '200':
          description: OK
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/individuals"
      operationId: ontDeleteOntInstancesIid
      description: Delete instance
      x-mate-owner: ontology-platform
      x-mate-permission: ont.delete
      x-mate-requirements:
      - FR-ONT-ONTDELETEONTINSTANCESIID
      x-mate-implementation-status: placeholder
      parameters:
      - name: iid
        in: path
        required: true
        schema:
          type: string
  /api/v1/ont/instances/relations:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: List relations
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelationResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/individuals"
      operationId: ontGetOntInstancesRelations
      description: List relations
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-requirements:
      - FR-ONT-ONTGETONTINSTANCESRELATIONS
      x-mate-implementation-status: placeholder
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create relation
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationResponse'
        '400':
          description: Bad payload
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/individuals"
      operationId: ontPostOntInstancesRelations
      description: Create relation
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTINSTANCESRELATIONS
      x-mate-implementation-status: placeholder
  /api/v1/ont/sparql:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: SPARQL -> Cypher -> execute
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SparqlRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparqlResponse'
        '400':
          description: SPARQL parse / transpile failure
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-sets:evaluate"
      operationId: ontPostOntSparql
      description: SPARQL -> Cypher -> execute
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTSPARQL
      x-mate-implementation-status: placeholder
  /api/v1/ont/explain:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: SPARQL EXPLAIN (parse + transpile only)
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cypher:
                    type: string
                  plan:
                    type: string
                  estimated_rows:
                    type: integer
                  variables:
                    type: array
                    items:
                      type: string
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-sets:evaluate"
      operationId: ontPostOntExplain
      description: SPARQL EXPLAIN (parse + transpile only)
      x-mate-owner: ontology-platform
      x-mate-permission: ont.post
      x-mate-requirements:
      - FR-ONT-ONTPOSTONTEXPLAIN
      x-mate-implementation-status: implemented
  /api/v1/ont/federation/query:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: Cross-ontology federation query
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationQueryResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
        '500':
          description: Internal federation error
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-sets:evaluate"
      operationId: ontPostFederationQuery
      description: Execute a federated SPARQL query across multiple ontologies and merge results
      x-mate-owner: ontology-platform
      x-mate-permission: ont.query
      x-mate-required-tenant: true
      x-mate-requirements:
      - FR-ONT-ONTPOSTFEDERATIONQUERY
      x-mate-implementation-status: implemented
  /api/v1/ont/federation/mappings:
    post:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.write]
      summary: Create cross-ontology mapping
      tags:
      - ont
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMappingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-sets:evaluate"
      operationId: ontPostFederationMappings
      description: Register a class/property mapping between two ontologies
      x-mate-owner: ontology-platform
      x-mate-permission: ont.write
      x-mate-required-tenant: true
      x-mate-requirements:
      - FR-ONT-ONTPOSTFEDERATIONMAPPINGS
      x-mate-implementation-status: implemented
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes: [platform.read]
      summary: List cross-ontology mappings
      tags:
      - ont
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MappingResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-sunset: 2026-12-31
      x-sunset: 2026-12-31
      x-migration-target: "/api/v1/ont/v2/object-sets:evaluate"
      operationId: ontGetFederationMappings
      description: List all registered cross-ontology mappings for the current tenant
      x-mate-owner: ontology-platform
      x-mate-permission: ont.get
      x-mate-required-tenant: true
      x-mate-requirements:
      - FR-ONT-ONTGETFEDERATIONMAPPINGS
      x-mate-implementation-status: implemented
  # ────────────────────────────────────────────────────────────────────
  # v3.1 KERNEL-01 · 12 基元端点（ADR-0021 冻结）
  # 增量追加，旧 OWL/SPARQL 端点保留以保持后向兼容
  # ────────────────────────────────────────────────────────────────────
  /api/v1/ont/v2/object-types:
    parameters:
    - in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    - in: query
      name: offset
      schema: {type: integer, minimum: 0, default: 0}
    get:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.read]}]
      tags: [ont]
      summary: List ObjectTypes (v2 不可变类型层)
      operationId: ontListV2ObjectTypes
      description: List immutable ObjectTypes registered for the tenant.
      x-mate-owner: ontology-platform
      x-mate-permission: ont.read
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-LISTOBJECTTYPES]
      x-mate-implementation-status: implemented
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ObjectTypeV2'}
        '400': {$ref: ../common/errors.yaml#/components/responses/Error400}
    post:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.write]}]
      tags: [ont]
      summary: Create ObjectType (v2 不可变类型层)
      operationId: ontCreateV2ObjectType
      x-mate-owner: ontology-platform
      x-mate-permission: ont.write
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-CREATEOBJECTTYPE]
      x-mate-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ObjectTypeCreateV2'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectTypeV2'}
        '409': {$ref: ../common/errors.yaml#/components/responses/Error409}
        '422': {$ref: ../common/errors.yaml#/components/responses/Error422}
  /api/v1/ont/v2/object-types/{rid}:
    parameters:
    - in: path
      name: rid
      required: true
      schema: {type: string, pattern: '^ont\.[a-z0-9_-]{1,64}\.obj\.[a-z0-9_:\-.]+$'}
    get:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.read]}]
      tags: [ont]
      summary: Read ObjectType by rid
      operationId: ontGetV2ObjectType
      x-mate-owner: ontology-platform
      x-mate-permission: ont.read
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-GETOBJECTTYPE]
      x-mate-implementation-status: implemented
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectTypeV2'}
        '404': {$ref: ../common/errors.yaml#/components/responses/Error404}
  /api/v1/ont/v2/object-types/{rid}/properties:
    parameters:
    - in: path
      name: rid
      required: true
      schema: {type: string, pattern: '^ont\.[a-z0-9_-]{1,64}\.obj\.[a-z0-9_:\-.]+$'}
    post:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.write]}]
      tags: [ont]
      summary: Append a Property to an existing ObjectType (v2 不可变类型层增量)
      operationId: ontAppendV2ObjectTypeProperty
      description: |
        增量追加单个 Property 到已存在的 ObjectType。Property 的 rid 由调用方
        生成（形如 `ont.<tenant>.prop.<slug>.v1`）；后端校验 tenant 前缀 + slug
        格式后写入 ontology_property 表。重复追加返回 409。
      x-mate-owner: ontology-platform
      x-mate-permission: ont.write
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-APPENDOBJECTPROPERTY]
      x-mate-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PropertyV2'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectTypeV2'}
        '404': {$ref: ../common/errors.yaml#/components/responses/Error404}
        '409': {$ref: ../common/errors.yaml#/components/responses/Error409}
        '422': {$ref: ../common/errors.yaml#/components/responses/Error422}
  /api/v1/ont/v2/link-types:
    get:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.read]}]
      tags: [ont]
      summary: List LinkTypes
      operationId: ontListV2LinkTypes
      x-mate-owner: ontology-platform
      x-mate-permission: ont.read
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-LISTLINKTYPES]
      x-mate-implementation-status: implemented
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LinkTypeV2'}
    post:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.write]}]
      tags: [ont]
      summary: Create LinkType
      operationId: ontCreateV2LinkType
      x-mate-owner: ontology-platform
      x-mate-permission: ont.write
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-CREATELINKTYPE]
      x-mate-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkTypeCreateV2'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LinkTypeV2'}
        '422': {$ref: ../common/errors.yaml#/components/responses/Error422}
  /api/v1/ont/v2/link-types/{rid}:
    parameters:
    - in: path
      name: rid
      required: true
      schema: {type: string, pattern: '^ont\.[a-z0-9_-]{1,64}\.link\.[a-z0-9_:\-.]+$'}
    get:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.read]}]
      tags: [ont]
      summary: Read LinkType
      operationId: ontGetV2LinkType
      x-mate-owner: ontology-platform
      x-mate-permission: ont.read
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-GETLINKTYPE]
      x-mate-implementation-status: implemented
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LinkTypeV2'}
        '404': {$ref: ../common/errors.yaml#/components/responses/Error404}
  /api/v1/ont/v2/action-types:
    get:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.read]}]
      tags: [ont]
      summary: List ActionTypes (all write operations route through here)
      operationId: ontListV2ActionTypes
      x-mate-owner: ontology-platform
      x-mate-permission: ont.read
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-LISTACTIONTYPES]
      x-mate-implementation-status: implemented
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ActionTypeV2'}
    post:
      security: [{bearerAuth: [], tenantHeader: [], oidcScopes: [platform.write]}]
      tags: [ont]
      summary: Create ActionType (write the only legal entry point)
      operationId: ontCreateV2ActionType
      x-mate-owner: ontology-platform
      x-mate-permission: ont.write
      x-mate-required-tenant: true
      x-mate-requirements: [FR-ONT-KERNEL01-CREATEACTIONTYPE]
      x-mate-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActionTypeCreateV2'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionTypeV2'}
        '422': {$ref: ../common/errors.yaml#/components/responses/Error422}
  /api/v1/ont/v2/action-types/{rid}/apply:
    parameters:
    - in: path
      name: rid
      required: true
      schema: {type: string, pattern: '^ont\.[a-z0-9_-]{1,64}\.act\.[a-z0-9_:\-.]+$'}
    post:
