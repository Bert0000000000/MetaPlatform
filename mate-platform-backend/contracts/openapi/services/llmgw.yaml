openapi: 3.1.0
info:
  title: Mate Platform llmgw API
  version: 1.0.0
  x-mate-owner: ai-runtime
  description: Canonical contract for Mate Platform llmgw API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
  - url: /
tags:
  - name: llmgw
    description: llmgw domain operations
security:
  - bearerAuth: []
    tenantHeader: []
    oidcScopes: [platform.read]
paths:
  /api/v1/llmgw/chat:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes: [platform.write]
      summary: 非流式 chat
      tags:
        - llmgw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponseAPI"
        "501":
          description: Provider not implemented
        "400":
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: llmgwPostLlmgwChat
      description: 非流式 chat
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.post
      x-mate-requirements:
        - FR-LLMGW-LLMGWPOSTLLMGWCHAT
      x-mate-implementation-status: implemented
  /api/v1/llmgw/chat/stream:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes: [platform.write]
      summary: SSE 流式 chat
      tags:
        - llmgw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream: {}
        "400":
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: llmgwPostLlmgwChatStream
      description: SSE 流式 chat
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.post
      x-mate-requirements:
        - FR-LLMGW-LLMGWPOSTLLMGWCHATSTREAM
      x-mate-implementation-status: placeholder
  /api/v1/llmgw/embeddings:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes: [platform.write]
      summary: 嵌入向量
      tags:
        - llmgw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: llmgwPostLlmgwEmbeddings
      description: 嵌入向量
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.post
      x-mate-requirements:
        - FR-LLMGW-LLMGWPOSTLLMGWEMBEDDINGS
      x-mate-implementation-status: placeholder
  /api/v1/llmgw/chat/multimodal:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes: [platform.write]
      summary: 多模态对话(图像/语音/视频 → 文本)
      tags:
        - llmgw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                audio:
                  type: array
                  items:
                    type: string
                model:
                  type: string
                  default: ""
                  description: 多模态模型名（空=取 OPENAI_CHAT_MODEL env）
                tenant_id:
                  type: string
                  default: default
                base_url:
                  type: string
                  description: OpenAI 兼容 base URL 覆盖（如 ARK Plan /api/plan/v3）
                api_key:
                  type: string
                  description: API Key 覆盖
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                  model:
                    type: string
                  usage:
                    type: object
        "422":
          description: Validation error (missing prompt)
        "429":
          description: Quota exceeded
        "400":
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: llmgwPostChatMultimodal
      description: 多模态对话(图像/语音/视频 → 文本),基于 MultimodalEngine(v3.2 W2)
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.post
      x-mate-requirements:
        - FR-LLMGW-LLMGWPOSTCHATMULTIMODAL
      x-mate-implementation-status: implemented
  /healthz:
    get:
      security:
        - bearerAuth: []
          tenantHeader: []
      summary: 健康检查
      tags:
        - llmgw
      responses:
        "200":
          description: OK
        "400":
          $ref: ../common/errors.yaml#/components/responses/Error400
      operationId: llmgwGetHealthz
      description: 健康检查
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.get
      x-mate-requirements:
        - FR-LLMGW-LLMGWGETHEALTHZ
      x-mate-implementation-status: implemented
  /api/v1/llmgw/chat/real:
    post:
      security:
        - bearerAuth: []
          tenantHeader: []
          oidcScopes: [platform.write]
      summary: 真实上游对话（openai / anthropic / custom 兼容端点）
      tags:
        - llmgw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealChatRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealChatResponseAPI"
        "400":
          $ref: ../common/errors.yaml#/components/responses/Error400
        "503":
          description: 上游不可用且调用方要求不回显（allow_stub_fallback=false）
      operationId: llmgwPostLlmgwChatReal
      description: |
        非流式真实上游对话。调用方透传 provider / base_url / api_key
        （后者由 IAM `ai.provider.*` 取真值），llmgw 据此真正上调。

        `allow_stub_fallback`（默认 true，保持既有行为）：非生产 profile 下，
        上游不可用时是否允许返回**回显输入的假答复**。Agent 产品层传 false ——
        员工产出里出现"把指令抄回来"的假回执，比一次明确失败危险得多。
        生产 profile 一律不回显（硬规则 #5），该字段不改变这一点。
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.post
      x-mate-requirements:
        - FR-LLMGW-LLMGWPOSTLLMGWCHATREAL
      x-mate-implementation-status: implemented
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
  schemas:
    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
        name:
          type:
            - string
            - "null"
        tool_call_id:
          type:
            - string
            - "null"
    ChatRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          default: 1.0
        max_tokens:
          type:
            - integer
            - "null"
        tools:
          type: array
          items:
            type: object
    ChatResponseAPI:
      type: object
      properties:
        content:
          type: string
        model:
          type: string
        finish_reason:
          type:
            - string
            - "null"
        tool_calls:
          type: array
          items:
            type: object
        usage:
          type: object
    RealChatRequest:
      type: object
      required:
        - provider
        - messages
      properties:
        provider:
          type: string
          description: openai | anthropic | custom — 选择真实后端
        model:
          type: string
          default: ""
          description: 模型名（空 = 取 provider 默认）
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          default: 1.0
        max_tokens:
          type:
            - integer
            - "null"
        tenant_id:
          type: string
          default: ""
          description: 租户 ID（用于按租户解析 API key）
        base_url:
          type: string
          description: OpenAI 兼容 base URL 覆盖（如 ARK Plan /api/plan/v3）
        api_key:
          type: string
          description: API Key 覆盖（由调用方从 IAM ai.provider.* 取真值）
        tools:
          type: array
          items:
            type: object
          description: function-calling tools，转发给 OpenAI 兼容后端
        allow_stub_fallback:
          type: boolean
          default: true
          description: |
            上游不可用时是否允许返回回显输入的假答复（stub-fallback）。
            默认 true = 保持既有行为；Agent 产品层传 false，让失败如实暴露。
            生产 profile 一律不回显，该字段不能绕过硬规则 #5。
    RealChatResponseAPI:
      type: object
      properties:
        content:
          type: string
        model:
          type: string
        reasoning_content:
          type:
            - string
            - "null"
        finish_reason:
          type:
            - string
            - "null"
        usage:
          type: object
        provider:
          type: string
        fallback:
          type: boolean
          description: true = 这条 content 是 stub-fallback 回显，不是模型答复
        tool_calls:
          type: array
          items:
            type: object
    EmbeddingRequest:
      type: object
      required:
        - input
      properties:
        model:
          type: string
          default: text-embedding-3-small
        input:
          type: array
          items:
            type: string
    EmbeddingResponse:
      type: object
      properties:
        model:
          type: string
        data:
          type: array
          items:
            type: object
        usage:
          type: object
