openapi: 3.1.0
info:
  title: Mate Platform llmgw API
  version: 1.0.0
  x-mate-owner: ai-runtime
servers:
- url: /
tags:
- name: llmgw
  description: llmgw domain operations
security:
- bearerAuth: []
paths:
  /api/v1/llmgw/chat:
    post:
      summary: 非流式 chat
      tags:
      - llmgw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseAPI'
        '501':
          description: Provider not implemented
      operationId: llmgwPostLlmgwChat
      description: 非流式 chat
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.post
      x-mate-requirements:
      - FR-LLMGW-LLMGWPOSTLLMGWCHAT
      x-mate-implementation-status: implemented
  /api/v1/llmgw/chat/stream:
    post:
      summary: SSE 流式 chat
      tags:
      - llmgw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream: {}
      operationId: llmgwPostLlmgwChatStream
      description: SSE 流式 chat
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.post
      x-mate-requirements:
      - FR-LLMGW-LLMGWPOSTLLMGWCHATSTREAM
      x-mate-implementation-status: placeholder
  /api/v1/llmgw/embeddings:
    post:
      summary: 嵌入向量
      tags:
      - llmgw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: OK
      operationId: llmgwPostLlmgwEmbeddings
      description: 嵌入向量
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.post
      x-mate-requirements:
      - FR-LLMGW-LLMGWPOSTLLMGWEMBEDDINGS
      x-mate-implementation-status: placeholder
  /healthz:
    get:
      summary: 健康检查
      tags:
      - llmgw
      responses:
        '200':
          description: OK
      operationId: llmgwGetHealthz
      description: 健康检查
      x-mate-owner: ai-runtime
      x-mate-permission: llmgw.get
      x-mate-requirements:
      - FR-LLMGW-LLMGWGETHEALTHZ
      x-mate-implementation-status: implemented
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
        name:
          type: string
          nullable: true
        tool_call_id:
          type: string
          nullable: true
    ChatRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          default: 1.0
        max_tokens:
          type: integer
          nullable: true
        tools:
          type: array
          items:
            type: object
    ChatResponseAPI:
      type: object
      properties:
        content:
          type: string
        model:
          type: string
        finish_reason:
          type: string
          nullable: true
        tool_calls:
          type: array
          items:
            type: object
        usage:
          type: object
    EmbeddingRequest:
      type: object
      required:
      - input
      properties:
        model:
          type: string
          default: text-embedding-3-small
        input:
          type: array
          items:
            type: string
    EmbeddingResponse:
      type: object
      properties:
        model:
          type: string
        data:
          type: array
          items:
            type: object
        usage:
          type: object
