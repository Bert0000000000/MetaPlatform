openapi: 3.1.0
info:
  title: Mate Platform analytics API
  version: 1.0.0
  x-mate-owner: analytics
  description: Canonical contract for Mate Platform analytics API.
  contact:
    name: Mate Platform API Governance
    email: api-governance@metaplatform.local
servers:
- url: /
tags:
- name: analytics
  description: analytics domain operations
security:
- bearerAuth: []
  tenantHeader: []
  oidcScopes:
  - platform.read
paths:
  /api/v1/analytics/overview:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.read
      summary: 平台概览 (总用户/总 App/总请求数/活跃租户数)
      tags:
      - analytics
      operationId: analyticsGetOverview
      description: Platform overview aggregated over the lookback window.
      x-mate-owner: analytics
      x-mate-permission: analytics.read
      x-mate-required-tenant: true
      x-mate-implementation-status: implemented
      parameters:
      - in: query
        name: days
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        description: lookback window in days
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewStats'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-mate-requirements:
      - MP-CONSUMER
  /api/v1/analytics/usage:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.read
      summary: API 使用量 (按服务/时间窗口)
      tags:
      - analytics
      operationId: analyticsGetUsage
      description: Per-service API usage points over the lookback window.
      x-mate-owner: analytics
      x-mate-permission: analytics.read
      x-mate-required-tenant: true
      x-mate-implementation-status: implemented
      parameters:
      - in: query
        name: days
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        description: lookback window in days
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-mate-requirements:
      - MP-CONSUMER
  /api/v1/analytics/users:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.read
      summary: 用户活跃度 (DAU/MAU/增长趋势)
      tags:
      - analytics
      operationId: analyticsGetUsers
      description: User activity (DAU, new users, MAU, growth rate).
      x-mate-owner: analytics
      x-mate-permission: analytics.read
      x-mate-required-tenant: true
      x-mate-implementation-status: implemented
      parameters:
      - in: query
        name: days
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        description: lookback window in days
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActivityResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-mate-requirements:
      - MP-CONSUMER
  /api/v1/analytics/services:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.read
      summary: 服务调用排行 (top N + 延迟/错误率)
      tags:
      - analytics
      operationId: analyticsGetServices
      description: Service call ranking sorted by request volume.
      x-mate-owner: analytics
      x-mate-permission: analytics.read
      x-mate-required-tenant: true
      x-mate-implementation-status: implemented
      parameters:
      - in: query
        name: days
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        description: lookback window in days
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRankingResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-mate-requirements:
      - MP-CONSUMER
  /api/v1/analytics/trends:
    get:
      security:
      - bearerAuth: []
        tenantHeader: []
        oidcScopes:
        - platform.read
      summary: 趋势分析 (请求量/Token 消耗/存储增长 7-30 天序列)
      tags:
      - analytics
      operationId: analyticsGetTrends
      description: Trend series (requests / tokens / storage growth).
      x-mate-owner: analytics
      x-mate-permission: analytics.read
      x-mate-required-tenant: true
      x-mate-implementation-status: implemented
      parameters:
      - in: query
        name: days
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
        description: lookback window in days
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
        '400':
          $ref: ../common/errors.yaml#/components/responses/Error400
      x-mate-requirements:
      - MP-CONSUMER
components:
  schemas:
    OverviewStats:
      type: object
      required:
      - total_users
      - total_apps
      - total_requests
      - active_tenants
      - period_days
      properties:
        total_users:
          type: integer
        total_apps:
          type: integer
        total_requests:
          type: integer
        active_tenants:
          type: integer
        period_days:
          type: integer
    UsagePoint:
      type: object
      required:
      - date
      - service
      - request_count
      - token_count
      properties:
        date:
          type: string
        service:
          type: string
        request_count:
          type: integer
        token_count:
          type: integer
    UsageResponse:
      type: object
      required:
      - points
      - summary
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/UsagePoint'
        summary:
          type: object
    UserActivityPoint:
      type: object
      required:
      - date
      - dau
      - new_users
      properties:
        date:
          type: string
        dau:
          type: integer
        new_users:
          type: integer
    UserActivityResponse:
      type: object
      required:
      - points
      - mau
      - growth_rate
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/UserActivityPoint'
        mau:
          type: integer
        growth_rate:
          type: number
    ServiceRanking:
      type: object
      required:
      - service
      - request_count
      - avg_latency_ms
      - error_rate
      properties:
        service:
          type: string
        request_count:
          type: integer
        avg_latency_ms:
          type: number
        error_rate:
          type: number
    ServiceRankingResponse:
      type: object
      required:
      - rankings
      properties:
        rankings:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRanking'
    TrendPoint:
      type: object
      required:
      - date
      - requests
      - tokens
      - storage_gb
      properties:
        date:
          type: string
        requests:
          type: integer
        tokens:
          type: integer
        storage_gb:
          type: number
    TrendResponse:
      type: object
      required:
      - points
      - period_days
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        period_days:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
    oidcScopes:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.metaplatform.io/realms/metaplatform/protocol/openid-connect/token
          scopes:
            platform.read: Read-only access
            platform.write: Mutation access
            platform.admin: Service-to-service admin
            tenant_switch_enabled: Permit tenant switching via X-Tenant-Id
