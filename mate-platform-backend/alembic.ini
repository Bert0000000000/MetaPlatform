# Alembic configuration for Mate Platform
# Usage:
#   alembic upgrade head    - apply all migrations
#   alembic revision --autogenerate -m "description"  - generate migration from model changes
#   alembic downgrade -1    - rollback one migration

[alembic]
script_location = alembic
prepend_sys_path = packages/mate-tech-db/src packages/mate-app-arch/src packages/mate-app-copilot/src packages/mate-app-a2a/src packages/mate-platform/src
version_path_separator = os

# DSN is resolved from env in env.py (MATE_DB_URL / DATABASE_URL / sqlite default)
# This placeholder is overridden by alembic/env.py
sqlalchemy.url = sqlite:///./metaplatform.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
