[importlinter]
root_package = mate_kernel
include_external_packages = True

[importlinter:contract:kernel-has-no-deps]
type = forbidden
name = Kernel must remain pure (no framework or downstream imports)
source_modules =
    mate_kernel
forbidden_modules =
    fastapi
    sqlalchemy
    redis
    aiokafka
    neo4j
    pymilvus
    minio
    httpx
    mate_platform
    mate_clients

[importlinter:contract:platform-has-no-business-adapters]
type = forbidden
name = Platform must not import business adapters directly
source_modules =
    mate_platform
forbidden_modules =
    sqlalchemy.ext.asyncio
    aiokafka
    neo4j
    pymilvus
    minio
    psycopg
