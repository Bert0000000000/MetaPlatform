[project]
name = "mate-tech-deep-research"
version = "0.1.0"
description = "Mate Platform - mate-tech-deep-research (DeerFlow deep research agent)"
requires-python = ">=3.12"
readme = { text = "mate-tech-deep-research", content-type = "text/plain" }
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pydantic>=2.0.0",
    "mate-platform",
    "mate-clients",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_deep_research"]
