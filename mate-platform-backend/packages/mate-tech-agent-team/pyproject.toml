[project]
name = "mate-tech-agent-team"
version = "2.1.0"
description = "Mate Platform - Agent 产品层 2.1: 超级大脑 (langgraph 任务图) + 数字员工运行时, 坐在 Ontology 之上, 租户隔离由 RLS 强制。"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "mate-platform",
    "mate-clients",
    "mate-kernel",
    "langchain>=1.3.0",
    "langgraph>=1.2.9",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "httpx>=0.28.0",
    # 事件流用例要**真服务**：httpx 的 ASGITransport 会把响应体收完才返回，
    # 长连接在它那里永远"没完"（本服务本身就由 uvicorn 跑，见 Dockerfile）。
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_agent_team"]

[tool.uv.sources]
mate-platform = { workspace = true }
mate-clients = { workspace = true }
mate-kernel = { workspace = true }
