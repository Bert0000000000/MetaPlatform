[project]
name = "mate-tech-llmgw"
version = "0.1.0"
description = "Mate Platform - Tech LLM Gateway (multi-provider LLM routing)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Mate Platform Team" }
]

dependencies = [
    # Core (inherited from workspace)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0; sys_platform != 'win32'",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",

    # LLM providers - ST-5.5.3.x 澶?provider 璺敱
    # (langchain* removed P6: zero src references — providers speak raw httpx)
    "anthropic>=0.39.0",
    "openai>=1.60.0",

    # Cache & quota - TC-5.5.4 限流与配额
    "redis>=5.2.0",

    # Persistence - llm_usage / llmgw_tenant_quota (P0 close-out)
    "asyncpg>=0.30.0",

    # Resilience - TC-5.5.6 閲嶈瘯涓?fallback
    # (pybreaker removed P6: declared but never referenced; P2 cooldown
    #  is hand-rolled in resilience/cooldown.py)
    "tenacity>=9.0.0",

    # Streaming - TC-5.5.7 娴佸紡 SSE
    "sse-starlette>=2.1.0",

    # Observability - W5-2
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",

    # Common (workspace)
    "mate-common",
]


[tool.uv.sources]
mate-common = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_llmgw"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/**/test_*.py" = ["S101"]
"src/mate_tech_llmgw/test_*.py" = ["S101"]
"test_tool_calls_extra.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"
[tool.coverage.run]
source = ["src/mate_tech_llmgw"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
