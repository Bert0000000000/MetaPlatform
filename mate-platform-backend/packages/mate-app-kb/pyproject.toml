[project]
name = "mate-app-kb"
version = "0.1.0"
description = "Mate Platform app-kb business aggregation service (facade over RAG + Agent)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.32",
    "mate-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_app_kb"]

[tool.uv.sources]
mate-common = { workspace = true }