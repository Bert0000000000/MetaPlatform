[project]
name = "mate-app-wfe"
version = "0.1.0"
description = "Mate Platform - APP-WFE workflow engine center (FR-WFE-001..002)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "mate-platform",
    "mate-clients",
    "mate-tech-db",
    "mate-tech-orchestrator",
    "temporalio>=1.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "httpx>=0.28.0",
    "pyjwt>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_app_wfe"]

[tool.uv.sources]
mate-platform = { workspace = true }
mate-clients = { workspace = true }
mate-tech-db = { workspace = true }
mate-tech-orchestrator = { workspace = true }
