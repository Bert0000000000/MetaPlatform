[project]
name = "mate-tech-db"
version = "0.1.0"
description = "SQLAlchemy 2.0 persistence layer for Mate Platform"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_db"]
