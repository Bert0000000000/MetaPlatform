[project]
name = "mate-tech-analytics"
version = "0.1.0"
description = "Mate Platform - mate-tech-analytics"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "structlog>=24.4.0",
    "pyjwt>=2.13.0",
    "mate-common",
]


[tool.uv.sources]
mate-common = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_"]
