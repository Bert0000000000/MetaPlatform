[project]
name = "mate-app-a2a"
version = "0.1.0"
description = "Mate Platform - APP-A2A Agent-to-Agent protocol center: inter-agent delegation, external agent discovery, and task routing (FR-APP-A2A-001..010)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "a2a-sdk>=0.1.0",
    "mate-platform",
    "mate-clients",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_app_a2a"]

[tool.uv.sources]
mate-platform = { workspace = true }
mate-clients = { workspace = true }
