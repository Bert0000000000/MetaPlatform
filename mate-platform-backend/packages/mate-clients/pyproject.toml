[project]
name = "mate-clients"
version = "0.1.0"
description = "Mate Platform Anti-Corruption Layer clients for external systems"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "redis>=5.2.0",
    "aiokafka>=0.12.0",
    "psycopg[binary,pool]>=3.2.0",
    "asyncpg>=0.30.0",
    "neo4j>=5.25.0",
    "pymilvus>=2.5.0",
    "minio>=7.2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "mate-kernel",
    "mate-platform",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_clients"]
