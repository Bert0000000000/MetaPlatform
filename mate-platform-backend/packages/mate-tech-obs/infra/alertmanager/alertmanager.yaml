global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'slack-mate'

receivers:
  - name: 'slack-mate'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_ME/WITH_YOUR_SLACK_WEBHOOK_URL'
        channel: '#mate-alerts'
        send_resolved: true
        title: 'Mate Platform Alert'
        text: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.description }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
