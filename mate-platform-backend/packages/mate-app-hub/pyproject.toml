[project]
name = "mate-app-hub"
version = "0.1.0"
description = "Mate Platform - APP-HUB application registry / grouping / module catalog / page templates (FR-APP-HUB-001..005)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "mate-platform",
    "mate-clients",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "httpx>=0.28.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-sdk-testing>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_app_hub"]

[tool.uv.sources]
mate-platform = { workspace = true }
mate-clients = { workspace = true }
