[project]
name = "mate-platform"
version = "0.1.0"
description = "Mate Platform cross-cutting platform capabilities"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "aiokafka>=0.12.0",
    "tenacity>=9.0.0",
    "pybreaker>=1.2.0",
    "temporalio>=1.16.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "mate-kernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_platform"]

[tool.uv.sources]
mate-kernel = { workspace = true }
