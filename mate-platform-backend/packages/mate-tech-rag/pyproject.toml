[project]
name = "mate-tech-rag"
version = "0.1.0"
description = "Mate Platform RAG 核心服务（v3.0 Plan D）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "mate-common",
    "mate-platform",
    "mate-clients",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_rag"]

[tool.uv.sources]
mate-common = { workspace = true }
mate-platform = { workspace = true }
mate-clients = { workspace = true }
