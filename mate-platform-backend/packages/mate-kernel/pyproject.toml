[project]
name = "mate-kernel"
version = "0.1.0"
description = "Mate Platform pure-domain kernel types"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "typing-extensions>=4.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_kernel"]
