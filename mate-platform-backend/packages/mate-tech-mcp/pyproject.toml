[project]
name = "mate-tech-mcp"
version = "0.1.0"
description = "Mate Platform - MCP (Model Context Protocol) server"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Mate Platform Team" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0; sys_platform != 'win32'",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sse-starlette>=2.1.0",
    "mcp>=1.0.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "pybreaker>=1.2.0",
    "pyjwt[crypto]>=2.8.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "structlog>=24.4.0",
    "mate-common",
    "mate-platform",
    "mate-clients",
]


[tool.uv.sources]
mate-common = { workspace = true }
mate-platform = { workspace = true }
mate-clients = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "E501", "PLC0415", "B008", "PTH118", "PTH120", "N815", "E402", "RUF001", "RUF002", "RUF003", "S105", "S106", "S608", "S110", "SIM105", "E701", "E702", "N803", "N806", "N818", "E741", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "F841", "RUF059", "ERA001", "PTH100", "PTH103", "PTH107", "PTH108", "PTH110", "PTH112", "PTH119", "PTH122", "PTH123", "SIM102", "SIM103", "SIM108", "SIM110", "SIM115", "SIM117", "SIM118", "C401", "C408", "C409", "RUF007", "RUF013", "RUF015", "RUF022", "RUF034", "UP031", "UP047", "E731", "ASYNC109", "ASYNC221", "ASYNC230", "ASYNC240", "S102", "S104", "S107", "S112", "S310", "S603", "N802", "N814", "PLW2901", "PLW1510", "PLW0108", "RUF012", "B007", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src/mate_tech_mcp"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true