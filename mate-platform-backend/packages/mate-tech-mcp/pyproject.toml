[project]
name = "mate-tech-mcp"
version = "0.1.0"
description = "Mate Platform - MCP (Model Context Protocol) server"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Mate Platform Team" }
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0; sys_platform != 'win32'",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sse-starlette>=2.1.0",
    "mcp>=1.0.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "pybreaker>=1.2.0",
    "pyjwt[crypto]>=2.8.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "structlog>=24.4.0",
    "mate-common",
    "mate-platform",
    "mate-clients",
]


[tool.uv.sources]
mate-common = { workspace = true }
mate-platform = { workspace = true }
mate-clients = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src/mate_tech_mcp"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true