[project]
name = "mate-tech-msg"
version = "0.1.0"
description = "Mate Platform - mate-tech-msg"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "aiokafka>=0.12.0",
    "neo4j>=5.25.0",
    "pymilvus>=2.5.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "kafka-python-ng>=2.2.0",
    "psycopg2-binary>=2.9.0",
    "pyjwt>=2.13.0",
    "prometheus-client>=0.20.0",
    "sse-starlette>=2.1.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "mate-common",
    "mate-platform",
    "mate-clients",
]

[tool.uv.sources]
mate-common = { workspace = true }
mate-platform = { workspace = true }
mate-clients = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_tech_"]