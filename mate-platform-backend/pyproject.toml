[project]
name = "mate-platform-backend"
version = "0.1.0"
description = "Mate Platform - Python 涓诲悗绔?(v3.0 Plan D)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Mate Platform Team" }
]

dependencies = [
    # Web 妗嗘灦
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0; sys_platform != 'win32'",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "granian>=2.0.0",

    # 鏁版嵁楠岃瘉 + ORM
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.22",

    # 鏁版嵁璁块棶椹卞姩
    "psycopg[binary,pool]>=3.2.0",
    "asyncpg>=0.30.0",
    "neo4j>=5.25.0",
    "pymilvus>=2.5.0",
    "minio>=7.2.0",
    "redis>=5.2.0",
    "aiokafka>=0.12.0",

    # HTTP 瀹㈡埛绔紙鍞竴锛?    "httpx>=0.28.0",

    # LLM 缂栨帓
    "langchain>=1.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=1.2.9",
    "llama-index>=0.12.0",
    "mcp>=1.0.0",

    # 寮规€?    "tenacity>=9.0.0",
    "pybreaker>=1.2.0",

    # OTel
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-aiokafka>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",          # httpx mock
    "freezegun>=1.5.0",        # 鏃堕棿 mock
    "mypy>=1.13.0",            # 鍏煎鎬ф鏌ワ紙pyright 涓荤敤锛?    "pre-commit>=4.0.0",
]

[tool.uv]
package = false                  # monorepo 妯″紡
managed = true
dev-dependencies = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages"]
pythonpath = ["packages", "packages/mate-common/src", "packages/mate-kernel/src", "packages/mate-platform/src", "packages/mate-clients/src", "packages/mate-tech-iam/src", "packages/mate-tech-agent/src", "packages/mate-tech-llmgw/src", "packages/mate-tech-mcp/src", "packages/mate-tech-msg/src", "packages/mate-tech-obs/src", "packages/mate-tech-ont/src", "packages/mate-tech-rag/src", "packages/mate-app-kb/src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
norecursedirs = ["src", ".venv", "build", "dist", "node_modules", ".pytest_cache", ".git"]

# Mirror ruff.toml so newer ruff versions (>=0.8) discover the
# config via pyproject when invoked from the repo root. The canonical
# config still lives in ruff.toml; this section exists for tooling
# compatibility only.
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "PTH", "ERA", "PL", "RUF", "ASYNC", "S", "TCH"]
ignore = ["E501", "PLR0913", "PLR2004", "S101", "TC001", "TC002", "TC003", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ARG", "FBT", "PLC0415", "E402", "I001", "PTH118"]
"**/conftest.py" = ["E402", "F401", "PTH118"]
"tests/architecture/**" = ["S603"]
"**/clients/*.py" = ["PLR0913"]
"scripts/**/*.py" = ["T201", "S"]
"**/tests/architecture/**" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["mate_common", "mate_tech_rag", "mate_tech_agent", "mate_tech_llmgw", "mate_tech_msg", "mate_tech_obs", "mate_tech_ont", "mate_tech_mcp", "mate_app_kb", "mate_kernel", "mate_platform", "mate_clients"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
