global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: metaplatform-dev

scrape_configs:
  # Python services (prometheus-client 暴露在 /metrics 需 app 加路由)
  - job_name: mate-tech-rag
    static_configs: [{ targets: ["mate-tech-rag:8001"] }]
  - job_name: mate-tech-agent
    static_configs: [{ targets: ["mate-tech-agent:8002"] }]
  - job_name: mate-app-kb
    static_configs: [{ targets: ["mate-app-kb:8003"] }]
  - job_name: mate-tech-llmgw
    static_configs: [{ targets: ["mate-tech-llmgw:8008"] }]
  - job_name: mate-tech-ont
    static_configs: [{ targets: ["mate-tech-ont:8007"] }]
  - job_name: mate-tech-msg
    static_configs: [{ targets: ["mate-tech-msg:8082"] }]
  - job_name: mate-tech-mcp
    static_configs: [{ targets: ["mate-tech-mcp:8081"] }]

  # Infrastructure metrics endpoints
  - job_name: milvus
    static_configs: [{ targets: ["milvus:9091"] }]
  - job_name: neo4j
    static_configs: [{ targets: ["neo4j:7474"] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]

  # Self-monitoring
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]