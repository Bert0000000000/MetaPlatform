# =============================================================================
# MetaPlatform umbrella chart - default values
# =============================================================================
# Conventions:
#   - Per-environment overrides live in values-{env}.yaml.
#   - Secret material MUST be referenced via existingSecretName
#     (SealedSecret or ExternalSecret) - never inline.
#   - See docs/active/decisions/ADR-0010-platform-k8s-baseline.md
# =============================================================================

global:
  labels:
    app.kubernetes.io/part-of: metaplatform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "3.0.0"
  podSecurityStandards:
    enforce: restricted
    audit: restricted
    warn: restricted

imageRegistry: docker.io
imagePullSecrets: []

# Service-account used by Argo CD / Helm hooks.
serviceAccount:
  create: true
  name: metaplatform

# -----------------------------------------------------------------------------
# Network policy defaults (the §13 硬规则 8 enforcer)
# -----------------------------------------------------------------------------
network-policies:
  enabled: true
  defaultDeny:
    ingress: true
    egress: true
  allowedEgress:
    dns:
      enabled: true
      namespace: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    keycloak:
      enabled: true
    otelCollector:
      enabled: true
    dataPlane:
      enabled: true
      targets:
        - name: postgres
          port: 5432
          protocol: TCP
        - name: redis
          port: 6379
          protocol: TCP
        - name: kafka
          port: 9092
          protocol: TCP
  allowedIngress:
    apiGateway:
      enabled: true
      fromNamespace: api-gateway

# -----------------------------------------------------------------------------
# OTel Collector
# -----------------------------------------------------------------------------
otel-collector:
  enabled: true
  fullnameOverride: otel-collector
  replicaCount: 2
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.104.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318
    prometheus:
      enabled: true
    kafkametrics:
      enabled: false
    postgresql:
      enabled: false
    redis:
      enabled: false
  processors:
    batch:
      timeout: 5s
      sendBatchSize: 1000
    memoryLimiter:
      checkInterval: 1s
      limitPercentage: 80
      spikeLimitPercentage: 25
    tailSampling:
      enabled: false
    attributes:
      tenantKey: tenant.id
      traceKey: trace.id
  exporters:
    otlphttp:
      enabled: true
      tracesEndpoint: http://tempo:4318
    prometheusremotewrite:
      enabled: true
      endpoint: http://prometheus:9090/api/v1/write
  exportersLogging:
    enabled: true
    verbosity: basic
  extensions:
    healthCheck:
      enabled: true
      port: 13133
    pprof:
      enabled: false
  service:
    type: ClusterIP

# -----------------------------------------------------------------------------
# Keycloak (identity)
# -----------------------------------------------------------------------------
keycloak:
  enabled: true
  fullnameOverride: keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0"
  replicas: 1
  database:
    vendor: postgres
    host: postgres.metaplatform.svc.cluster.local
    port: 5432
    database: keycloak
    username: keycloak
    existingSecretName: keycloak-db
    existingSecretKey: password
  admin:
    existingSecretName: keycloak-admin
    existingSecretKey: password
  realm:
    import:
      enabled: true
      existingConfigMap: keycloak-realm-metaplatform
      realmName: metaplatform
  service:
    type: ClusterIP
    port: 8080
  probes:
    livenessPath: /health/live
    readinessPath: /health/ready

# -----------------------------------------------------------------------------
# Service templates (the four-layer application chart skeleton)
# -----------------------------------------------------------------------------
service-templates:
  enabled: true
  defaults:
    replicaCount: 2
    podDisruptionBudget:
      minAvailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    probes:
      livenessPath: /healthz
      readinessPath: /readyz
    otel:
      sidecar:
        enabled: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

# -----------------------------------------------------------------------------
# External chart switches (placeholders; Bitnami/Confluent charts to be added
# as umbrella dependencies once finalized).
# -----------------------------------------------------------------------------
postgresql:
  enabled: false
redis:
  enabled: false
# -----------------------------------------------------------------------------
# Kafka (G1) — KRaft 3-broker ensemble. Enabled by default per the
# PLATFORM-EVENT-01 Outbox pipeline (ADR-0013). Local dev scales down
# to 1 broker via values-local.yaml.
# -----------------------------------------------------------------------------
kafka:
  enabled: true
  fullnameOverride: kafka
  kraft:
    enabled: true
    clusterId: "metaplatform-kraft-cluster"
  replicaCount: 3
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  autoScaling:
    enabled: true
  tenantIsolation:
    enabled: true
    topicPrefix: "tenant"
  config:
    auto:
      create:
        topics:
          enable: "false"
    default:
      replication:
        factor: "3"
    num:
      partitions: "6"
    log:
      retention:
        hours: "72"
    compression:
      type: "producer"
    inter:
      broker:
        listener:
          names: "INTERNAL,CLIENT"
    advertised:
      listeners: "INTERNAL://kafka:9092,CLIENT://kafka:9092"
    listener:
      security:
        protocol:
          map: "INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT"
  service:
    type: ClusterIP
    ports:
      client: 9092
      internal: 9094
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
  networkPolicy:
    enabled: true
    allowedIngressNamespaces:
      - metaplatform
      - api-gateway
# -----------------------------------------------------------------------------
# Apache Paimon (C1) — streaming data lake storage (REST catalog server).
# Enabled by default per the CDC → data lake pipeline (ADR-0016 §3.1:
# D0 Debezium → Paimon tables). The catalog runs in filesystem mode
# with an S3-backed warehouse.
# -----------------------------------------------------------------------------
paimon:
  enabled: true
  fullnameOverride: paimon
  replicaCount: 2
  image:
    repository: apache/paimon
    tag: "0.8"
    pullPolicy: IfNotPresent
  catalog:
    mode: filesystem
    warehouse: "s3://mate-platform/data-lake"
    hive_metastore: ""
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
  tables:
    autoCreate: true
    formats: [orc, parquet]
    retention:
      enabled: true
      days: 90
  cdc:
    enabled: true
    debeziumConnector: "mate-platform-debezium"
    topics:
      prefix: "mate.cdc."
  tenantIsolation:
    enabled: true
    tablePrefix: "tenant_"
  service:
    type: ClusterIP
    port: 8081
  networkPolicy:
    enabled: true
    allowedIngressNamespaces:
      - metaplatform
prometheus:
  enabled: false
grafana:
  enabled: false
loki:
  enabled: false
tempo:
  enabled: false