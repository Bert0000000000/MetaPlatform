apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deerflow-engine.fullname" . }}
  labels:
    {{- include "deerflow-engine.labels" . | nindent 4 }}
  annotations:
    policy.description: |
      Non-secret DeerFlow configuration. LLM base URL / model and
      search provider are decoupled from the image layer. Secrets
      (LLM_API_KEY, SEARCH_API_KEY) live in a Secret referenced by
      the Deployment (hard rule 12).
data:
  # LLM endpoint (non-secret). The api key is in the Secret.
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}

  # Search provider (Tavily default). The api key is in the Secret.
  SEARCH_PROVIDER: {{ .Values.search.provider | quote }}
