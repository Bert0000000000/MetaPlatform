apiVersion: v1
kind: Service
metadata:
  name: {{ include "deerflow-engine.fullname" . }}
  labels:
    {{- include "deerflow-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: research-agent
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "deerflow-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: research-agent
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
