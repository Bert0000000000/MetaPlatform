apiVersion: v2
name: starrocks
description: |
  Apache StarRocks sub-chart (FE + BE) for high-concurrency OLAP serving.
  Pairs with the Trino + Iceberg sub-charts: Iceberg tables flow into
  StarRocks external catalogs and external tables; BI / reporting
  workloads query StarRocks instead of going through Trino. Implements
  the BI integration half of the v3.2-γ M-里程碑.

