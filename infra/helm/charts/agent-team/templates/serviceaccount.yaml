{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-team.serviceAccountName" . }}
  labels:
    {{- include "agent-team.labels" . | nindent 4 }}
#: 服务自己不需要跟 API server 说话 —— 不挂 token（最小权限）。
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.sandboxJob.enabled }}
---
#: B-8：沙箱 Job 的**独立** ServiceAccount（与服务那个分开）。
#: 不挂 token —— 沙箱里的代码拿不到 API server 的凭据，也就无法反过来
#: 去读本命名空间里的 Secret。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.sandboxJob.name }}
  labels:
    {{- include "agent-team.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.sandboxJob.name }}
automountServiceAccountToken: false
{{- end }}
