apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metaplatform.componentName" (dict "ctx" . "component" "keycloak") }}
  labels:
    {{- include "metaplatform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metaplatform.selectorLabels" . | nindent 6 }}
      component: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: metaplatform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: api-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432