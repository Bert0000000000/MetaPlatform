apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trino.fullname" . }}-worker
  labels:
    {{- include "trino.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "trino.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "trino.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: trino-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              cat > /etc/trino/config.properties <<EOF
              coordinator=false
              discovery.uri=http://{{ include "trino.fullname" . }}-coordinator:{{ .Values.service.httpPort }}
              http-server.http.port={{ .Values.service.httpPort }}
              EOF
              exec /usr/lib/trino/bin/run-trino server
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: etc
              mountPath: /etc/trino
      volumes:
        - name: tmp
          emptyDir: {}
        - name: etc
          emptyDir: {}