# =============================================================================
# Great Expectations sub-chart values
# =============================================================================
# Quality gate validation runner. Per ADR-0016 §3.1 + D3:
#   - PostgreSQL backend for the expectation store
#   - Per-tenant expectation scoping (SEC-TENANT-01 hard rule 3)
#   - DDL migration gate: failed expectations block migrations
#   - D3: Airflow integration (GE server pushes results to Airflow)
#   - NetworkPolicy default-deny + egress to postgresql (hard rule 13)
# =============================================================================

# Force the service DNS name to "ge" so the validation API is
# resolvable from the platform namespace.
fullnameOverride: ge

image:
  repository: great_expectations/great_expectations
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Postgres backend for the GE expectation store. The password is
# referenced via existingSecret (hard rule 12: never inline).
db:
  host: "postgresql"
  port: 5432
  database: great_expectations
  user: ge
  existingSecret: ge-db  # SealedSecret / ExternalSecret
  existingSecretKey: "password"

# Per-tenant scoping (SEC-TENANT-01 inheritance).
# Each app's expectations live in a per-tenant namespace, so a
# tenant's quality gates never see other tenants' schemas.
expectations:
  storagePerTenant: true
  defaultProfile: "metaplatform-default"

# D3 tenant-scoping block — explicit on/off switches for the
# per-tenant quality namespace. Inherits SEC-TENANT-01 hard rule 3.
tenantScoping:
  enabled: true
  storagePerTenant: true

# D3 default checkpoints — these are the canonical suites that every
# DDL migration / pipeline gate must pass. Each entry carries a
# ``blocking`` flag: blocking failures stop the Airflow DAG;
# non-blocking failures emit alerts only.
# See infra/helm/charts/ge/templates/dag-template.py for the DAG
# that runs these checkpoints.
checkpoints:
  - name: "tenant_id_not_null"
    domain: "iam"
    datasets: ["iam.user", "iam.role"]
    blocking: true
    description: "Critical: tenant_id column must never be NULL."
  - name: "tenant_id_matches_context"
    domain: "iam"
    datasets: ["iam.user"]
    blocking: true
    description: "Critical: tenant_id must match the request context."
  - name: "row_count_positive"
    domain: "iam"
    datasets: ["iam.user"]
    blocking: false
    description: "Non-blocking: dataset should have at least one row."
  - name: "schema_in_sync"
    domain: "data"
    datasets: ["data.lineage_node"]
    blocking: false
    description: "Non-blocking: schema matches the catalog definition."

# Validation runner schedule (CronJob-style cron expression).
# The runner polls the expectation store and re-validates datasets
# on a fixed cadence; DDL migrations trigger an immediate run.
schedule:
  cron: "0 */6 * * *"   # every 6 hours

# Airflow integration: GE server pushes expectation results to
# Airflow's metadata DB so DAGs can reference them. In v3.1, GE is
# the gate; failed expectations block DDL migrations in the same
# business transaction.
airflow:
  enabled: true
  backend: "kubernetes"
  namespace: "airflow"
  dagsPath: "/opt/airflow/dags"
  # Per-app expectations are emitted as Airflow Sensors.
  sensor:
    type: "GEExpectationSensor"
    pokeIntervalSeconds: 60

service:
  type: ClusterIP
  port: 8080

probes:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30

# NetworkPolicy — default-deny, egress to postgresql
# (hard rule 13). Ingress restricted to the platform namespace.
networkPolicy:
  enabled: true
  allowedIngressNamespaces:
    - metaplatform
  egress:
    postgresPort: 5432
