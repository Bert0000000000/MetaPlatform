apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postgresql.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgresql.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
      annotations:
        # Roll the pod when the ConfigMap changes (pool params etc.)
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: tcp-pg
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "postgresql.fullname" . }}
                  key: database-name
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "postgresql.fullname" . }}
                  key: database-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecretName }}
                  key: {{ .Values.database.existingSecretKey }}
            # MATE_DB_URL — consumed by mate-platform-backend SQLAlchemy
            # engine. The $(...) expansion is resolved by Kubernetes from
            # the same Secret, keeping the password out of the image layer
            # and out of git (hard rule 12).
            - name: MATE_DB_URL
              value: "postgresql://{{ .Values.database.username }}:$(POSTGRES_PASSWORD)@{{ include "postgresql.fullname" . }}:{{ .Values.service.port }}/{{ .Values.database.name }}"
            # Pool parameters from ConfigMap (explicit key refs so env var
            # names follow UPPER_SNAKE convention; envFrom would produce
            # hyphenated names like pool-size which are non-standard).
            - name: POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "postgresql.fullname" . }}
                  key: pool-size
            - name: MAX_OVERFLOW
              valueFrom:
                configMapKeyRef:
                  name: {{ include "postgresql.fullname" . }}
                  key: max-overflow
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U {{ .Values.database.username }} -d {{ .Values.database.name }} -h 127.0.0.1 -p 5432"
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U {{ .Values.database.username }} -d {{ .Values.database.name }} -h 127.0.0.1 -p 5432"
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgresql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "postgresql.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
  {{- end }}
