{{- if .Values.sealedSecret.enabled }}
{{/*
  Hard rule 12: Secret must not enter git.

  This SealedSecret is a PLACEHOLDER template. The encryptedData
  below is NOT real — it must be regenerated with kubeseal before
  applying to any cluster.  The template exists so that:
    1. `helm template` produces a valid SealedSecret skeleton.
    2. Operators know exactly which keys the chart expects.

  To generate the real SealedSecret:

    # 1. Create a Kubernetes Secret manifest locally (never commit it):
    cat <<'EOF' > /tmp/pg-secret.yaml
    apiVersion: v1
    kind: Secret
    metadata:
      name: postgresql-credentials
      namespace: metaplatform
    type: Opaque
    stringData:
      password: "<your-strong-password>"
      mate-db-url: "postgresql://meta:<your-strong-password>@postgresql:5432/metaplatform"
    EOF

    # 2. Seal it with kubeseal (requires cluster access):
    kubeseal --format yaml \
      --controller-namespace kube-system \
      < /tmp/pg-secret.yaml \
      > infra/helm/charts/postgresql/templates/sealedsecret.yaml

    # 3. Shred the local plaintext file:
    shred -u /tmp/pg-secret.yaml

  After sealing, replace this file with the kubeseal output.  The
  encryptedData will be decryptable only by the SealedSecret
  controller in the target cluster.
*/}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.database.existingSecretName }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    # PLACEHOLDER — replace with kubeseal output (see comment above).
    password: 
    # PLACEHOLDER — full MATE_DB_URL for mate-platform-backend.
    mate-db-url: 
  template:
    metadata:
      name: {{ .Values.database.existingSecretName }}
      labels:
        {{- include "postgresql.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
