apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "iceberg.fullname" . }}
  labels:
    {{- include "iceberg.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "iceberg.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "iceberg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iceberg.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: catalog
      annotations:
        # Roll the pod when the ConfigMap changes (catalog tuning).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: iceberg
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: rest
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: ICEBERG_CATALOG_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "iceberg.fullname" . }}
                  key: catalog-mode
            - name: ICEBERG_WAREHOUSE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "iceberg.fullname" . }}
                  key: warehouse
            {{- if .Values.catalog.hive_metastore }}
            - name: ICEBERG_HIVE_METASTORE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "iceberg.fullname" . }}
                  key: hive-metastore
            {{- end }}
            - name: ICEBERG_TABLES_AUTO_CREATE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "iceberg.fullname" . }}
                  key: tables-auto-create
            - name: ICEBERG_TABLES_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "iceberg.fullname" . }}
                  key: tables-format
            {{- if .Values.tenantIsolation.enabled }}
            - name: ICEBERG_TENANT_ISOLATION_ENABLED
              value: "true"
            - name: ICEBERG_TENANT_TABLE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "iceberg.fullname" . }}
                  key: tenant-table-prefix
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: rest
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: rest
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/iceberg/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "iceberg.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
  {{- end }}