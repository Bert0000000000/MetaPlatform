apiVersion: v1
kind: Service
metadata:
  name: {{ include "debezium.fullname" . }}
  labels:
    {{- include "debezium.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http-api
      port: {{ .Values.service.port }}
      targetPort: http-api
      protocol: TCP
  selector:
    {{- include "debezium.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cdc
