'# DataHub chart - DATA-D0-D8 D4 expansion
image:
  repository: acryldata/datahub-gms
  tag: "0.13.0"
  pullPolicy: IfNotPresent
replicaCount: 1
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi
tenant:
  partitionByCorpGroup: true
  defaultDomain: "metaplatform"
dataProducts:
  enabled: true
  versioning: "semver"
  sloan:
    defaultTemplate: "metaplatform-default"
ingest:
  kafkaConnect:
    enabled: true
    bootstrapServers: "kafka:9092"
    topics:
      - "metaplatform.*.*.*.cdc"
      - "metaplatform.*.*.*.event"
  mceConsumer:
    enabled: true
# D4: OpenLineage <-> DataHub sync
lineage:
  enabled: true
  source: "marquez"
  marquezUrl: "http://marquez.metaplatform.svc.cluster.local:5000"
  pullIntervalSeconds: 30
  openlineageVersion: "1.0.0"
service:
  type: ClusterIP
  gms:
    port: 8080
  mceConsumer:
    port: 9090
  maeConsumer:
    port: 9091
'