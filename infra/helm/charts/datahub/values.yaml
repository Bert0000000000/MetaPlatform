# DataHub chart - DATA-D0-D8 D2 expansion
# (D0 was a stub; D2 turns it on with DataProduct CRD + ingest pipeline)
image:
  repository: acryldata/datahub-gms
  tag: "0.13.0"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# Per-tenant scoping (SEC-TENANT-01 inheritance).
tenant:
  partitionByCorpGroup: true
  defaultDomain: "metaplatform"

# DataProduct definition (the v3.1 shape).
# A DataProduct is a curated collection of datasets with ownership,
# versioning, and SLAs. In v3.1, every DataProduct belongs to a
# tenant (corp-group) and has a schema contract.
dataProducts:
  enabled: true
  versioning: "semver"  # major.minor.patch
  sloan:
    defaultTemplate: "metaplatform-default"

# Ingest pipeline: pulls from Kafka topics (PLATFORM-EVENT-01
# events) and pushes into DataHub via the metadata ingestion API.
# Per-tenant partition = per-tenant DataHub corp-group.
ingest:
  kafkaConnect:
    enabled: true
    bootstrapServers: "kafka:9092"
    topics:
      # The 17-domain topic convention per PLATFORM-EVENT-01.
      - "metaplatform.*.*.*.cdc"
      - "metaplatform.*.*.*.event"
  mceConsumer:
    enabled: true

service:
  type: ClusterIP
  gms:
    port: 8080
  mceConsumer:
    port: 9090
  maeConsumer:
    port: 9091