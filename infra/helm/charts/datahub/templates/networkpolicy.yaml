{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "datahub.fullname" . }}
  labels:
    {{- include "datahub.labels" . | nindent 4 }}
  annotations:
    policy.description: |
      Default-deny for DataHub GMS (catalog) pods. Ingress restricted
      to the platform namespace on port 8080 (GMS REST API); egress
      restricted to DNS, Kafka (9092) for MCE/MAE ingest, Neo4j
      (7687) for the metadata graph, and Elasticsearch (9200) for
      search. Enforces hard rule 13 (NetworkPolicy default-deny =
      prod-blocking when absent).
spec:
  podSelector:
    matchLabels:
      {{- include "datahub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: catalog
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # GMS REST API from the platform namespace.
    - from:
        {{- range .Values.networkPolicy.allowedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.gms.port }}
  egress:
    # DNS resolution (kube-system CoreDNS).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kafka ingest (MCE / MAE consumers).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.kafkaPort }}
{{- end }}
