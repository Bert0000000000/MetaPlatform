# =============================================================================
# Kafka sub-chart values
# =============================================================================
# Closes the PLATFORM-K8S-01 / PLATFORM-EVENT-01 placeholder. The
# real chart here is Bitnami's `kafka:28.x.x`; we just tune the
# values for the four-layer metaplatform workload.
# =============================================================================

# Force the service DNS name to "kafka" so PLATFORM-EVENT-01
# producers / consumers resolve bootstrap servers consistently.
fullnameOverride: kafka

image:
  registry: docker.io
  repository: bitnami/kafka
  tag: 3.7.1
  pullPolicy: IfNotPresent

# KRaft mode (no Zookeeper). PLAINTEXT in dev / SASL_SSL in prod.
kraft:
  enabled: true
  clusterId: "metaplatform-kraft-cluster"

# G1: 3-broker KRaft ensemble (combined controller+broker) as the
# production-grade default. Local dev overrides to 1 via
# values-local.yaml.
replicaCount: 3

# G1: 2Gi memory / 1 CPU requests; production override is 4Gi / 2 CPU
# (values-production.yaml).
resources:
  requests:
    cpu: 1
    memory: 2Gi
  limits:
    cpu: 2
    memory: 4Gi

# G1: PVC-backed persistence (50Gi default). Local dev overrides to
# emptyDir via values-local.yaml (persistence.enabled: false).
persistence:
  enabled: true
  size: 50Gi
  storageClass: ""     # "" = cluster default StorageClass

# G1: resource governance — requests/limits declared so the scheduler
# can place pods and HPA/KEDA can reference them. Kafka brokers are
# not horizontally auto-scaled (adding brokers requires partition
# reassignment); this flag asserts that resource governance is ON.
autoScaling:
  enabled: true

# Producer / consumer defaults.
config:
  auto.create.topics.enable: "false"   # topics are explicit (PLATFORM-EVENT-01)
  default.replication.factor: "1"      # 3 in production
  num.partitions: "6"
  log.retention.hours: "72"
  compression.type: "producer"
  inter.broker.listener.names: "INTERNAL,CLIENT"
  advertised.listeners: "INTERNAL://kafka:9092,CLIENT://kafka:9092"
  listener.security.protocol.map: "INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT"

# 17-domain topic declarations. PLATFORM-EVENT-01 publish path
# resolves topics from event.type + tenant_id; this list is the
# boot-time pre-create so first-event latency is zero.
topics:
  preCreate: true
  domains:
    - name: iam
      partitions: 3
    - name: msg
      partitions: 6
    - name: obs
      partitions: 3
    - name: mcp
      partitions: 3
    - name: llmgw
      partitions: 6
    - name: ont
      partitions: 3
    - name: rag
      partitions: 6
    - name: agent
      partitions: 6
    - name: data
      partitions: 3
    - name: kb
      partitions: 3
    - name: copilot
      partitions: 3
    - name: dw
      partitions: 3
    - name: apphub
      partitions: 3
    - name: arch
      partitions: 3
    - name: wfe
      partitions: 3
    - name: a2a
      partitions: 3
    - name: dashboard
      partitions: 3

# G1: tenant isolation — each tenant gets an independent topic prefix
# so cross-tenant event streams are namespaced at the broker level.
# The application layer (SEC-TENANT-01 kafka_tenant.py) resolves the
# full topic name as: <topicPrefix>.<tenant_id>.<domain>.<event>.
tenantIsolation:
  enabled: true
  topicPrefix: "tenant"

service:
  type: ClusterIP
  ports:
    client: 9092
    internal: 9094

# Schema Registry (Confluent 7.6) — required by PLATFORM-EVENT-01
# schema_id_for() path.
schemaRegistry:
  enabled: true
  image:
    repository: confluentinc/cp-schema-registry
    tag: "7.6.1"
  service:
    type: ClusterIP
    port: 8081

# ZooKeeper — only used when kraft.enabled is false. Provides a
# fallback for environments that cannot run KRaft (older Kafka <
# 3.3 or organisational policy). The chart prefers KRaft.
zookeeper:
  replicaCount: 1     # 3 in production if ZooKeeper mode is used
  image:
    registry: docker.io
    repository: bitnami/zookeeper
    tag: 3.9.2
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: false
    size: 4Gi
    storageClass: ""

# Probes — TCP socket on the client port.
probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30

# NetworkPolicy — default-deny, only platform namespace can reach
# Kafka on 9092 (hard rule 13).
networkPolicy:
  enabled: true
  allowedIngressNamespaces:
    - metaplatform
    - api-gateway
