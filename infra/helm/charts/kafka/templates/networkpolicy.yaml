apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # any pod in metaplatform can talk to Kafka on 9092.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: metaplatform
      ports:
        - protocol: TCP
          port: 9092
    # schema registry on 8081.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: metaplatform
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53