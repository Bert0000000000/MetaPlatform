{{- if .Values.allowedEgress.dataPlane.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metaplatform.componentName" (dict "ctx" . "component" "network-policies") }}-allow-dataplane
  labels:
    {{- include "metaplatform.labels" . | nindent 4 }}
  annotations:
    policy.description: Allow egress to Postgres / Redis / Kafka in the metaplatform namespace.
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    {{- range .Values.allowedEgress.dataPlane.targets }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name }}
      ports:
        - protocol: {{ .protocol }}
          port: {{ .port }}
    {{- end }}
{{- end }}