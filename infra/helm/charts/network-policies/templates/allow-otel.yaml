{{- if .Values.allowedEgress.otelCollector.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metaplatform.componentName" (dict "ctx" . "component" "network-policies") }}-allow-egress-otel
  labels:
    {{- include "metaplatform.labels" . | nindent 4 }}
  annotations:
    policy.description: Allow pods to push traces/metrics/logs to the OTel collector.
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: {{ .Values.allowedEgress.otelCollector.port }}
        - protocol: TCP
          port: 4318
{{- end }}