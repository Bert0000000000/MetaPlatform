{{- if .Values.allowedIngress.apiGateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metaplatform.componentName" (dict "ctx" . "component" "network-policies") }}-allow-ingress-api-gateway
  labels:
    {{- include "metaplatform.labels" . | nindent 4 }}
  annotations:
    policy.description: Allow ingress from the api-gateway namespace.
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.allowedIngress.apiGateway.fromNamespace }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if .Values.controlPlaneIngress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metaplatform.componentName" (dict "ctx" . "component" "network-policies") }}-allow-ingress-control-plane
  labels:
    {{- include "metaplatform.labels" . | nindent 4 }}
  annotations:
    policy.description: Allow ingress from the control plane (Argo CD / kubectl).
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.controlPlaneIngress.namespace }}
      ports:
        {{- range .Values.controlPlaneIngress.ports }}
        - protocol: {{ .protocol }}
          port: {{ .port }}
        {{- end }}
{{- end }}