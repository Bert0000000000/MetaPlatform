# network-policies sub-chart values
defaultDeny:
  ingress: true
  egress: true

allowedEgress:
  dns:
    enabled: true
    namespace: kube-system
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  keycloak:
    enabled: true
    namespace: metaplatform
    port: 8080
  otelCollector:
    enabled: true
    namespace: metaplatform
    port: 4317
  dataPlane:
    enabled: true
    namespace: metaplatform
    targets:
      - name: postgres
        port: 5432
        protocol: TCP
      - name: redis
        port: 6379
        protocol: TCP
      - name: kafka
        port: 9092
        protocol: TCP

allowedIngress:
  apiGateway:
    enabled: true
    fromNamespace: api-gateway
    fromPodSelector: {}

# Additional explicit allow: control plane (Argo CD / kubectl)
controlPlaneIngress:
  enabled: true
  namespace: argocd
  ports:
    - protocol: TCP
      port: 8080