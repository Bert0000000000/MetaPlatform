apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketplace.fullname" . }}-api
  labels:
    {{- include "marketplace.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "marketplace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP