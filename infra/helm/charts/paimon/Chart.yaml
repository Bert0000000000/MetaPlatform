apiVersion: v2
name: paimon
description: |
  Apache Paimon streaming data lake storage. Provides the REST
  catalog server consumed by Flink / Spark table store workloads
  and the CDC → data lake pipeline (D0 Debezium → Paimon tables).
  Supports Iceberg-compatible table format and S3-backed warehouse.

