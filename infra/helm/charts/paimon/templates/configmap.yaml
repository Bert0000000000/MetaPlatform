apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paimon.fullname" . }}
  labels:
    {{- include "paimon.labels" . | nindent 4 }}
  annotations:
    policy.description: |
      Non-sensitive Paimon catalog configuration. Consumed by the
      StatefulSet via configMapKeyRef so catalog mode, warehouse
      location, table defaults and CDC integration are decoupled
      from the image layer.
data:
  # Catalog mode (filesystem | hive | jdbc) + warehouse location.
  catalog-mode: {{ .Values.catalog.mode | quote }}
  warehouse: {{ .Values.catalog.warehouse | quote }}
  {{- if .Values.catalog.hive_metastore }}
  hive-metastore: {{ .Values.catalog.hive_metastore | quote }}
  {{- end }}

  # Data lake table defaults.
  tables-auto-create: {{ .Values.tables.autoCreate | quote }}
  tables-formats: {{ join "," .Values.tables.formats | quote }}
  retention-enabled: {{ .Values.tables.retention.enabled | quote }}
  retention-days: {{ .Values.tables.retention.days | quote }}

  # CDC integration (Debezium → Paimon lake tables).
  {{- if .Values.cdc.enabled }}
  cdc-enabled: "true"
  cdc-debezium-connector: {{ .Values.cdc.debeziumConnector | quote }}
  cdc-topics-prefix: {{ .Values.cdc.topics.prefix | quote }}
  {{- end }}

  # C1: tenant isolation — per-tenant table prefix. The application
  # layer resolves full lake table names from this prefix + tenant_id.
  {{- if .Values.tenantIsolation.enabled }}
  tenant-isolation-enabled: "true"
  tenant-table-prefix: {{ .Values.tenantIsolation.tablePrefix | quote }}
  {{- end }}
