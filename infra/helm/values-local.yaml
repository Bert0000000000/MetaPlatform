# Local environment overrides (developer machine, kind cluster, single node)
global:
  labels:
    environment: local
otel-collector:
  replicaCount: 1
  receivers:
    kafkametrics:
      enabled: true
    postgresql:
      enabled: true
    redis:
      enabled: true
  processors:
    tailSampling:
      enabled: true
keycloak:
  replicas: 1
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: keycloak.localhost
        paths: [/]
postgres:
  enabled: true
redis:
  enabled: true
kafka:
  enabled: true
  mode: kraft
prometheus:
  enabled: true
grafana:
  enabled: true
loki:
  enabled: true
tempo:
  enabled: true