# Staging environment overrides
global:
  labels:
    environment: staging
otel-collector:
  replicaCount: 2
  receivers:
    kafkametrics:
      enabled: true
    postgresql:
      enabled: true
    redis:
      enabled: true
  processors:
    tailSampling:
      enabled: true
keycloak:
  replicas: 2
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: keycloak.staging.metaplatform.io
        paths: [/]
    tls:
      - secretName: keycloak-tls
        hosts: [keycloak.staging.metaplatform.io]
postgresql:
  enabled: true
redis:
  enabled: true
kafka:
  enabled: true
  fullnameOverride: kafka
  kraft:
    enabled: true
    clusterId: "metaplatform-kraft-cluster-staging"
  replicaCount: 2
  persistence:
    enabled: true
    size: 15Gi
    storageClass: ""
  config:
    auto.create.topics.enable: "false"
    default.replication.factor: "2"
    num.partitions: "6"
    log.retention.hours: "72"
    compression.type: "producer"
  networkPolicy:
    enabled: true
    allowedIngressNamespaces:
      - metaplatform
      - api-gateway
prometheus:
  enabled: true
grafana:
  enabled: true
loki:
  enabled: true
tempo:
  enabled: true