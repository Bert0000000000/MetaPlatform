# Production environment overrides
global:
  labels:
    environment: production
otel-collector:
  replicaCount: 3
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  receivers:
    kafkametrics:
      enabled: true
    postgresql:
      enabled: true
    redis:
      enabled: true
  processors:
    tailSampling:
      enabled: true
keycloak:
  replicas: 3
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: auth.metaplatform.io
        paths: [/]
    tls:
      - secretName: keycloak-prod-tls
        hosts: [auth.metaplatform.io]
postgresql:
  enabled: true
  fullnameOverride: postgresql
  replicaCount: 2
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  pool:
    size: 20
    maxOverflow: 40
redis:
  enabled: true
kafka:
  enabled: true
  fullnameOverride: kafka
  kraft:
    enabled: true
    clusterId: "metaplatform-kraft-cluster-prod"
  replicaCount: 3
  persistence:
    enabled: true
    size: 30Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  config:
    auto.create.topics.enable: "false"
    default.replication.factor: "3"
    num.partitions: "6"
    log.retention.hours: "168"
    compression.type: "producer"
    inter.broker.listener.names: "INTERNAL,CLIENT"
    advertised.listeners: "INTERNAL://kafka:9092,CLIENT://kafka:9092"
    listener.security.protocol.map: "INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT"
  zookeeper:
    replicaCount: 3
    persistence:
      enabled: true
      size: 8Gi
  networkPolicy:
    enabled: true
    allowedIngressNamespaces:
      - metaplatform
      - api-gateway
prometheus:
  enabled: true
grafana:
  enabled: true
loki:
  enabled: true
tempo:
  enabled: true