# Production environment overrides
global:
  labels:
    environment: production
otel-collector:
  replicaCount: 3
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  receivers:
    kafkametrics:
      enabled: true
    postgresql:
      enabled: true
    redis:
      enabled: true
  processors:
    tailSampling:
      enabled: true
keycloak:
  replicas: 3
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: auth.metaplatform.io
        paths: [/]
    tls:
      - secretName: keycloak-prod-tls
        hosts: [auth.metaplatform.io]
postgresql:
  enabled: true
  fullnameOverride: postgresql
  replicaCount: 2
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  pool:
    size: 20
    maxOverflow: 40
redis:
  enabled: true
kafka:
  enabled: true
  mode: kraft
prometheus:
  enabled: true
grafana:
  enabled: true
loki:
  enabled: true
tempo:
  enabled: true