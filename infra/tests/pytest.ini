[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    helm: marks tests that require the helm binary
    kubectl: marks tests that require a kubectl / kube context
filterwarnings =
    ignore::DeprecationWarning