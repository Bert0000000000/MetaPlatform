[project]
name = "mate-api-gateway"
version = "0.1.0"
description = "Mate Platform - API Gateway (L7 routing + aggregation + Redis rate limiting)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Mate Platform Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "pybreaker>=1.2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "mate-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mate_api_gateway"]

[tool.uv.sources]
mate-common = { workspace = true }