server:
  port: 8901

spring:
  application:
    name: tech-rag
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/metaplatform_rag?stringtype=varchar
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_jdbc_type_code_for_string: 12
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tech-rag
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: metaplatform
        # Nacos 3.0+ gRPC 端口
        grpc-port: 9848
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        # Nacos 3.0+ Config 走 9849
        grpc-port: 9849
        namespace: metaplatform
        file-extension: yaml
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

spring.ai:
  alibaba:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-placeholder}
      embedding:
        options:
          model: text-embedding-v3
  vectorstore:
    milvus:
      client:
        host: ${MILVUS_HOST:localhost}
        port: ${MILVUS_PORT:19530}
      database-name: default
      collection-name: rag_chunks
      embedding-dimension: 1024
      index-type: IVF_FLAT
      metric-type: COSINE

rag:
  chunk:
    default-size: 512
    default-overlap: 50
  retrieval:
    default-top-k: 5
    default-score-threshold: 0.7

logging:
  level:
    com.metaplatform.rag: DEBUG
    org.springframework.cloud: INFO
