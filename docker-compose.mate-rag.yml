# =============================================================================
# Dev overlay - 绑定本地源码 + 启用 uvicorn --reload + 暴露 debugpy
# -----------------------------------------------------------------------------
# 用法:
#   docker compose -f docker-compose.yml -f docker-compose.mate-rag.yml up -d
#
# 工作原理:
#   1. 把 host 源码 bind 到 /app/dev/<pkg> (新路径)
#   2. PYTHONPATH=/app/dev 让 Python 优先从 host 加载 (override venv 内版本)
#   3. uvicorn --reload-dir /app/dev/<pkg> 监听 host 修改
#   4. 关闭 restart, 关闭 resource limits, debugpy 5678
# =============================================================================

services:
  # ---------- 三个原有 app 服务 (rag/agent/app-kb) ----------
  mate-tech-rag:
    volumes:
      - ./mate-platform-backend/packages/mate-tech-rag/src/mate_tech_rag:/app/dev/mate_tech_rag:rw
      - ./mate-platform-backend/packages/mate-common/src/mate_common:/app/dev/mate_common:rw
    environment:
      PYTHONPATH: /app/dev
    command: >
      uvicorn mate_tech_rag.api.app:app
        --host 0.0.0.0 --port 8001
        --reload --reload-dir /app/dev/mate_tech_rag
    ports:
      - "5678:5678"
    restart: "no"
    deploy: { resources: { limits: {} } }

  mate-tech-agent:
    volumes:
