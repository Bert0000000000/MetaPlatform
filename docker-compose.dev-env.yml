# Development environment override: enable LEGACY_LOGIN_COMPAT
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev-env.yml up -d
#
# This adds LEGACY_LOGIN_COMPAT + INSECURE_SKIP_SIGNATURE + KEYCLOAK_URL
# to all application services so they can start and accept HS256 JWT tokens
# generated by the local IAM login (without a fully configured Keycloak realm).

services:
  mate-tech-iam:
    environment:
      LEGACY_LOGIN_COMPAT: "true"
      INSECURE_SKIP_SIGNATURE: "true"
      KEYCLOAK_URL: http://keycloak:8080
  mate-app-kb:
    environment:
      LEGACY_LOGIN_COMPAT: "true"
      INSECURE_SKIP_SIGNATURE: "true"
      KEYCLOAK_URL: http://keycloak:8080
  mate-tech-rag:
    environment:
      LEGACY_LOGIN_COMPAT: "true"
      INSECURE_SKIP_SIGNATURE: "true"
      KEYCLOAK_URL: http://keycloak:8080
  mate-tech-agent:
    environment:
      LEGACY_LOGIN_COMPAT: "true"
      INSECURE_SKIP_SIGNATURE: "true"
      KEYCLOAK_URL: http://keycloak:8080
  mate-tech-mcp:
