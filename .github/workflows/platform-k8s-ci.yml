name: platform-k8s-ci

on:
  push:
    branches: [main, codex/**]
    paths:
      - "infra/helm/**"
      - "infra/tests/**"
      - ".github/workflows/platform-k8s-ci.yml"
  pull_request:
    branches: [main, codex/**]
    paths:
      - "infra/helm/**"
      - "infra/tests/**"
      - ".github/workflows/platform-k8s-ci.yml"

permissions:
  contents: read

jobs:
  static-checks:
    name: Static chart checks (Python + YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pytest + pyyaml
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruff

      - name: Run infra pytest suite
        working-directory: ${{ github.workspace }}/infra/tests
        run: pytest -v --tb=short

      - name: Ruff lint
        working-directory: ${{ github.workspace }}/infra/tests
        run: |
          ruff check . || (echo "::error::ruff failed" && exit 1)

      - name: Pyright strict
        uses: jakebailey/pyright-action@v3
        with:
          pythonversion: "3.12"
          project: infra/tests
          strict: ["infra/tests"]

  helm-lint:
    name: helm lint (umbrella + sub-charts)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: helm dependency update
        working-directory: ${{ github.workspace }}/infra/helm
        run: helm dependency update

      - name: helm lint (umbrella, default values)
        working-directory: ${{ github.workspace }}/infra/helm
        run: helm lint .

      - name: helm lint (per-environment values)
        working-directory: ${{ github.workspace }}/infra/helm
        run: |
          for env in local staging production; do
            echo "=== $env ==="
            helm lint . -f values-$env.yaml
          done

  helm-template:
    name: helm template + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: Install kubeconform
        run: |
          curl -sSLO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: helm dependency update
        working-directory: ${{ github.workspace }}/infra/helm
        run: helm dependency update

      - name: helm template (per-environment)
        working-directory: ${{ github.workspace }}/infra/helm
        run: |
          mkdir -p /tmp/rendered
          for env in local staging production; do
            echo "=== rendering $env ==="
            helm template metaplatform . -f values-$env.yaml > /tmp/rendered/$env.yaml
            wc -l /tmp/rendered/$env.yaml
          done

      - name: kubeconform (Kubernetes 1.29 strict)
        run: |
          for env in local staging production; do
            echo "=== kubeconform $env ==="
            kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/rendered/$env.yaml
          done

  helm-unittest:
    name: helm-unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: Install helm-unittest
        run: |
          helm plugin install https://github.com/quintush/helm-unittest --version 0.7.2

      - name: Run helm-unittest
        working-directory: ${{ github.workspace }}/infra/helm
        run: |
          for chart in charts/*/; do
            echo "=== $chart ==="
            helm unittest "$chart" || (echo "::error::$chart unittest failed" && exit 1)
          done

  helm-docs:
    name: helm-docs sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install helm-docs
        run: |
          curl -sSLO https://github.com/norwoodj/helm-docs/releases/latest/download/helm-docs_Linux_x86_64.tar.gz
          tar xf helm-docs_Linux_x86_64.tar.gz
          sudo mv helm-docs /usr/local/bin/

      - name: Verify README sync
        working-directory: ${{ github.workspace }}/infra/helm
        run: |
          helm-docs --dry-run --sort-values-order=file || (
            echo "::error::README.md is out of sync with values.yaml. Run: helm-docs"
            exit 1
          )