name: ga-acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, codex/**]
    paths:
      - ".github/workflows/ga-acceptance.yml"
      - "infra/helm/**"
      - "infra/tests/**"
      - "mate-platform-backend/**"
      - "scripts/ci/**"
      - ".pre-commit-config.yaml"
  pull_request:
    branches: [main, codex/**]
    # **刻意不加 `paths:` 过滤**（A-5 收紧 required 的前提，同 1.7 对
    # `python-ci.yml` 的处理）：本工作流的 `agent-team pytest` 与
    # `ga-014 Ontology RLS` 是 `main` 的 required check。工作流级的 `paths:`
    # 会让不碰后端/脚本的 PR **根本不触发本工作流**——那两个 required check
    # 于是永远停在 "Expected — Waiting for status to be reported"，PR 永久卡
    # 在 pending（连只改文档的 PR 也一样）。代价是文档类 PR 也跑一遍
    # （缓存命中后几分钟），用"永远 pending"换它不值。

permissions:
  contents: read

# Cancel in-progress runs on the same branch.
concurrency:
  group: ga-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # rule 6: 静态检查 ruff + pyright strict
  ga-006-static:
    name: ga-006 ruff + pyright strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pyright httpx pydantic fastapi pydantic-settings sqlalchemy structlog
      - run: ruff check mate-platform-backend
      # pyright 必须在 mate-platform-backend 目录内运行以读取 pyrightconfig.json
      # （strict + extraPaths 跨包解析 + reportMissingImports=none 策略）
      - run: pyright packages/mate-platform/src packages/mate-clients/src
        working-directory: mate-platform-backend

  # rule 9: OTel / observability smoke
  ga-009-observability:
    name: ga-009 OTel collector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Render OTel configmap and verify otlp
        run: |
          helm template metaplatform infra/helm -f infra/helm/values-local.yaml \
            > /tmp/rendered.yaml
          grep -q "otlp/grpc" /tmp/rendered.yaml && echo "OK: otlp/grpc receiver present" || (echo "FAIL: otlp/grpc missing"; exit 1)

  # rule 11: helm-docs sync
  ga-011-helm-docs:
    name: ga-011 helm-docs --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o /tmp/helm-docs.tar.gz https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar xf /tmp/helm-docs.tar.gz
          sudo mv helm-docs /usr/local/bin/
      - run: |
          cd infra/helm
          helm-docs --dry-run --sort-values-order=file || (echo "::error::README.md is out of sync with values.yaml" && exit 1)

  # rule 12: secret 扫描 (gitleaks, custom .gitleaks.toml extends default)
  ga-012-secret-scan:
    name: ga-012 gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action auto-detects .gitleaks.toml at the repo root.
      # The config extends the built-in default ruleset and adds
      # Mate-Platform-specific rules (JWT / AWS / GitHub / PEM).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # rule 1: OpenAPI oasdiff
  ga-001-openapi:
    name: ga-001 oasdiff (no unapproved breaking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract base spec
        run: |
          mkdir -p .ci
          git show origin/main:mate-platform-backend/contracts/openapi/generated/bundled.yaml > .ci/base.yaml 2>/dev/null || echo "{}" > .ci/base.yaml
      - uses: oasdiff/oasdiff-action/breaking@v0.1.11
        with:
          base: .ci/base.yaml
          revision: mate-platform-backend/contracts/openapi/generated/bundled.yaml
          fail-on: "ERR"

  # rule 8: helm template + kubeconform
  ga-008-helm:
    name: ga-008 helm lint + kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.14.4 }
      - run: |
          curl -sSLO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: helm lint (per env)
        run: |
          cd infra/helm
          for env in local staging production; do
            echo "=== $env ==="
            helm lint . -f values-$env.yaml
          done
      - name: helm template + kubeconform
        run: |
          mkdir -p /tmp/rendered
          for env in local staging production; do
            echo "=== $env ==="
            helm template metaplatform infra/helm -f infra/helm/values-$env.yaml > /tmp/rendered/$env.yaml
            kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0 /tmp/rendered/$env.yaml
          done

  # rule 13: NetworkPolicy 完整 (default-deny + 显式 allow)
  ga-013-networkpolicy:
    name: ga-013 NetworkPolicy service coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.14.4 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: |
          for env in local staging production; do
            echo "=== $env ==="
            helm template metaplatform infra/helm \
              -f infra/helm/values-$env.yaml > /tmp/rendered-$env.yaml
            python scripts/ci/validate_networkpolicy_coverage.py \
              --rendered /tmp/rendered-$env.yaml
          done

  # rule 3: 没有 tenant 上下文，不访问 repository（forbid_raw_sql）
  ga-003-tenant:
    name: ga-003 forbid_raw_sql (rule 3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pre-commit
      - run: python scripts/ci/forbid_raw_sql.py

  # rule 4: 外部系统没有 ACL Client（forbid_bare_httpx）
  ga-004-acl:
    name: ga-004 forbid_bare_httpx (rule 4)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pre-commit
      - run: python scripts/ci/forbid_bare_httpx.py

  # rule 5: Production profile 禁止 fallback（forbid_legacy_fallback）
  ga-005-fallback:
    name: ga-005 forbid_legacy_fallback (rule 5)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pre-commit
      - run: python scripts/ci/forbid_legacy_fallback.py

  # rule 3 + 4 + 5 + 7 + 10 + 12：**格式门禁单独成一个 job**（A-5 / MP-MAIN-GATE-01）。
  #
  # 为什么必须拆开：原先格式检查与功能测试在**同一个 job 的相邻 step** 里，
  # 于是 pre-commit 一红（`main` 上就是被 `CLAUDE.md` 的 Prettier 卡住的），
  # 后面 4 个 step 全部 `skipped` —— 其中一条是
  # `mate-platform/tests (SEC-IAM-01 + SEC-TENANT-01 + PLATFORM-EVENT-01)`。
  # 结果是：**格式红灯把真正的 GA 回归测试整条吞掉了**，而看板只显示"一个 job 红了"。
  #
  # 拆开之后两条独立：格式红灯**照样拦合并**（它是 required check），
  # 但功能验收的结论**一定拿得到**（跑或红，不会"因为前面红了所以没跑"）。
  ga-format:
    name: "ga format (pre-commit: rules 3 / 4 / 5 / 7 / 10 / 12)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install pre-commit
        run: python -m pip install pre-commit
      - name: pre-commit run --all-files (rules 3 / 4 / 5 / 7 / 10 / 12)
        # SKIP=no-commit-to-branch：--all-files 模式下该 hook 对 main 直推工作流误报
        # （分支保护由 GitHub 分支规则 + ga-010 证据链承担）
        run: SKIP=no-commit-to-branch pre-commit run --all-files

  # 功能验收：**与格式门禁无依赖**（`needs:` 一个都不写）。
  # 谁在前面红都不该让这里变成 skipped —— 那正是拆分要保住的东西。
  ga-tests:
    name: ga tests (infra + mate-platform + mate-app-kb + governance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install uv + pytest
        run: python -m pip install uv pytest pytest-asyncio pyyaml sqlalchemy pydantic httpx structlog fastapi tenacity pyjwt python-multipart opentelemetry-api opentelemetry-sdk temporalio alembic
      # 依赖闭包一次性安装：uv sync --frozen 从 workspace 锁文件解全部
      # runtime+dev 依赖（手工 pip 清单连续 6 轮暴露缺口：fastapi→pyjwt→
      # otel→temporalio→alembic…），与 ga-014 同一验证过的路径
      - name: sync workspace deps (frozen, complete closure)
        run: uv sync --directory mate-platform-backend --package mate-platform --package mate-app-kb --dev --frozen
      - name: infra/tests (PLATFORM-K8S-01 regression, rule 8 contract)
        run: pytest -q
        working-directory: infra/tests
      # 后端两套件走 uv venv（完整闭包；系统 pip 只保 infra tests）
      - name: mate-platform/tests (SEC-IAM-01 + SEC-TENANT-01 + PLATFORM-EVENT-01)
        run: uv run --directory mate-platform-backend/packages/mate-platform pytest -q
      - name: mate-app-kb/tests (TECH-SERVICES canonical)
        run: pytest -q
        working-directory: mate-platform-backend/packages/mate-app-kb
      - name: GOVERN-02 forbid_iam_dep_imports (rule 5 DEPRECATED mate_tech_iam)
        run: python scripts/ci/forbid_iam_dep_imports.py
      - name: GOVERN-07 forbid_legacy_artifacts (Spring-era residue)
        run: python scripts/ci/forbid_legacy_artifacts.py

  # v3.1 Ontology (ADR-0021 KERNEL-01 + ADR-0016 mate-tech-ont): bring the
  # mate-kernel + mate-tech-ont pytest suites under the same gate. PG-gated
  # e2e cases auto-skip without a PostgreSQL service (expected in CI: no PG
  # container in this job; local baseline ~980 passed / ~57 skipped).
  ont-kernel-tests:
    name: ont-kernel pytest (mate-kernel + mate-tech-ont)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Minimal import-closure-verified dependency set for the two suites:
      # pytest-asyncio -> @pytest.mark.asyncio under --strict-markers;
      # sqlalchemy -> mate_tech_db sqlite in-memory store (test_ont_sql_store);
      # neo4j -> legacy repo imported at module level by mate_tech_ont.main;
      # rdflib -> owl/io.py lazy import exercised by test_owl.py assertions;
      # psycopg2-binary -> import-time + PG-gated tests (skips without PG);
      # pyyaml -> tests/contracts/test_lint_sunset_headers.py (CI 上一轮实跑暴露).
      - name: install minimal deps
        run: >
          pip install pytest pytest-asyncio fastapi httpx pydantic pydantic-settings
          structlog tenacity psycopg2-binary "pyjwt[crypto]" sqlalchemy neo4j rdflib
          pyyaml
      # Root pyproject [tool.pytest.ini_options] provides pythonpath +
      # --import-mode=importlib; test files also bootstrap sys.path themselves.
      - name: mate-kernel/tests + mate-tech-ont/tests
        run: python -m pytest packages/mate-kernel/tests packages/mate-tech-ont/tests -q
        working-directory: mate-platform-backend

  # rule 6 + GOVERN-06: PostgreSQL FORCE RLS must execute as a real
  # non-superuser. The dedicated test database is created inside this job and
  # is never shared with application data.
  ga-014-ont-rls:
    name: ga-014 Ontology PostgreSQL RLS isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meta
          POSTGRES_PASSWORD: meta
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meta -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: python -m pip install uv
      - name: Install Ontology workspace dependencies
        run: uv sync --directory mate-platform-backend --package mate-tech-ont --dev --frozen
      - name: Run non-privileged PostgreSQL RLS acceptance
        run: bash scripts/ci/verify_ont_rls.sh
        env:
          ONT_RLS_ADMIN_DSN: postgresql://meta:meta@localhost:5432/postgres
          PG_DSN: postgresql://mate_ont_test:mate_ont_test@localhost:5432/metaplatform_ont_test

  # ── 1.6 任务 3：Agent 产品层（mate-tech-agent-team）测试进 CI ──────────
  # 此前这 246 条用例从未在任何 workflow 里跑过（CI 只跑 tests/architecture
  # 与 packages/mate-platform）。没有门禁的测试等于没写——写在这里是因为
  # 它和 ont-kernel / mate-platform 一样，是「包测试套件进 CI」这一类。
  #
  # **不设 continue-on-error**：这一条必须能真的把流水线弄红，否则等于没进。
  agent-team-tests:
    name: agent-team pytest (mate-tech-agent-team)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 带 PG 是为了让**租户隔离**那批断言真跑起来：RLS 的隔离只有非超级角色
    # （mate_app）在真库上验得了，内存替身只能证明"命名不同"。测试没有 PG 时
    # 会 skip 而不是 fail，所以服务起不来也不会误判成"代码坏了"。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meta
          POSTGRES_PASSWORD: meta
          POSTGRES_DB: metaplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meta -d metaplatform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: python -m pip install uv
      # 依赖闭包一次从 workspace 锁文件解出来（不做手工 pip 清单：本仓已连续
      # 6 轮被手工清单漏项咬过，见 ga-hooks-and-tests 的注释）。
      - name: Install agent-team workspace dependencies (frozen)
        run: uv sync --directory mate-platform-backend --package mate-tech-agent-team --dev --frozen
      # conftest 的 PG 断言用 mate_app 连（非超级、非 BYPASSRLS）；用 meta 测
      # 会假通过。角色不存在时夹具 skip，所以这一步用 IF NOT EXISTS 语义写。
      - name: Create the non-superuser role the RLS assertions need
        run: |
          PGPASSWORD=meta psql -h 127.0.0.1 -U meta -d metaplatform -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='mate_app') THEN CREATE ROLE mate_app LOGIN PASSWORD 'mate_app'; END IF; END \$\$;"
      - name: mate-tech-agent-team/tests
        run: uv run --directory mate-platform-backend/packages/mate-tech-agent-team pytest -q

  # API 网关是全平台的入口热点，改动没有门禁等于没写。这套件同样此前不在
  # 任何 workflow 里。少而快（MockTransport，不起真上游），放进同一个文件。
  api-gateway-tests:
    name: api-gateway pytest (mate-api-gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: python -m pip install uv
      - name: Install gateway workspace dependencies (frozen)
        run: uv sync --directory mate-platform-backend --package mate-api-gateway --dev --frozen
      - name: mate-api-gateway/tests
        run: uv run --directory mate-platform-backend/services/api-gateway pytest -q

  # rule 7: 契约或集成测试跳过不标记 Accepted（forbid_skip_tests）
  ga-007-skip-tests:
    name: ga-007 forbid_skip_tests (rule 7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pre-commit
      - run: python scripts/ci/forbid_skip_tests.py

  # rule 10: 所有状态以验收证据为准（require_evidence）
  ga-010-evidence:
    name: ga-010 require_evidence (rule 10)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pre-commit
      - run: python scripts/ci/require_evidence.py

  # rule 2: requirement ID coverage
  ga-002-requirement-ids:
    name: ga-002 requirement IDs present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/ci/validate_requirement_coverage.py
