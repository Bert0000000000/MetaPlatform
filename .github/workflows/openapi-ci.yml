name: OpenAPI Contract CI

on:
  push:
    paths:
      - "mate-platform-backend/contracts/**"
      - "mate-platform-backend/packages/**/src/**"
      - "mate-platform-backend/services/**/src/**"
      - "docs/active/prd/**"
      - "docs/swagger/**"
      - ".github/workflows/openapi-ci.yml"
  pull_request:
    paths:
      - "mate-platform-backend/contracts/**"
      - "mate-platform-backend/packages/**/src/**"
      - "mate-platform-backend/services/**/src/**"
      - "docs/active/prd/**"
      - "docs/swagger/**"

jobs:
  lint-and-bundle:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mate-platform-backend/contracts}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: mate-platform-backend/contracts/package-lock.json}
      - run: npm ci
      - run: npm run check
      - name: Verify generated bundle is committed
        working-directory: .
        run: git diff --exit-code -- mate-platform-backend/contracts/openapi/generated/bundled.yaml

  traceability:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mate-platform-backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest PyYAML
      - run: python contracts/scripts/validate_contracts.py
      - run: python contracts/scripts/validate_traceability.py
      - run: python -m pytest contracts/tests -q

  runtime-parity:
    runs-on: ubuntu-latest
    env:
      LEGACY_LOGIN_COMPAT: "true"
      KEYCLOAK_URL: "http://keycloak:8080"
      INSECURE_SKIP_SIGNATURE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install backend deps
        run: |
          pip install -r mate-platform-backend/requirements.txt
          # requirements.txt (7/28 export) 缺 structlog 等；runtime_openapi 导入的
          # 服务模块依赖它们。uv sync 会尝试构建 deep-research 等 workspace 成员
          # 触发 Failed to parse entry，故用 requirements + 补装。
          pip install structlog PyYAML prometheus_client prometheus-fastapi-instrumentator
      - run: python mate-platform-backend/contracts/scripts/runtime_openapi.py
      - run: python mate-platform-backend/contracts/scripts/compare_runtime.py

  breaking-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compare base and head with oasdiff
        shell: bash
        run: |
          if git show "origin/${{ github.base_ref }}:mate-platform-backend/contracts/openapi/generated/bundled.yaml" > /tmp/base-openapi.yaml 2>/dev/null; then
            docker run --rm -v "$PWD:/repo" -v /tmp:/tmp tufin/oasdiff:latest breaking /tmp/base-openapi.yaml /repo/mate-platform-backend/contracts/openapi/generated/bundled.yaml --fail-on ERR
          else
            echo "No canonical base contract exists; establishing the first oasdiff baseline."
          fi
