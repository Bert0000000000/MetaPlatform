name: OpenAPI Contract CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, codex/**]
    # CD waits for contracts on the same SHA, including frontend/infra-only changes.
  pull_request:
    # **刻意不加 `paths:` 过滤**（A-5 收紧 required 的前提，同 1.7 对
    # `python-ci.yml` 的处理）：`breaking-change`（契约破坏性变更门禁）是
    # `main` 的 required check。工作流级 `paths:` 会让不碰契约的 PR 根本不触发
    # 本工作流，那条 required check 就永远停在 "Expected — Waiting for status
    # to be reported"，PR 永久卡 pending。代价是文档类 PR 也跑一遍契约检查。

jobs:
  lint-and-bundle:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mate-platform-backend/contracts } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: mate-platform-backend/contracts/package-lock.json,
          }
      # MP-CONTRACT-COVERAGE-01（closeout 批）：platform.yaml 是**生成物**
      # （build_platform.py 按 manifest 重建）。2.1-C §3-C1 的教训：它曾经靠手工
      # 维护，于是 manifest 里加了 agent-team / deep-research / orchestrator 之后
      # 没人重建 platform.yaml——breaking-change job 对这三个服务**名义覆盖**了
      # 三个月。这道门让"改 manifest / 加服务而不重建"当场红。
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install PyYAML
      - name: Verify platform.yaml is regenerated & committed fresh
        run: |
          python scripts/build_platform.py
      - name: Diff platform.yaml (manifest coverage must be committed)
        working-directory: .
        run: git diff --exit-code -- mate-platform-backend/contracts/openapi/platform.yaml
      - run: npm ci
      - run: npm run check
      - name: Verify generated bundle is committed
        working-directory: .
        run: git diff --exit-code -- mate-platform-backend/contracts/openapi/generated/bundled.yaml

  traceability:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mate-platform-backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pytest PyYAML
      - run: python contracts/scripts/validate_contracts.py
      - run: python contracts/scripts/validate_traceability.py
      # GOVERN-03 / 03-05: every v1 ontology endpoint must carry
      # x-sunset + x-migration-target. Fail on missing annotations.
      - name: Lint ontology sunset headers (GOVERN-03)
        run: python contracts/scripts/lint_sunset_headers.py
      - run: python -m pytest contracts/tests -q

  runtime-parity:
    runs-on: ubuntu-latest
    env:
      LEGACY_LOGIN_COMPAT: "true"
      KEYCLOAK_URL: "http://keycloak:8080"
      INSECURE_SKIP_SIGNATURE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install uv
        run: python -m pip install uv
      # 依赖闭包一次性从 workspace 锁文件装全（2026-09-10 修复）：
      # 旧的 requirements.txt + pip 补装路线拿不到 a2a-sdk（ModuleNotFoundError:
      # a2a），且逐包打地鼠维护不住。--all-packages 安装全部 workspace 成员
      # + 根依赖，覆盖 runtime_openapi.py 全部 19 个 runtimeModule 的导入
      # 闭包（structlog / langgraph / mcp / rdflib / a2a-sdk / ...）。
      # 注：早期「uv sync 构建失败」的备注已过时 —— 全 workspace 锁文件
      # 现可完整解析构建（本地已验证）。
      - name: Sync backend dependency closure from lockfile
        run: uv sync --directory mate-platform-backend --frozen --no-dev --all-packages
      - run: uv run --directory mate-platform-backend --no-sync python contracts/scripts/runtime_openapi.py
      - run: uv run --directory mate-platform-backend --no-sync python contracts/scripts/compare_runtime.py

  breaking-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install exact oasdiff 1.33.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/oasdiff-tool
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz \
            --output .ci/oasdiff-1.33.0.tar.gz
          echo "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247  .ci/oasdiff-1.33.0.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file .ci/oasdiff-1.33.0.tar.gz --directory .ci/oasdiff-tool oasdiff
          echo "fa65aae43c867e9f79da9cb121d3c1a113637883afe014c0680fd5b50696f416  .ci/oasdiff-tool/oasdiff" | sha256sum --check --strict
          chmod 700 .ci/oasdiff-tool/oasdiff
          python -m pip install PyYAML pytest
      - name: Extract canonical base contract
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git show "origin/${BASE_REF}:mate-platform-backend/contracts/openapi/generated/bundled.yaml" > .ci/base.yaml
      - name: Verify exact approval guard against real oasdiff
        env:
          OASDIFF_BIN: ${{ github.workspace }}/.ci/oasdiff-tool/oasdiff
          OASDIFF_SHA256: fa65aae43c867e9f79da9cb121d3c1a113637883afe014c0680fd5b50696f416
        run: |
          python -m pytest mate-platform-backend/contracts/scripts/tests/test_mp11_oasdiff_review.py \
            -q --basetemp .ci/oasdiff-regression-temp
      - name: Compare contracts with exact reviewed approvals
        shell: bash
        run: |
          python mate-platform-backend/contracts/scripts/check_mp11_oasdiff.py \
            --base .ci/base.yaml \
            --revision mate-platform-backend/contracts/openapi/generated/bundled.yaml \
            --manifest mate-platform-backend/contracts/openapi/oasdiff-mp11-diagnostics-review.yaml \
            --repo-root . \
            --oasdiff .ci/oasdiff-tool/oasdiff \
            --oasdiff-sha256 fa65aae43c867e9f79da9cb121d3c1a113637883afe014c0680fd5b50696f416 \
            --report .ci/mp11-oasdiff-review.json
      - name: Upload bounded contract review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mp11-oasdiff-openapi-${{ github.run_id }}
          path: .ci/mp11-oasdiff-review.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
