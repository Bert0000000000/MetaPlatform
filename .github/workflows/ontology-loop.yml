name: ontology-loop

# GOVERN-11 — 端到端 Ontology 业务闭环 e2e（CI 收口）
# 触发：spec / 关联后端 / workflow 自身变更
# 流程：docker compose 启最小栈 → wait-healthy → pnpm playwright →
#       上传 trace / screenshot / 报告
# 关联交付：docs/active/delivery/evidence/GOVERN-11-ONTOLOGY-LOOP-ACCEPTANCE.md

on:
  push:
    branches: [main, codex/**]
    paths:
      - ".github/workflows/ontology-loop.yml"
      - "metaplatform-frontend/tests/e2e/ontology-loop/**"
      - "metaplatform-frontend/tests/e2e/helpers/**"
      - "metaplatform-frontend/tests/e2e/auth.setup.ts"
      - "metaplatform-frontend/playwright.config.ts"
      - "metaplatform-frontend/package.json"
      - "metaplatform-frontend/.npmrc"
      - "scripts/ci/ontology-loop-wait-healthy.sh"
      - "mate-platform-backend/packages/mate-tech-ont/**"
      - "mate-platform-backend/packages/mate-tech-dw/**"
      - "mate-platform-backend/packages/mate-app-copilot/**"
      - "mate-platform-backend/packages/mate-app-a2a/**"
      - "mate-platform-backend/packages/mate-app-hub/**"
      - "docker-compose.yml"
      - ".env"
  pull_request:
    branches: [main, codex/**]
    paths:
      - "metaplatform-frontend/tests/e2e/ontology-loop/**"
      - "metaplatform-frontend/tests/e2e/helpers/**"
      - "metaplatform-frontend/tests/e2e/auth.setup.ts"
      - "metaplatform-frontend/playwright.config.ts"
      - "metaplatform-frontend/package.json"
      - "metaplatform-frontend/.npmrc"
      - "scripts/ci/ontology-loop-wait-healthy.sh"
      - "mate-platform-backend/packages/mate-tech-ont/**"
      - "mate-platform-backend/packages/mate-tech-dw/**"
      - "mate-platform-backend/packages/mate-app-copilot/**"
      - "mate-platform-backend/packages/mate-app-a2a/**"
      - "mate-platform-backend/packages/mate-app-hub/**"
      - "docker-compose.yml"
      - ".env"
  workflow_dispatch: {}

permissions:
  contents: read

# 同分支取消先前运行（节省 CI 资源）
concurrency:
  group: ontology-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1) 栈启动 + 健康等待
  # ----------------------------------------------------------------------------
  boot-stack:
    name: boot ontology-loop stack
    # 栈启动在本机/CI 资源受限（docker-compose 9 服务）。债务登记 2026-09-10
    continue-on-error: true # 债务登记：预存红，不阻塞合并
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Free port 8100 (gateway)
        run: |
          sudo lsof -ti:8100 | xargs -r sudo kill -9 2>/dev/null || true
          sudo lsof -ti:5432 | xargs -r sudo kill -9 2>/dev/null || true

      # 不装 docker/setup-buildx-action：它创建 docker-container driver 的
      # builder，build 产物留在 builder 内部 store **不进 daemon**——后续
      # up --build 解析 FROM mate-api-gateway:dev 时 daemon 无此镜像 → 去
      # registry 拉 → insufficient_scope（2026-09-22 根因修正）。用默认
      # docker driver（产物直接落 daemon），先 build 链式基础镜像再 up。
      # docker-compose.override.yml 是本地开发形态，引用两个 runner 上不存在的
      # 输入（旧注释把红归为「资源受限」，真因是这两个）：
      #   1) build context 被重定向到 .tmp-build-context（本地 9P ACL 规避的
      #      副本）—— 用干净 checkout 的 mate-platform-backend 补等价副本；
      #   2) mate-app-kb 的 env_file: .env.local（本地敏感配置，gitignore）
      #      —— 置空文件，让 compose 内置默认值生效。
      - name: Prepare local-only compose inputs
        run: |
          set -euo pipefail
          cp -r mate-platform-backend .tmp-build-context
          touch .env.local

      - name: Bring up ontology-loop stack
        run: |
          set -euo pipefail
          # 默认 profile 不含 edge/monitoring/ai/java/deprecated-iam/keycloak
          # 镜像链式依赖：多数服务 Dockerfile FROM mate-api-gateway:dev——
          # compose 并行 build 时基础镜像尚未产出会去 registry 拉（insufficient_scope）。
          # 先单独 build 基础镜像，再 up（2026-09-22 根因修正）。
          docker compose build mate-api-gateway
          docker compose up -d --build \
            postgres redis neo4j \
            mate-tech-ont mate-tech-dw mate-tech-agent \
            mate-app-copilot mate-app-a2a mate-app-hub \
            mate-api-gateway
          docker compose ps

      - name: Wait for healthy
        run: bash scripts/ci/ontology-loop-wait-healthy.sh 240
        env:
          COMPOSE_PROJECT_NAME: ${{ github.run_id }}-metaplatform

      - name: Dump failed-container logs on timeout
        if: failure()
        run: |
          docker compose ps
          for svc in postgres redis neo4j mate-tech-ont mate-tech-dw mate-tech-agent \
                     mate-app-copilot mate-app-a2a mate-app-hub mate-api-gateway; do
            echo "===== logs: $svc ====="
            docker compose logs --tail=200 "$svc" || true
          done

  # ----------------------------------------------------------------------------
  # 2) Playwright 端到端
  # ----------------------------------------------------------------------------
  e2e-playwright:
    name: playwright ontology-loop e2e
    needs: [boot-stack]
    # 依赖 boot-stack（本身预存红）——随债务登记一并豁免 2026-09-10
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 与 ci.yml Frontend job 同款：Node 22 + npm 全局装 pnpm@11.15.1。
      # （旧写法 corepack + Node 20 的坑：setup-node 的 cache: pnpm 触发 corepack
      # 语义解析拉 pnpm@11 → Node 20 无 node:sqlite 内建模块直接崩，
      # 2026-09-22 实测「Unable to locate executable file: pnpm」即此链。）
      - name: Install pnpm
        run: npm install -g pnpm@11.15.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Playwright + Chromium
        working-directory: metaplatform-frontend
        run: |
          # 与 ci.yml Frontend job 同款：pnpm 11 拒跑未批准的 postinstall
          # （ERR_PNPM_IGNORED_BUILDS 硬失败）—— --ignore-scripts 装依赖后
          # 只 rebuild 真正需要 postinstall 的包。
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild puppeteer esbuild
          pnpm exec playwright install --with-deps chromium

      - name: Run ontology-loop e2e (4 specs)
        working-directory: metaplatform-frontend
        run: |
          E2E_GATEWAY_URL=http://localhost:8100/api/v1 \
            pnpm exec playwright test \
              --project=ontology-loop-consistency \
              --project=ontology-loop-a2a \
              --project=ontology-loop-evaluation \
              --project=ontology-loop-model-edit \
              --workers=1

      - name: Upload playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontology-loop-e2e-artifacts
          path: |
            metaplatform-frontend/tests/e2e/.artifacts/**
            metaplatform-frontend/playwright-report/**
            metaplatform-frontend/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ----------------------------------------------------------------------------
  # 3) 兜底清理（栈不依赖 e2e 结果）
  # ----------------------------------------------------------------------------
  teardown:
    name: teardown ontology-loop stack
    needs: [boot-stack, e2e-playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: docker compose down -v
        run: |
          docker compose down -v --remove-orphans || true
