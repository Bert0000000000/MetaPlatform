name: ontology-loop

# ============================================================================
# ONTOLOGY-CORE-E2E —— 本体核心闭环验收（真实栈，单 Job）
#
# 历史问题（本批修复）：
#   1. 启动 / 健康 / 前端 / 测试**跨 Job** 通过 localhost 假定共享 Docker 环境
#      —— GitHub 每个 Job 是独立 Runner，localhost 不共享 → 必然失败；
#   2. 启动清单缺少真实登录所需的 keycloak + mate-auth-service → 登录无从成功；
#      同时多起了 Agent / LLM / A2A / DW / Copilot 等**本体闭环不需要**的服务；
#   3. 整条路径长期 `continue-on-error: true`，红了也没人管。
#
# 现在：一切在**同一个 Job** 内完成（启动 → 健康 → 前端 → 测试 → always 清理），
#   只起本体闭环最小依赖，跑 `ontology-loop-core` 项目，**不再 continue-on-error**。
#   同一套命令可在本地复现：`scripts/ci/ontology-core-e2e.sh all`（或 E2E_REUSE=1 …test）。
# ============================================================================

on:
  push:
    branches: [main, codex/**]
    # Every main release must execute the actual browser acceptance before CD.
  pull_request:
    # 不加 paths 过滤：本 job 需要能作为 Required Check 在所有 PR 上报到
    # （带 paths 会让不相关的 PR 永远 pending → 阻塞合并）。
    branches: [main, codex/**]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ontology-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ontology-core-e2e:
    name: ontology core e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Every compose consumer, including browser helpers, uses this isolated CI configuration.
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml:.tmp/ontology-core-ci.compose.json
    steps:
      - uses: actions/checkout@v4

      - name: Free ports
        run: |
          for p in 8100 8007 5432 6379 7687 8180; do
            sudo lsof -ti:$p | xargs -r sudo kill -9 2>/dev/null || true
          done

      - name: Install pnpm
        run: npm install -g pnpm@11.15.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: metaplatform-frontend/pnpm-lock.yaml

      - name: Install frontend deps + Chromium
        working-directory: metaplatform-frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild puppeteer esbuild
          pnpm exec playwright install --with-deps chromium

      - name: MP11 web unit, type and production build
        working-directory: metaplatform-frontend/apps/web
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: |
          pnpm exec vitest run
          pnpm exec tsc --noEmit
          pnpm run build
          pnpm exec vitest run --root ../../packages/shared --environment jsdom src/components/SharedLoginPage.test.tsx

      # Deliberate split: this ephemeral Linux stack runs ontology-loop-core.
      # The signed MP11 DATA/AppHub/relationship/application/website projects
      # run via scripts/acceptance/mp11/playwright.config.ts on the isolated
      # candidate, with private issuer inputs and exact owned resource guards.
      # Do not silently add those files to a project whose testDir ignores them.
      # docker-compose.override.yml 引用本地敏感文件（.env.local，gitignore）；
      # 脚本的 prepare_env 会生成等价的最小 .env / 空 .env.local。
      - name: Prepare compose inputs
        run: |
          cp -r mate-platform-backend .tmp-build-context

      - name: Prepare a restricted, consistent Ontology database
        run: |
          python3 - <<'PY'
          import json
          import secrets
          from pathlib import Path

          root = Path('.tmp')
          root.mkdir(exist_ok=True)
          password = secrets.token_hex(24)
          print(f'::add-mask::{password}')
          role = 'ontology_core_ci'
          dsn = f'postgresql://{role}:{password}@postgres:5432/metaplatform_ont'
          (root / 'ontology-core-app.sql').write_text(
              f"CREATE ROLE {role} LOGIN PASSWORD '{password}' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;\n"
              f"GRANT CONNECT ON DATABASE metaplatform_ont TO {role};\n"
              "\\connect metaplatform_ont\n"
              "CREATE EXTENSION IF NOT EXISTS vector;\n"
              f"GRANT USAGE, CREATE ON SCHEMA public TO {role};\n"
              f"ALTER DEFAULT PRIVILEGES FOR ROLE meta IN SCHEMA public GRANT SELECT ON TABLES TO {role};\n",
              encoding='utf-8',
          )
          (root / 'ontology-core-ci.compose.json').write_text(json.dumps({'services': {
              'postgres': {'volumes': ['./.tmp/ontology-core-app.sql:/docker-entrypoint-initdb.d/99-ontology-core-app.sql:ro']},
              'mate-tech-ont': {'environment': {
                  'KERNEL_PG_DSN': dsn, 'PG_DSN': dsn, 'ONT_MODELING_SOURCE_DSN': dsn,
              }},
          }}), encoding='utf-8')
          PY

      - name: Boot ontology-core stack + wait healthy
        run: bash scripts/ci/ontology-core-e2e.sh up && bash scripts/ci/ontology-core-e2e.sh wait

      - name: Verify packaged source dependencies and restricted database identity
        run: |
          docker compose exec -T mate-tech-ont python - <<'PY'
          import os
          import psycopg2
          import mate_tech_data
          import mate_tech_db
          print('Ontology source reader dependencies: packaged and importable')
          identities = []
          for name in ('KERNEL_PG_DSN', 'ONT_MODELING_SOURCE_DSN'):
              with psycopg2.connect(os.environ[name]) as conn, conn.cursor() as cursor:
                  cursor.execute('SELECT current_database(), current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user')
                  identity = cursor.fetchone()
                  assert identity[0] == 'metaplatform_ont' and identity[1] == 'ontology_core_ci'
                  assert not identity[2] and not identity[3], 'Ontology runtime must obey RLS'
                  identities.append(identity)
          assert identities[0] == identities[1], 'Modeling staging must use the native database and role'
          print('Native storage and modeling reader: same database, NOSUPERUSER, NOBYPASSRLS')
          PY

      - name: Run ontology core e2e
        run: bash scripts/ci/ontology-core-e2e.sh test

      - name: Collect both required migration browser cases
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        run: |
          mkdir -p test-results
          pnpm exec playwright test --config playwright.migration.config.ts --list --reporter=./migration-list-reporter.ts
          python3 ../scripts/ci/verify_migration_browser.py --list test-results/migration-list.json

      - name: Execute both required migration browser cases
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:9200
          E2E_GATEWAY_URL: http://127.0.0.1:8100/api/v1
          E2E_GATEWAY: http://127.0.0.1:8100/api/v1
          E2E_IAM_LOGIN_URL: http://127.0.0.1:8100/api/v1/iam/auth/login
        run: pnpm exec playwright test --config playwright.migration.config.ts

      - name: Require executed migration JUnit with zero skips
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/verify_migration_browser.py --junit metaplatform-frontend/test-results/migration.xml

      - name: Collect exact Builder V2 browser inventory
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        run: |
          pnpm exec playwright test --config playwright.builder.config.ts --list
          python3 ../scripts/ci/verify_builder_browser.py --list test-results/builder-list.json

      - name: Prepare nonprivileged Builder source fixture owner
        id: builder-source-fixture
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          fixture_password="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          printf '::add-mask::%s\n' "$fixture_password"
          docker compose exec -T postgres psql -U meta -d metaplatform_ont --quiet --set=ON_ERROR_STOP=1 --set=fixture_password="$fixture_password" <<'SQL'
          CREATE ROLE builder_source_fixture LOGIN PASSWORD :'fixture_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE metaplatform_ont TO builder_source_fixture;
          GRANT USAGE, CREATE ON SCHEMA public TO builder_source_fixture;
          SQL
          printf 'password=%s\n' "$fixture_password" >> "$GITHUB_OUTPUT"

      - name: Execute Builder V2 page and navigation behavior
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:9200
          E2E_GATEWAY_URL: http://127.0.0.1:8100/api/v1
          E2E_IAM_LOGIN_URL: http://127.0.0.1:8100/api/v1/iam/auth/login
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: metaplatform_ont
          PGUSER: builder_source_fixture
          PGPASSWORD: ${{ steps.builder-source-fixture.outputs.password }}
        run: |
          pnpm exec playwright test --config playwright.builder.config.ts --workers=1
          python3 ../scripts/ci/verify_builder_browser.py --list test-results/builder-list.json --junit test-results/builder.xml

      - name: Upload safe Builder V2 inventory and result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-v2-safe-results
          path: |
            metaplatform-frontend/test-results/builder-list.json
            metaplatform-frontend/test-results/builder.xml
            metaplatform-frontend/test-results/builder-results.json
            metaplatform-frontend/test-results/builder-artifacts/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Execute Excel modeling publication and sync browser cases
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:9200
          E2E_GATEWAY: http://127.0.0.1:8100/api/v1
          E2E_IAM_LOGIN_URL: http://127.0.0.1:8100/api/v1/iam/auth/login
        run: pnpm exec playwright test --config playwright.modeling.config.ts

      - name: Require all seven executed modeling browser cases with zero skips
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('metaplatform-frontend/test-results/modeling.xml').getroot().iter('testcase'))
          assert len(cases) == 7, f'Expected 7 modeling browser cases, found {len(cases)}'
          assert all('ontology-from-data.spec.ts' in case.get('classname', '') for case in cases)
          assert not any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error'))
          print('Modeling browser gate: 7 executed, 0 skipped')
          PY

      - name: Dump container logs
        if: failure()
        run: |
          docker compose ps -a || true
          for svc in postgres redis neo4j keycloak mate-auth-service mate-tech-ont mate-api-gateway; do
            echo "===== logs: $svc ====="
            docker compose logs --tail=200 "$svc" || true
          done

      # Real-auth traces/video/screenshots are disabled in the core spec.
      # Do not upload broad playwright directories containing session material.

      - name: Teardown (always)
        if: always()
        run: bash scripts/ci/ontology-core-e2e.sh down
