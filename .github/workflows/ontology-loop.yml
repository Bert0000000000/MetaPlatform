name: ontology-loop

# ============================================================================
# ONTOLOGY-CORE-E2E —— 本体核心闭环验收（真实栈，单 Job）
#
# 历史问题（本批修复）：
#   1. 启动 / 健康 / 前端 / 测试**跨 Job** 通过 localhost 假定共享 Docker 环境
#      —— GitHub 每个 Job 是独立 Runner，localhost 不共享 → 必然失败；
#   2. 启动清单缺少真实登录所需的 keycloak + mate-auth-service → 登录无从成功；
#      同时多起了 Agent / LLM / A2A / DW / Copilot 等**本体闭环不需要**的服务；
#   3. 整条路径长期 `continue-on-error: true`，红了也没人管。
#
# 现在：一切在**同一个 Job** 内完成（启动 → 健康 → 前端 → 测试 → always 清理），
#   只起本体闭环最小依赖，跑 `ontology-loop-core` 项目，**不再 continue-on-error**。
#   同一套命令可在本地复现：`scripts/ci/ontology-core-e2e.sh all`（或 E2E_REUSE=1 …test）。
# ============================================================================

on:
  push:
    branches: [main, codex/**]
    paths:
      - ".github/workflows/ontology-loop.yml"
      - "scripts/ci/ontology-core-e2e.sh"
      - "metaplatform-frontend/tests/e2e/ontology-loop/**"
      - "metaplatform-frontend/tests/e2e/helpers/**"
      - "metaplatform-frontend/playwright.config.ts"
      - "metaplatform-frontend/playwright.migration.config.ts"
      - "metaplatform-frontend/playwright.builder.config.ts"
      - "metaplatform-frontend/builder-safe-reporter.ts"
      - "metaplatform-frontend/migration-list-reporter.ts"
      - "metaplatform-frontend/apps/web/tests/e2e/**"
      - "scripts/ci/verify_migration_browser.py"
      - "scripts/ci/verify_builder_browser.py"
      - "metaplatform-frontend/package.json"
      - "mate-platform-backend/packages/mate-tech-ont/**"
      - "mate-platform-backend/services/api-gateway/**"
      - "mate-platform-backend/services/auth-service/**"
      - "docker-compose.yml"
  pull_request:
    # 不加 paths 过滤：本 job 需要能作为 Required Check 在所有 PR 上报到
    # （带 paths 会让不相关的 PR 永远 pending → 阻塞合并）。
    branches: [main, codex/**]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ontology-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ontology-core-e2e:
    name: ontology core e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Free ports
        run: |
          for p in 8100 8007 5432 6379 7687 8180; do
            sudo lsof -ti:$p | xargs -r sudo kill -9 2>/dev/null || true
          done

      - name: Install pnpm
        run: npm install -g pnpm@11.15.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: metaplatform-frontend/pnpm-lock.yaml

      - name: Install frontend deps + Chromium
        working-directory: metaplatform-frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild puppeteer esbuild
          pnpm exec playwright install --with-deps chromium

      # docker-compose.override.yml 引用本地敏感文件（.env.local，gitignore）；
      # 脚本的 prepare_env 会生成等价的最小 .env / 空 .env.local。
      - name: Prepare compose inputs
        run: |
          cp -r mate-platform-backend .tmp-build-context

      - name: Boot ontology-core stack + wait healthy
        run: bash scripts/ci/ontology-core-e2e.sh up && bash scripts/ci/ontology-core-e2e.sh wait

      - name: Run ontology core e2e
        run: bash scripts/ci/ontology-core-e2e.sh test

      - name: Collect both required migration browser cases
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        run: |
          mkdir -p test-results
          pnpm exec playwright test --config playwright.migration.config.ts --list --reporter=./migration-list-reporter.ts
          python3 ../scripts/ci/verify_migration_browser.py --list test-results/migration-list.json

      - name: Execute both required migration browser cases
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:9200
          E2E_GATEWAY_URL: http://127.0.0.1:8100/api/v1
          E2E_GATEWAY: http://127.0.0.1:8100/api/v1
          E2E_IAM_LOGIN_URL: http://127.0.0.1:8100/api/v1/iam/auth/login
        run: pnpm exec playwright test --config playwright.migration.config.ts

      - name: Require executed migration JUnit with zero skips
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/verify_migration_browser.py --junit metaplatform-frontend/test-results/migration.xml

      - name: Collect exact Builder V2 browser inventory
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        run: |
          pnpm exec playwright test --config playwright.builder.config.ts --list
          python3 ../scripts/ci/verify_builder_browser.py --list test-results/builder-list.json

      - name: Prepare nonprivileged Builder source fixture owner
        id: builder-source-fixture
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          fixture_password="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          printf '::add-mask::%s\n' "$fixture_password"
          docker compose exec -T postgres psql -U meta -d metaplatform_ont --quiet --set=ON_ERROR_STOP=1 --set=fixture_password="$fixture_password" <<'SQL'
          CREATE ROLE builder_source_fixture LOGIN PASSWORD :'fixture_password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE metaplatform_ont TO builder_source_fixture;
          GRANT USAGE, CREATE ON SCHEMA public TO builder_source_fixture;
          SQL
          printf 'password=%s\n' "$fixture_password" >> "$GITHUB_OUTPUT"

      - name: Execute Builder V2 page and navigation behavior
        if: ${{ !cancelled() }}
        working-directory: metaplatform-frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:9200
          E2E_GATEWAY_URL: http://127.0.0.1:8100/api/v1
          E2E_IAM_LOGIN_URL: http://127.0.0.1:8100/api/v1/iam/auth/login
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: metaplatform_ont
          PGUSER: builder_source_fixture
          PGPASSWORD: ${{ steps.builder-source-fixture.outputs.password }}
        run: |
          pnpm exec playwright test --config playwright.builder.config.ts --workers=1
          python3 ../scripts/ci/verify_builder_browser.py --list test-results/builder-list.json --junit test-results/builder.xml

      - name: Upload safe Builder V2 inventory and result artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: builder-v2-safe-results
          path: |
            metaplatform-frontend/test-results/builder-list.json
            metaplatform-frontend/test-results/builder.xml
            metaplatform-frontend/test-results/builder-results.json
            metaplatform-frontend/test-results/builder-artifacts/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Dump container logs
        if: failure()
        run: |
          docker compose ps -a || true
          for svc in postgres redis neo4j keycloak mate-auth-service mate-tech-ont mate-api-gateway; do
            echo "===== logs: $svc ====="
            docker compose logs --tail=200 "$svc" || true
          done

      - name: Upload playwright artifacts (trace / screenshot / report)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ontology-core-e2e-artifacts
          # Builder uploads only its dedicated safe whitelist; keep diagnostics private.
          path: |
            metaplatform-frontend/tests/e2e/.artifacts/**
            metaplatform-frontend/playwright-report/**
            metaplatform-frontend/test-results/**
            !metaplatform-frontend/test-results/builder*
            !metaplatform-frontend/test-results/builder*/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Teardown (always)
        if: always()
        run: bash scripts/ci/ontology-core-e2e.sh down
