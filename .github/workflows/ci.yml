name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  java-backend:
    name: Java Backend (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - APP-COPILOT
          - APP-DASHBOARD
          - APP-DW
          - APP-KB
          - TECH-A2A
          - TECH-ACTION
          - TECH-AGENT
          - TECH-DATA
          - TECH-EA
          - TECH-GW
          - TECH-IAM
          - TECH-LLMGW
          - TECH-MCP
          - TECH-MSG
          - TECH-OBS
          - TECH-ONT
          - TECH-RAG
          - TECH-RULE
          - TECH-WFE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run Maven tests (${{ matrix.module }})
        working-directory: ./${{ matrix.module }}
        run: mvn -B test

  frontend:
    name: Frontend (metaplatform-frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11.15.1
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('metaplatform-frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        working-directory: ./metaplatform-frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck (affected apps)
        working-directory: ./metaplatform-frontend
        run: pnpm -r --filter './apps/*' --filter '!./apps/web' typecheck
      # Build step disabled: apps/web has 359 pre-existing errors in pages/ontology/* + pages/admin/* that predate the monorepo-shrink PR. Will be re-enabled in Phase 4.


