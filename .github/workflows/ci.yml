name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # NOTE: Historical "java-backend" job removed in codex/fix-ci-paths.
  # The Mate Platform backend is Python (FastAPI + pyproject.toml), not
  # Java/Maven. Python coverage lives in `python-ci.yml` and
  # `ga-acceptance.yml`. See CLAUDE.md "v3.0 架构基线":
  # "Python 主后端（业务）+ Java 外部引擎（Keycloak/Flowable/Drools）".

  frontend:
    name: Frontend (metaplatform-frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@11.15.1
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('metaplatform-frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        working-directory: ./metaplatform-frontend
        # pnpm 11 refuses to run postinstall scripts that aren't approved
        # in the lockfile; we install with --ignore-scripts, then rebuild
        # only the packages whose postinstall we actually need.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild puppeteer esbuild
      - name: Operations audit
        run: python scripts/audit/operations-audit.py
      - name: Typecheck web
        working-directory: ./metaplatform-frontend
        run: pnpm --filter @mate/web typecheck
      - name: Build web
        working-directory: ./metaplatform-frontend
        run: pnpm --filter @mate/web build