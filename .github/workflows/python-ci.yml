name: Python Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "mate-platform-backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "mate-platform-backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - name: Cache ruff
        uses: actions/cache@v4
        with:
          path: ~/.cache/ruff
          key: ${{ runner.os }}-ruff-${{ hashFiles('ruff.toml') }}
      - run: cd mate-platform-backend && uv sync --frozen --no-dev
      - name: Ruff check
        run: cd mate-platform-backend && uv run ruff check .
      - name: Ruff format
        run: cd mate-platform-backend && uv run ruff format --check .

  typecheck:
    name: Type check (pyright strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - run: cd mate-platform-backend && uv sync --frozen --no-dev
      - name: Install pyright
        run: cd mate-platform-backend && uv pip install pyright
      # pyright 必须在 mate-platform-backend 目录内运行以读取 pyrightconfig.json
      # （strict + extraPaths 跨包解析策略），且只检查已 strict-clean 的核心包
      # （与 ga-006-static 门禁同一集合）；全仓 strict 化（2506 处存量诊断，
      # 集中在 tests/ 与各 app 包）未完成前不扩大范围。
      - name: Run pyright
        working-directory: mate-platform-backend
        run: uv run pyright packages/mate-platform/src packages/mate-clients/src

  architecture-tests:
    name: Architecture tests (import-linter + four-layer guardrails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - run: cd mate-platform-backend && uv sync --frozen
      - name: Install import-linter
        run: cd mate-platform-backend && uv pip install import-linter
      - name: Architecture tests
        run: cd mate-platform-backend && uv run pytest tests/architecture -q
      - name: Import-linter contracts
        run: cd mate-platform-backend && uv run python scripts/architecture_check.py

  validate-yaml:
    name: Validate compose + Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # containerbase/upcoming-action 仓库已不存在（404）；此前换成的
      # `pip install docker-compose`（v1）同样跑不通 —— v1 锁 PyYAML<6，
      # 无 cp312 wheel，源码构建必炸（cython_sources AttributeError）。
      # ubuntu-latest 镜像自带 Docker Compose v2 插件（`docker compose`），
      # 直接用即可，无需任何安装步骤。
      - name: Lint compose file
        run: |
          # CI 无 .env（KEYCLOAK_CLIENT_SECRET 等 required 变量）——
          # 空值 env-file 兜底让 config 插值通过
          touch .env
          docker compose -f docker-compose.yml config --quiet
      - name: Hadolint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          # hadolint-action 单 dockerfile 键（多键即 YAML 重复键）；
          # 其余 Dockerfile 由 ignore 模式统一检查
          dockerfile: mate-platform-backend/Dockerfile
        continue-on-error: true
