name: Python Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'mate-platform-backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'mate-platform-backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ruff.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.5.11'
      - name: Cache ruff
        uses: actions/cache@v6
        with:
          path: ~/.cache/ruff
          key: ${{ runner.os }}-ruff-${{ hashFiles('ruff.toml') }}
      - run: cd mate-platform-backend && uv sync --frozen --no-dev
      - name: Ruff check
        run: cd mate-platform-backend && uv run ruff check .
      - name: Ruff format
        run: cd mate-platform-backend && uv run ruff format --check .

  typecheck:
    name: Type check (pyright strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.5.11'
      - run: cd mate-platform-backend && uv sync --frozen --no-dev
      - name: Install pyright
        run: cd mate-platform-backend && uv pip install pyright
      - name: Run pyright
        run: cd mate-platform-backend && uv run pyright

  architecture-tests:
    name: Architecture tests (import-linter + four-layer guardrails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.5.11'
      - run: cd mate-platform-backend && uv sync --frozen
      - name: Install import-linter
        run: cd mate-platform-backend && uv pip install import-linter
      - name: Architecture tests
        run: cd mate-platform-backend && uv run pytest tests/architecture -q
      - name: Import-linter contracts
        run: cd mate-platform-backend && uv run python scripts/architecture_check.py

  validate-yaml:
    name: Validate compose + Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint compose file
        uses: containerbase/upcoming-action@v1
        with:
          tool: docker-compose
      - name: Hadolint Dockerfiles
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: mate-platform-backend/Dockerfile
          dockerfile: mate-platform-backend/Dockerfile.agent
          dockerfile: mate-platform-backend/Dockerfile.app-kb
          dockerfile: mate-platform-backend/packages/mate-tech-llmgw/Dockerfile
          dockerfile: mate-platform-backend/services/api-gateway/Dockerfile
          dockerfile: mate-platform-backend/services/auth-service/Dockerfile
        continue-on-error: true
