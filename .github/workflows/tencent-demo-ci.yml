name: Tencent Demo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/tencent-demo-deploy]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: demo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    name: Demo release validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@f64d32b1cd6cc11405a74665b3dfb7bb86fea9f0 # v3
        with:
          version: "0.12.0"
      - name: Test CI gate, archive validation and recovery
        run: python -m unittest discover -s infra/demo-cloud/tests -v
      - name: Prepare disposable configuration from the backend lock
        run: python infra/demo-cloud/prepare.py
      - name: Validate the actual Compose overlay and metadata upgrade targets
        run: |
          docker compose --env-file infra/demo-cloud/private/.env -f docker-compose.yml -f infra/demo-cloud/compose.yml config --quiet
          python - <<'PY'
          import json
          import subprocess
          from urllib.parse import urlsplit
          result = subprocess.run(['docker', 'compose', '--env-file', 'infra/demo-cloud/private/.env', '-f', 'docker-compose.yml', '-f', 'infra/demo-cloud/compose.yml', 'config', '--format', 'json'], capture_output=True, check=True, text=True)
          config = json.loads(result.stdout)
          for service, module in [('mate-app-hub', 'mate_app_hub.main:app'), ('mate-tech-mcp', 'mate_tech_mcp.main:app')]:
              data = config['services'][service]
              assert data['command'][:2] == ['uvicorn', module]
              url = urlsplit(data['environment'].get('MATE_DB_URL', ''))
              assert url.scheme.split('+')[0] == 'postgresql'
              assert url.hostname == 'postgres' and url.port == 5432 and url.path == '/metaplatform' and not url.query
          print('Actual Compose consumers use the exact guarded metadata upgrade target; no credentials printed.')
          PY
      - name: Package and validate the real source archive
        run: |
          python infra/demo-cloud/bundle.py
          python - <<'PY'
          import json, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'infra/demo-cloud')
          from ci_server import unpack
          folder = Path('infra/demo-cloud/artifacts')
          manifest = json.loads((folder / 'bundle-manifest.json').read_text())
          entry = manifest['files'][0]
          with tempfile.TemporaryDirectory() as temporary:
              with (folder / entry['name']).open('rb') as stream:
                  unpack(stream, Path(temporary) / 'release', entry['sha256'])
          print('Actual source bundle validated; server credentials excluded.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-bundle-manifest
          path: infra/demo-cloud/artifacts/bundle-manifest.json
          if-no-files-found: error
          retention-days: 14
